<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>filmTCG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Fahkwang:wght@500;700&family=Mouse+Memoirs&family=Orbitron:wght@700&family=Pirata+One&family=Special+Elite&family=Spicy+Rice&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b0c10;
  --panel: #12141b;
  --panel-2: #181b24;
  --text: #f5f5f5;
  --muted: #a1a1aa;
  --border: rgba(255,255,255,0.12);
  --shadow: 0 20px 40px rgba(0,0,0,0.4);
  --card-shell: #0f1218;
  --card-base: #171b24;
  --btn-radius: 11px;
  --btn-neutral-bg: linear-gradient(160deg, rgba(37,45,66,.96), rgba(20,27,40,.94));
  --btn-neutral-bg-hover: linear-gradient(160deg, rgba(45,55,80,.98), rgba(26,35,52,.96));
  --btn-neutral-border: rgba(175,194,236,.24);
  --btn-neutral-text: #e8f0ff;
  --btn-active-bg: linear-gradient(135deg, #8f86e9, #6a8cf7 62%, #bbd0ff);
  --btn-active-border: rgba(189,208,255,.52);
  --btn-active-text: #f8fbff;
  --btn-gold-bg: linear-gradient(135deg, #ecc688, #ffcf7a);
  --btn-gold-bg-hover: linear-gradient(135deg, #f0d19d, #ffd893);
  --btn-gold-border: rgba(255,214,147,.58);
  --btn-gold-text: #2f1903;
  --btn-shadow: 0 10px 24px rgba(0,0,0,.22);
}

* { box-sizing: border-box; }

html, body {
  min-height: 100%;
}

body {
  margin: 0;
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background:
    radial-gradient(circle at top, rgba(124,58,237,.12), transparent 28%),
    radial-gradient(circle at 80% 10%, rgba(245,158,11,.08), transparent 24%),
    var(--bg);
  color: var(--text);
  min-height: 100dvh;
  overflow-x: hidden;
}

body.overlay-open {
  overflow: hidden;
}

button, a, select { font: inherit; }

.header {
  padding: 18px 20px;
  border-bottom: 1px solid var(--border);
  background: rgba(0,0,0,0.18);
  backdrop-filter: blur(10px);
  position: relative;
}

.title {
  font-size: 1.7rem;
  font-weight: 900;
  letter-spacing: -0.04em;
}

.sub {
  color: var(--muted);
  font-size: 0.92rem;
  margin-top: 4px;
}

.ticket-badge {
  position: absolute;
  top: 16px;
  right: 20px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border-radius: 999px;
  border: 1px solid rgba(251,191,36,.45);
  background: linear-gradient(135deg, rgba(251,191,36,.28), rgba(245,158,11,.16));
  color: #fffbeb;
  font-weight: 800;
  letter-spacing: 0.03em;
  box-shadow: 0 10px 22px rgba(0,0,0,.22);
}

.ticket-badge-icon {
  width: 20px;
  height: 20px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 0.8rem;
  color: #3f2d07;
  background: linear-gradient(135deg, #fbbf24, #f59e0b);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.4);
}

.nav {
  display: flex;
  gap: 10px;
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: rgba(11,12,16,0.84);
  backdrop-filter: blur(10px);
  z-index: 10;
}

.nav button,
.back-btn,
.arrow,
.filter-select,
.modal-close,
.collection-controls button {
  padding: 10px 14px;
  border: 1px solid var(--btn-neutral-border);
  border-radius: var(--btn-radius);
  background: var(--btn-neutral-bg);
  color: var(--btn-neutral-text);
  cursor: pointer;
  font-weight: 700;
  box-shadow: var(--btn-shadow);
  transition: transform 160ms ease, border-color 160ms ease, background 160ms ease, color 160ms ease, opacity 160ms ease;
}

.nav button.active {
  background: var(--btn-active-bg);
  border-color: var(--btn-active-border);
  color: var(--btn-active-text);
}

.nav button.active:hover:not(:disabled) {
  background: var(--btn-active-bg);
  border-color: var(--btn-active-border);
  color: var(--btn-active-text);
}

.nav button:hover:not(:disabled),
.back-btn:hover:not(:disabled),
.modal-close:hover:not(:disabled),
.collection-controls button:hover:not(:disabled),
.filter-select:hover:not(:disabled) {
  transform: translateY(-1px);
  background: var(--btn-neutral-bg-hover);
  border-color: rgba(202,218,252,.36);
}

.filter-select {
  appearance: none;
  border: 1px solid var(--border);
  background: var(--panel-2);
}

.arrow {
  width: 48px;
  height: 48px;
  padding: 0;
  border-radius: 999px;
  display: grid;
  place-items: center;
  font-size: 1.35rem;
  box-shadow: 0 8px 20px rgba(0,0,0,.25);
}

.arrow:hover:not(:disabled) {
  background: var(--btn-neutral-bg-hover);
  border-color: rgba(202,218,252,.36);
}

.page {
  display: none;
  padding: 20px;
  max-width: 1180px;
  margin: 0 auto;
  min-height: calc(100dvh - 154px);
}

.page.active { display: block; }

.collection-topbar {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 12px;
  align-items: center;
  background: rgba(255,255,255,.04);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 14px;
}

.collection-stats {
  display: flex;
  gap: 18px;
  flex-wrap: wrap;
}

.collection-stat { min-width: 90px; }

.collection-stat-label {
  color: var(--muted);
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.collection-stat-value {
  font-size: 1.2rem;
  font-weight: 800;
  margin-top: 2px;
}

.collection-controls {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.daily-hunts-panel {
  display: grid;
  gap: 14px;
}

.daily-hunts-list {
  display: grid;
  gap: 12px;
}

.daily-hunt-card {
  border: 1px solid var(--border);
  background: linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.015));
  border-radius: 14px;
  padding: 12px;
  display: grid;
  gap: 8px;
}

.daily-hunt-card.is-complete {
  border-color: rgba(96,165,250,.44);
  box-shadow: 0 0 0 1px rgba(96,165,250,.25) inset;
}

.daily-hunt-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

.daily-hunt-title {
  font-weight: 750;
  letter-spacing: -0.01em;
}

.daily-hunt-meta {
  color: var(--muted);
  font-size: 0.82rem;
}

.daily-hunt-progress {
  height: 8px;
  width: 100%;
  border-radius: 999px;
  overflow: hidden;
  background: rgba(148,163,184,.2);
  border: 1px solid rgba(148,163,184,.24);
}

.daily-hunt-fill {
  height: 100%;
  background: linear-gradient(90deg, #60a5fa, #c084fc);
}

.daily-hunt-summary {
  color: var(--muted);
  font-size: 0.86rem;
}

.daily-reward-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 12px;
  background: rgba(251,191,36,.08);
}

.daily-reward-copy {
  color: rgba(255,255,255,.84);
  font-size: 0.88rem;
}

.daily-claim-btn {
  padding: 10px 14px;
  border: 1px solid var(--btn-gold-border);
  border-radius: var(--btn-radius);
  color: var(--btn-gold-text);
  font-weight: 760;
  cursor: pointer;
  background: var(--btn-gold-bg);
  box-shadow: var(--btn-shadow);
  transition: transform 160ms ease, border-color 160ms ease, background 160ms ease, color 160ms ease, opacity 160ms ease;
}

.daily-claim-btn:disabled {
  cursor: default;
  opacity: 0.66;
}

.daily-claim-btn:hover:not(:disabled) {
  transform: translateY(-1px);
  background: var(--btn-gold-bg-hover);
}

.owned-pack-row {
  margin-top: 10px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

.owned-pack-label {
  color: rgba(255,255,255,.82);
  font-size: 0.8rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.owned-pack-select {
  min-width: 220px;
  max-width: 100%;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--panel-2);
  color: #fff;
  padding: 9px 12px;
}

.owned-pack-open-btn {
  border: 1px solid var(--btn-active-border);
  border-radius: var(--btn-radius);
  padding: 10px 14px;
  cursor: pointer;
  font-weight: 760;
  background: var(--btn-active-bg);
  color: var(--btn-active-text);
  box-shadow: var(--btn-shadow);
  transition: transform 160ms ease, border-color 160ms ease, background 160ms ease, color 160ms ease, opacity 160ms ease;
}

.owned-pack-open-btn:hover:not(:disabled) {
  transform: translateY(-1px);
}

.shop-panel {
  display: grid;
  gap: 14px;
}

.shop-grid {
  display: grid;
  gap: 18px;
  grid-template-columns: repeat(auto-fit, minmax(236px, 1fr));
}

.shop-item {
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px 16px 18px;
  background: linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.015));
  display: grid;
  gap: 12px;
  justify-items: center;
  align-content: start;
  position: relative;
  overflow: hidden;
}

.shop-pack-preview {
  width: 100%;
  min-height: 332px;
  padding: 12px 0 10px;
  display: grid;
  justify-items: center;
  align-content: start;
}

.shop-pack-preview .pack {
  width: 208px;
  height: 300px;
  padding: 18px 15px 22px;
  animation: none;
  transition: transform 220ms ease, filter 220ms ease;
  will-change: transform, filter;
  transform-origin: center bottom;
  --pack-copy-width: min(78%, 164px);
  --pack-copy-offset: 0px;
  --pack-title-scale: 0.74;
  --pack-tier-gap: 10px;
  --pack-tier-pad-y: 6px;
  --pack-tier-pad-x: 10px;
  --pack-tier-font-size: 0.68rem;
  --pack-count-gap: 7px;
  --pack-count-size: 0.64rem;
  --pack-cta-bottom: 28px;
  --pack-cta-size: 0.5rem;
}

.shop-item-title {
  display: none;
}

.shop-item-meta {
  color: var(--muted);
  font-size: 0.84rem;
  text-align: center;
  max-width: 22ch;
  min-height: 2.4em;
}

.shop-item.is-gold {
  grid-column: 1 / -1;
  width: min(272px, 100%);
  justify-self: center;
  padding: 18px 18px 20px;
}

.shop-item.is-gold::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 1px;
  background: linear-gradient(135deg, rgba(255,237,181,.82), rgba(245,158,11,.46) 42%, rgba(255,248,220,.88) 66%, rgba(245,158,11,.3) 100%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  mask-composite: exclude;
  pointer-events: none;
  opacity: 0.94;
}

.shop-item.is-gold .shop-pack-preview {
  min-height: 338px;
  padding-top: 14px;
}

.shop-item.is-gold .shop-item-meta {
  min-height: 0;
  max-width: 20ch;
  color: rgba(255,241,199,.84);
}

.shop-buy-btn {
  border: 1px solid var(--btn-gold-border);
  border-radius: var(--btn-radius);
  padding: 10px 14px;
  cursor: pointer;
  font-weight: 760;
  color: var(--btn-gold-text);
  background: var(--btn-gold-bg);
  box-shadow: var(--btn-shadow);
  transition: transform 160ms ease, border-color 160ms ease, background 160ms ease, color 160ms ease, opacity 160ms ease;
}

.shop-buy-btn:disabled {
  cursor: default;
  opacity: 0.62;
}

.shop-buy-btn:hover:not(:disabled) {
  transform: translateY(-1px);
  background: var(--btn-gold-bg-hover);
}

.shop-action-row {
  display: flex;
  gap: 8px;
  width: 100%;
  justify-content: center;
  flex-wrap: wrap;
}

.shop-buy-open-btn {
  border: 1px solid var(--btn-active-border);
  border-radius: var(--btn-radius);
  padding: 10px 14px;
  cursor: pointer;
  font-weight: 760;
  color: var(--btn-active-text);
  background: var(--btn-active-bg);
  box-shadow: var(--btn-shadow);
  transition: transform 160ms ease, border-color 160ms ease, background 160ms ease, color 160ms ease, opacity 160ms ease;
}

.shop-buy-open-btn:disabled {
  cursor: default;
  opacity: 0.62;
}

.shop-buy-open-btn:hover:not(:disabled) {
  transform: translateY(-1px);
}

.shop-reward-grid {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
}

.shop-reward-option {
  border: none;
  background: transparent;
  padding: 0;
  cursor: pointer;
  transition: transform 180ms ease;
}

.shop-reward-option:hover {
  transform: translateY(-4px);
}

.shop-reward-option .pack {
  width: 208px;
  height: 300px;
  padding: 18px 15px 22px;
  animation: none;
  transition: transform 220ms ease, filter 220ms ease;
  will-change: transform, filter;
  transform-origin: center bottom;
  --pack-copy-width: min(78%, 164px);
  --pack-copy-offset: 0px;
  --pack-title-scale: 0.72;
  --pack-tier-gap: 10px;
  --pack-tier-pad-y: 6px;
  --pack-tier-pad-x: 10px;
  --pack-tier-font-size: 0.66rem;
  --pack-count-gap: 7px;
  --pack-count-size: 0.62rem;
  --pack-cta-bottom: 28px;
  --pack-cta-size: 0.5rem;
}

.shop-pack-preview .pack .pack-foil,
.shop-pack-preview .pack .pack-glow,
.shop-pack-preview .pack .pack-glint,
.shop-reward-option .pack .pack-foil,
.shop-reward-option .pack .pack-glow,
.shop-reward-option .pack .pack-glint {
  display: block;
}

.shop-pack-preview .pack .pack-foil,
.shop-reward-option .pack .pack-foil {
  opacity: 0.52;
}

.shop-pack-preview .pack .pack-glint,
.shop-reward-option .pack .pack-glint {
  opacity: 0.08;
}

.shop-pack-preview .pack .pack-glow,
.shop-reward-option .pack .pack-glow {
  opacity: 0.16;
}

.shop-pack-preview .pack .pack-grain,
.shop-reward-option .pack .pack-grain {
  opacity: 0.12;
}

.shop-pack-preview .pack.shop-actors-pack {
  --pack-title-art-y: -7px;
  --pack-tier-gap: 12px;
  --pack-count-gap: 8px;
}

.shop-pack-preview .pack.shop-docs-pack {
  --pack-title-art-scale: 1.9;
  --pack-title-art-x: 2px;
  --pack-title-art-y: -44px;
  --pack-copy-offset: -14px;
  --pack-cta-bottom: 14px;
  --pack-tier-gap: 22px;
  --pack-count-gap: 15px;
}

.shop-pack-preview .pack.shop-docs-pack .pack-title-art {
  transform: translate(2px, -44px) scale(1.9) !important;
}

.shop-pack-preview .pack.shop-docs-pack .pack-copy {
  transform: translateY(-14px) !important;
}

.shop-pack-preview .pack.shop-animation-pack {
  --pack-title-art-scale: 1.08;
  --pack-title-art-y: 2px;
}

.shop-pack-preview .pack.shop-noir-pack {
  --pack-title-art-scale: 1.05;
  --pack-title-art-y: -1px;
}

.shop-item:hover .shop-pack-preview .pack,
.shop-pack-preview:hover .pack,
.shop-pack-preview .pack:hover,
.shop-reward-option:hover .pack,
.shop-reward-option .pack:hover {
  transform: translateY(-2px) scale(1.006);
  filter: saturate(1.03) brightness(1.012);
}

.shop-item:hover .shop-pack-preview .pack .pack-foil,
.shop-pack-preview:hover .pack .pack-foil,
.shop-reward-option:hover .pack .pack-foil {
  opacity: 0.68;
}

.shop-item:hover .shop-pack-preview .pack .pack-glint,
.shop-pack-preview:hover .pack .pack-glint,
.shop-reward-option:hover .pack .pack-glint {
  opacity: 0.12;
}

.shop-item:hover .shop-pack-preview .pack .pack-glow,
.shop-pack-preview:hover .pack .pack-glow,
.shop-reward-option:hover .pack .pack-glow {
  opacity: 0.2;
}

.shop-trade-row {
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 12px;
  display: flex;
  gap: 12px;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  background: rgba(255,255,255,.03);
}

.shop-trade-copy {
  color: rgba(255,255,255,.84);
  font-size: 0.86rem;
}

.shop-trade-btn {
  border: 1px solid var(--btn-gold-border);
  border-radius: var(--btn-radius);
  padding: 10px 14px;
  cursor: pointer;
  font-weight: 760;
  color: var(--btn-gold-text);
  background: var(--btn-gold-bg);
  box-shadow: var(--btn-shadow);
  transition: transform 160ms ease, border-color 160ms ease, background 160ms ease, color 160ms ease, opacity 160ms ease;
}

.shop-trade-btn:disabled {
  cursor: default;
  opacity: 0.62;
}

.shop-trade-btn:hover:not(:disabled) {
  transform: translateY(-1px);
  background: var(--btn-gold-bg-hover);
}

.shop-inventory-list {
  display: grid;
  gap: 8px;
}

.shop-inventory-item {
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 8px 10px;
  color: rgba(255,255,255,.84);
  font-size: 0.84rem;
  background: rgba(255,255,255,.03);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.shop-open-owned-btn {
  border: 1px solid var(--btn-active-border);
  border-radius: 9px;
  padding: 7px 10px;
  cursor: pointer;
  font-size: 0.78rem;
  font-weight: 760;
  color: var(--btn-active-text);
  background: var(--btn-active-bg);
  box-shadow: var(--btn-shadow);
  transition: transform 160ms ease, border-color 160ms ease, background 160ms ease, color 160ms ease, opacity 160ms ease;
}

.shop-open-owned-btn:hover:not(:disabled) {
  transform: translateY(-1px);
}

.view-toggle {
  display: inline-flex;
  padding: 4px;
  gap: 4px;
  border-radius: 12px;
  background: rgba(255,255,255,.04);
  border: 1px solid var(--border);
}

.view-toggle button {
  border: 1px solid transparent;
  border-radius: 9px;
  padding: 8px 12px;
  background: transparent;
  color: rgba(255,255,255,.76);
  cursor: pointer;
  transition: transform 160ms ease, border-color 160ms ease, background 160ms ease, color 160ms ease;
}

.view-toggle button.is-active {
  background: var(--btn-active-bg);
  border-color: var(--btn-active-border);
  color: var(--btn-active-text);
}

.pack-area {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  min-height: 520px;
  justify-content: center;
}

.pull-open-shell {
  width: 100%;
  display: grid;
  justify-items: center;
  gap: 16px;
}

.pull-open-shell.is-stage {
  grid-template-rows: auto 468px 52px;
  align-items: center;
  gap: 18px;
}

.pull-open-shell-reward.is-stage {
  grid-template-rows: auto auto 52px;
}

.pull-top-rail {
  display: grid;
  justify-items: center;
  gap: 8px;
  min-height: 58px;
}

.pull-top-rail .pack-hook {
  min-height: 30px;
  padding: 6px 12px;
  font-size: 0.7rem;
}

.pull-center-stage {
  width: 100%;
  min-height: 468px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.pull-bottom-stage {
  min-height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.pull-bottom-placeholder {
  width: min(280px, calc(100vw - 40px));
  height: 44px;
  border-radius: var(--btn-radius);
  opacity: 0;
  pointer-events: none;
}

.pull-open-rail {
  width: min(380px, calc(100vw - 28px));
  display: grid;
  justify-items: center;
  gap: 8px;
}

.pack, .card {
  width: 300px;
  height: 430px;
  border-radius: 20px;
  flex: 0 0 auto;
}

.pack {
  background: transparent;
  border: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  position: relative;
  overflow: visible;
  text-align: center;
  padding: 26px 22px 34px;
  isolation: isolate;
  transform-style: preserve-3d;
  translate: 0 0;
  animation: none;
  color: var(--pack-ink, #f8fafc);
  transition: transform 360ms cubic-bezier(.22,1,.36,1), translate 320ms cubic-bezier(.22,1,.36,1), filter 360ms cubic-bezier(.22,1,.36,1), opacity 220ms ease;
  --pack-foil-duration: 11.8s;
  --pack-foil-mid-opacity: 0.15;
  --pack-foil-peak-opacity: 0.36;
  --pack-foil-tail-opacity: 0.2;
  --pack-foil-static-opacity: 0.18;

  function normalizeBackendBase(value) {

  function detectMobileRuntime() {
    try {
      const ua = String(navigator && navigator.userAgent || '').toLowerCase();
      const mobileAgent = /iphone|ipad|ipod|android|mobile|silk|kindle|blackberry|opera mini|iemobile/.test(ua);
      const coarsePointer = typeof window.matchMedia === 'function' && window.matchMedia('(pointer: coarse)').matches;
      const narrowViewport = typeof window.matchMedia === 'function' && window.matchMedia('(max-width: 900px)').matches;
      return mobileAgent || coarsePointer || narrowViewport;
    } catch (error) {
      return false;
    }
  }

  function resolveBackendBase() {
    const params = new URLSearchParams(window.location.search);
    const queryValue = normalizeBackendBase(params.get('backend'));
    const configValue = normalizeBackendBase(window.FILMTCG_CONFIG && window.FILMTCG_CONFIG.backendBase);
    const isHostedPage = /^https?:$/.test(window.location.protocol);
    let storedValue = '';

    try {
      storedValue = normalizeBackendBase(window.localStorage.getItem('filmtcg.backendBase'));
    } catch (error) {
      storedValue = '';
    }

    const resolved = queryValue || configValue || (isHostedPage ? '' : storedValue) || DEFAULT_BACKEND_BASE;

    if (queryValue) {
      try {
        window.localStorage.setItem('filmtcg.backendBase', queryValue);
      } catch (error) {
      }
    }

    return resolved;
  }

    const message = String(error && error.message || error || '').toLowerCase();

  function trySetLocalStorage(key, value) {
    try {
      localStorage.setItem(key, value);

    } catch (error) {

    }
  }

  function saveCollection() {
    const source = Array.isArray(collection) ? collection : [];
    const compactCards = source.map(compactCardForStorage);
    const key = 'collection';
    const primary = trySetLocalStorage(key, JSON.stringify(compactCards));
    if (primary.ok) return true;
    if (!isQuotaExceededError(primary.error)) {
      console.warn('[filmTCG] saveCollection failed', primary.error);
      return false;
    }

    let keepCount = compactCards.length;
    while (keepCount > 120) {
      keepCount = Math.max(120, Math.floor(keepCount * 0.85));
      const trimmed = compactCards.slice(0, keepCount);
      const attempt = trySetLocalStorage(key, JSON.stringify(trimmed));
      if (attempt.ok) {
        collection = source.slice(0, keepCount);
        showToast('Storage was full on this device. Kept most recent cards.');
        return true;
      }
    }

    console.warn('[filmTCG] saveCollection quota fallback exhausted', primary.error);
    return false;
  }

  function sanitizeShowcaseKeys(keys, allowedKeySet) {
    const list = Array.isArray(keys) ? keys : [];
    const allow = allowedKeySet instanceof Set ? allowedKeySet : null;
    const seen = new Set();
    const cleaned = [];
    for (let i = 0; i < list.length; i += 1) {
      const key = String(list[i] || '').trim().toLowerCase();
      if (!key || seen.has(key)) continue;
      if (allow && !allow.has(key)) continue;
      seen.add(key);
      cleaned.push(key);
      if (cleaned.length >= MAX_SHOWCASE_SIZE) break;
    }
    return cleaned;
  }

  function areKeyListsEqual(a, b) {
    if (!Array.isArray(a) || !Array.isArray(b)) return false;
    if (a.length !== b.length) return false;
    for (let i = 0; i < a.length; i += 1) {
      if (a[i] !== b[i]) return false;
    }
    return true;
  }

  function aggregateCollectionEntries(cards) {
    const grouped = new Map();
    (Array.isArray(cards) ? cards : []).forEach(function (card, rawIndex) {
      const key = cardKey(card);
      if (!key) return;
      const existing = grouped.get(key);
      if (existing) {
        existing.count += 1;
        return;
      }
      grouped.set(key, {
        key: key,
        card: card,
        count: 1,
        rawIndex: rawIndex
      });
    });
    return Array.from(grouped.values());
  }

    const roleSuffix = type === 'person'

    const now = new Date();

  function hashStringSeed(value) {
    let hash = 2166136261;
    const text = String(value || '');
    for (let i = 0; i < text.length; i += 1) {
      hash ^= text.charCodeAt(i);
      hash = Math.imul(hash, 16777619);
    }
    return hash >>> 0;
  }

  function createSeededRng(seed) {
    let state = (Number(seed) >>> 0) || 1;
    return function () {
      state = (Math.imul(state, 1664525) + 1013904223) >>> 0;
      return state / 4294967296;
    };
  }

  function seededShuffle(items, rng) {
    const source = Array.isArray(items) ? items.slice() : [];
    for (let i = source.length - 1; i > 0; i -= 1) {
      const swapIndex = Math.floor((rng ? rng() : Math.random()) * (i + 1));
      const temp = source[i];
      source[i] = source[swapIndex];
      source[swapIndex] = temp;
    }
    return source;
  }

  function randomIntWithRng(rng, min, max) {
    const low = Math.min(Number(min) || 0, Number(max) || 0);
    const high = Math.max(Number(min) || 0, Number(max) || 0);
    return low + Math.floor((rng ? rng() : Math.random()) * ((high - low) + 1));
  }

      },
      {
        id: 'epic_plus',
        type: 'epic_plus',
        target: epicTarget,
        label: 'Pull ' + String(epicTarget) + ' Epic+ card',
        detail: 'Epic or Legendary.'
      },
      {
        id: 'new_unique',
        type: 'new_unique',
        target: uniqueTarget,
        label: 'Find ' + String(uniqueTarget) + ' new cards',
        detail: 'New to your collection only.'
      },
      {
        id: 'theme_cards:' + themeTag,
        type: 'theme_cards',
        target: themeTarget,
        meta: { tag: themeTag },
        label: 'Pull ' + String(themeTarget) + ' ' + dailyThemeLabel(themeTag) + ' cards',
        detail: 'Film cards in that lane.'
      }
    ];

    const stretchTemplates = [
      {
        id: 'open_theme_packs:' + packThemeTag,
        type: 'open_theme_packs',
        target: themedPackOpenTarget,
        meta: { theme: packThemeTag },
        label: 'Open ' + String(themedPackOpenTarget) + ' ' + dailyThemeLabel(packThemeTag) + ' packs',
        detail: 'Reward picks and shop buys both count.'
      },
      {
        id: 'legendary_cards',
        type: 'legendary_cards',
        target: legendaryTarget,
        label: 'Pull ' + String(legendaryTarget) + ' Legendary card',
        detail: 'A proper daily chase.'
      }
    ];

    const primary = templates[0];
    const stretch = stretchTemplates[Math.floor(rng() * stretchTemplates.length)] || stretchTemplates[0];
    const options = seededShuffle(templates.slice(1).filter(function (hunt) {
      if (hunt.type === stretch.type) return false;
      if (stretch.type === 'open_theme_packs' && hunt.type === 'theme_cards') {
        return String(hunt && hunt.meta && hunt.meta.tag || '') !== String(stretch && stretch.meta && stretch.meta.theme || '');
      }
      return true;
    }), rng);
    const chosen = [primary, stretch].concat(options.slice(0, Math.max(0, DAILY_HUNT_COUNT - 2)));
    return chosen.map(function (hunt) {
      return {
        id: hunt.id,
        type: hunt.type,
        target: Math.max(1, Number(hunt.target) || 1),
        progress: 0,
        label: hunt.label,
        detail: hunt.detail || '',
        meta: hunt.meta || null,
        completed: false
      };
    });
  }

  function ensureDailyHuntsState(forceRefresh) {
    const today = todayLocalKey();
    const hunts = Array.isArray(dailyHuntsState && dailyHuntsState.hunts) ? dailyHuntsState.hunts : [];
    const shouldReset = Boolean(forceRefresh)
      || !dailyHuntsState
      || dailyHuntsState.dayKey !== today
      || hunts.length !== DAILY_HUNT_COUNT;
    if (shouldReset) {
      dailyHuntsState = {
        dayKey: today,
        hunts: buildDailyHuntsForDay(today),
        bonusClaimed: false
      };
      saveDailyHuntsState();
    }
    return dailyHuntsState;
  }

  function isDailyHuntComplete(hunt) {
    return Number(hunt && hunt.progress) >= Number(hunt && hunt.target);
  }

  function areAllDailyHuntsComplete(state) {
    const hunts = Array.isArray(state && state.hunts) ? state.hunts : [];
    return hunts.length > 0 && hunts.every(function (hunt) {
      return isDailyHuntComplete(hunt);
    });
  }

  function applyDailyHuntsFromPack(cards, collectionKeysBefore, options) {
    const state = ensureDailyHuntsState(false);
    const hunts = Array.isArray(state.hunts) ? state.hunts : [];
    if (!hunts.length) return;
    const config = options || {};
    const openedThemeKey = String(config.themeKey || '').toLowerCase();

    const collectionKeys = new Set(Array.from(collectionKeysBefore || []).filter(Boolean));
    const stats = {
      openPacks: 1,
      selectPlus: 0,
      epicPlus: 0,
      legendaryCards: 0,
      personCards: 0,
      actorCards: 0,
      directorCards: 0,
      newUnique: 0,
      themeCounts: {},
      packThemeOpens: {}
    };

    DAILY_HUNT_THEME_TAGS.forEach(function (tag) {
      stats.themeCounts[tag] = 0;
    });
    DAILY_HUNT_PACK_TAGS.forEach(function (tag) {
      stats.packThemeOpens[tag] = 0;
    });
    if (openedThemeKey && Object.prototype.hasOwnProperty.call(stats.packThemeOpens, openedThemeKey)) {
      stats.packThemeOpens[openedThemeKey] = 1;
    }

    (Array.isArray(cards) ? cards : []).forEach(function (card) {
      const rank = rarityRank(card && card.rarity);
      if (rank >= 2) stats.selectPlus += 1;
      if (rank >= 3) stats.epicPlus += 1;
      if (rank >= 4) stats.legendaryCards += 1;

      if (card && card.cardType === 'person') {
        stats.personCards += 1;
        if (card.roleKey === 'actor') stats.actorCards += 1;
        if (card.roleKey === 'director') stats.directorCards += 1;
      } else {
        DAILY_HUNT_THEME_TAGS.forEach(function (tag) {
          if (movieHasTag(card, tag)) {
            stats.themeCounts[tag] = (stats.themeCounts[tag] || 0) + 1;
          }
        });
      }

      const key = cardKey(card);
      if (key && !collectionKeys.has(key)) {
        stats.newUnique += 1;
        collectionKeys.add(key);
      }
    });

    let changed = false;
    hunts.forEach(function (hunt) {
      const target = Math.max(1, Number(hunt && hunt.target) || 1);
      const previous = Math.max(0, Number(hunt && hunt.progress) || 0);
      let delta = 0;
      if (hunt.type === 'open_packs') delta = stats.openPacks;
      else if (hunt.type === 'select_plus') delta = stats.selectPlus;
      else if (hunt.type === 'epic_plus') delta = stats.epicPlus;
      else if (hunt.type === 'legendary_cards') delta = stats.legendaryCards;
      else if (hunt.type === 'person_cards') delta = stats.personCards;
      else if (hunt.type === 'actor_cards') delta = stats.actorCards;
      else if (hunt.type === 'director_cards') delta = stats.directorCards;
      else if (hunt.type === 'new_unique') delta = stats.newUnique;
      else if (hunt.type === 'theme_cards') {
        const tag = String(hunt && hunt.meta && hunt.meta.tag || '');
        delta = Number(stats.themeCounts[tag]) || 0;
      } else if (hunt.type === 'open_theme_packs') {
        const theme = String(hunt && hunt.meta && hunt.meta.theme || '');
        delta = Number(stats.packThemeOpens[theme]) || 0;
      }
      const next = Math.min(target, previous + Math.max(0, delta));
      if (next !== previous) {
        hunt.progress = next;
        changed = true;
      }
      const nextCompleted = next >= target;
      if (Boolean(hunt.completed) !== nextCompleted) {
        hunt.completed = nextCompleted;
        changed = true;
      }
    });

    if (changed) {
      saveDailyHuntsState();
      if (dailyPage && dailyPage.classList.contains('active')) {
        renderDailyHunts();
      }
    }
  }

  function claimDailyHuntReward() {
    const state = ensureDailyHuntsState(false);
    if (!areAllDailyHuntsComplete(state) || state.bonusClaimed) return;
    state.bonusClaimed = true;
    progress.tickets = Math.max(0, Number(progress.tickets) || 0) + DAILY_HUNT_TICKET_REWARD;
    saveDailyHuntsState();
    saveProgress();
    updatePackMeta();
    renderShop();
    if (pullPage && pullPage.classList.contains('active')) {
      backToPacks();
    }
    renderDailyHunts();
    showToast('Daily reward claimed: +' + String(DAILY_HUNT_TICKET_REWARD) + ' Tickets.');
  }

  function renderDailyHunts() {
    ensureDailyHuntsState(false);
    if (!dailyHuntsPanel) return;
    const state = dailyHuntsState || {};
    const hunts = Array.isArray(state.hunts) ? state.hunts : [];
    const completedCount = hunts.filter(function (hunt) {
      return isDailyHuntComplete(hunt);
    }).length;
    const allComplete = hunts.length > 0 && completedCount === hunts.length;
    const countdown = formatCountdown(msUntilNextLocalMidnight());

    const huntsMarkup = hunts.map(function (hunt) {
      const target = Math.max(1, Number(hunt && hunt.target) || 1);
      const progressValue = Math.max(0, Math.min(target, Number(hunt && hunt.progress) || 0));
      const pct = Math.max(0, Math.min(100, Math.round((progressValue / target) * 100)));
      return '<div class="daily-hunt-card ' + (pct >= 100 ? 'is-complete' : '') + '">'
        + '<div class="daily-hunt-head">'
        + '<div class="daily-hunt-title">' + escapeHtml(hunt.label || 'Daily Hunt') + '</div>'
        + '<div class="daily-hunt-meta">' + String(progressValue) + '/' + String(target) + '</div>'
        + '</div>'
        + '<div class="daily-hunt-progress"><div class="daily-hunt-fill" style="width:' + String(pct) + '%;"></div></div>'
        + '<div class="daily-hunt-summary">' + escapeHtml(hunt.detail || '') + '</div>'
        + '</div>';
    }).join('');

    dailyHuntsPanel.innerHTML = '<div class="collection-topbar">'
      + '<div class="collection-stats">'
      + '<div class="collection-stat"><div class="collection-stat-label">Completed</div><div class="collection-stat-value">' + String(completedCount) + '/' + String(hunts.length || DAILY_HUNT_COUNT) + '</div></div>'
      + '<div class="collection-stat"><div class="collection-stat-label">Resets In</div><div class="collection-stat-value">' + escapeHtml(countdown) + '</div></div>'
      + '<div class="collection-stat"><div class="collection-stat-label">Reward</div><div class="collection-stat-value">+' + String(DAILY_HUNT_TICKET_REWARD) + ' Tickets</div></div>'
      + '</div>'
      + '</div>'
      + '<div class="daily-hunts-list">' + huntsMarkup + '</div>'
      + '<div class="daily-reward-row">'
      + '<div class="daily-reward-copy">' + (allComplete ? 'All hunts complete. Claim your bonus Tickets.' : 'Complete all three hunts to unlock bonus Tickets.') + '</div>'
      + '<button id="dailyClaimButton" class="daily-claim-btn" type="button" ' + ((allComplete && !state.bonusClaimed) ? '' : 'disabled') + '>' + (state.bonusClaimed ? 'Claimed' : 'Claim Reward') + '</button>'
      + '</div>';

    const claimButton = document.getElementById('dailyClaimButton');
    if (claimButton) {
      claimButton.addEventListener('click', claimDailyHuntReward);
    }
  }

  function normalizeFilmIdentityText(value) {
    return String(value || '')
      .toLowerCase()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]+/g, ' ')
      .trim();
  }

  function filmIdentityKey(movie) {
    if (!movie) return '';
    if (movie.cardType === 'person') return personIdentityKey(movie);
    const tmdbId = Number(movie.tmdbId || movie.id) || 0;
    if (tmdbId) return 'tmdb:' + String(tmdbId);
    const normalizedTitle = normalizeFilmIdentityText(movie.title);
    const year = movieYearNumber(movie) || '';
    return normalizedTitle ? ('title:' + normalizedTitle + ':' + String(year || '')) : '';
  }

  function buildRecentPullSet(limitOverride) {
    const resolvedLimit = Math.max(0, Math.floor(Number(limitOverride)));
    const hardLimit = Number.isFinite(resolvedLimit) && resolvedLimit > 0
      ? resolvedLimit
      : RECENT_PULL_HARD_EXCLUDE;
    const storedKeys = Array.isArray(progress.recentPullKeys) ? progress.recentPullKeys : [];
    if (storedKeys.length) {
      return new Set(storedKeys.slice(0, hardLimit));
    }
    return new Set((progress.recentPullTitles || []).slice(0, hardLimit).map(function (title) {
      return 'title:' + normalizeFilmIdentityText(title) + ':';
    }).filter(Boolean));
  }

  function recentExclusionWindowForPool(poolSize) {
    const size = Math.max(0, Number(poolSize) || 0);
    if (!size) return Math.min(RECENT_PULL_HARD_EXCLUDE, 42);
    const scaled = Math.round(size * 0.05);
    return Math.max(24, Math.min(RECENT_PULL_HARD_EXCLUDE, scaled));
  }

  function buildRecentPersonSet() {
    const storedKeys = Array.isArray(progress.recentPullKeys) ? progress.recentPullKeys : [];
    if (storedKeys.length) {
      return new Set(storedKeys.filter(function (key) {
        return String(key || '').indexOf('person:') === 0;
      }).slice(0, RECENT_PULL_HARD_EXCLUDE));
    }
    return new Set((progress.recentPullTitles || []).slice(0, RECENT_PULL_HARD_EXCLUDE).map(function (title) {
      const normalized = personKey(title);
      return normalized ? ('person:' + normalized + ':person') : '';
    }).filter(Boolean));
  }

  function buildOwnedFilmTitleSet() {
    const titles = new Set();
    collection.forEach(function (card) {
      const key = filmIdentityKey(card);
      if (key) {
        titles.add(key);
      }
    });
    return titles;
  }

  function filmSlotsForCurrentTheme(themeKey) {
    const pool = getPackPool(String(themeKey || currentPackTheme || 'all').toLowerCase());
    const shouldTryPersonInsert = (Array.isArray(pool) ? pool : []).some(function (movie) {
      return movie && movie.cardType !== 'person' && Number(movie.tmdbId) > 0;
    });
    const resolvedTheme = String(themeKey || currentPackTheme || '').toLowerCase();
    const actorPackPersonSlots = resolvedTheme === 'actors' && shouldTryPersonInsert ? 4 : 0;
    const personSlots = actorPackPersonSlots || (shouldTryPersonInsert ? 1 : 0);
    return Math.max(0, PACK_SIZE - personSlots);
  }

  function countFreshFilmCandidates(pool) {
    const poolSize = Array.isArray(pool) ? pool.length : 0;
    const avoided = buildAvoidedTitleSet(poolSize);
    const owned = buildOwnedFilmTitleSet();
    const seen = new Set();
    return (Array.isArray(pool) ? pool : []).reduce(function (count, movie) {
      if (!movie || movie.cardType === 'person') return count;
      const key = filmIdentityKey(movie);
      if (!key || avoided.has(key) || owned.has(key) || seen.has(key)) return count;
      seen.add(key);
      return count + 1;
    }, 0);
  }

  function rememberPulledTitles(cards) {
    const next = [];
    const nextKeys = [];
    (cards || []).forEach(function (movie) {
      if (movie && movie.title && next.indexOf(movie.title) === -1) {
        next.push(movie.title);
      }
      const key = filmIdentityKey(movie);
      if (key && nextKeys.indexOf(key) === -1) {
        nextKeys.push(key);
      }
    });

    progress.recentPullTitles = next.concat(progress.recentPullTitles || []).filter(function (title, index, items) {
      return title && items.indexOf(title) === index;
    }).slice(0, RECENT_PULL_MEMORY);
    progress.recentPullKeys = nextKeys.concat(progress.recentPullKeys || []).filter(function (key, index, items) {
      return key && items.indexOf(key) === index;
    }).slice(0, RECENT_PULL_MEMORY);
  }

  function packsUntilReward() {
    const remainder = progress.standardPacksOpened % REEL_REFRESH_INTERVAL;
    return remainder === 0 ? REEL_REFRESH_INTERVAL : (REEL_REFRESH_INTERVAL - remainder);
  }

  function currentReelCycleKey() {
    return Math.floor(progress.standardPacksOpened / REEL_REFRESH_INTERVAL);
  }

  function currentLiveDrawCycleKey() {
    return Math.floor(progress.standardPacksOpened / LIVE_DRAW_REFRESH_INTERVAL);
  }

  function buildPackHookMarkup() {
    if (progress.rewardChoicesAvailable > 0) {
      const count = Math.max(0, Number(progress.rewardChoicesAvailable) || 0);
      const choiceLabel = count === 1 ? 'choice' : 'choices';
      return '<div class="pack-hook"><strong>' + String(count) + '</strong> reward genre ' + choiceLabel + ' ready</div>';
    }

    return '<div class="pack-hook">' + escapeHtml(String(packsUntilReward())) + ' packs until <strong>reward choice</strong></div>';
  }

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function normalizeRarityLabel(value) {
    const key = String(value || '').trim();
    return ({
      Common: 'Base',
      Prolific: 'Base',
      Base: 'Base',
      Uncommon: 'Select',
      Rare: 'Select',
      Respected: 'Select',
      Awarded: 'Select',
      Select: 'Select',
      Epic: 'Epic',
      Iconic: 'Epic',
      Legendary: 'Legendary',
      Canon: 'Legendary'
    })[key] || 'Base';
  }

  function extractYear(value) {
    const match = String(value || '').match(/^(\d{4})/);
    return match ? match[1] : null;
  }

  function inferPrimaryGenre(movie) {
    if (movie.genre) return movie.genre;
    if (movie.roleLabel) return movie.roleLabel;
    if (Array.isArray(movie.genreNames) && movie.genreNames.length) return movie.genreNames[0];
    return 'Film';
  }

  function normalizedDirectorName(name) {
    return String(name || '').trim().toLowerCase();
  }

  function isFemaleDirected(movie) {
    return Number(movie.directorGender) === 1 || Boolean(FEMALE_DIRECTOR_NAMES[normalizedDirectorName(movie.directorName)]);
  }

  function derivePacks(movie) {
    const tags = new Set(['all']);
    const names = Array.isArray(movie.genreNames) ? movie.genreNames : [];
    const lookup = {};
    const year = Number(movie.year) || 0;

    names.forEach(function (name) {
      lookup[String(name).toLowerCase()] = true;
    });

    if (lookup.horror || lookup.thriller) tags.add('horror');
    if (lookup.crime || lookup.noir || lookup.thriller || lookup.mystery) tags.add('noir');
    if (lookup.animation || lookup.family) tags.add('animation');
    if (lookup.documentary) tags.add('docs');
    if (year >= 1980 && year <= 1989) tags.add('eighties');
    if ((lookup.romance && lookup.comedy) || (lookup.romance && lookup.drama && year >= 1980) || (lookup.comedy && popularity >= 18 && voteAverage >= 6.4)) tags.add('romcom');
    if (movie.originalLanguage && String(movie.originalLanguage).toLowerCase() !== 'en') tags.add('international');
    if (isFemaleDirected(movie)) tags.add('female');

    return Array.from(tags);
  }

  function normalizeMovieRecord(movie) {
    const normalized = {
      cardType: movie.cardType || 'film',
      title: movie.title || 'Unknown',
      rarity: normalizeRarityLabel(movie.rarity || 'Base'),
      genre: inferPrimaryGenre(movie),
      genreNames: Array.isArray(movie.genreNames) ? movie.genreNames.slice() : (movie.genre ? [movie.genre] : []),
      desc: movie.desc || movie.overview || 'No synopsis available yet.',
      packs: Array.isArray(movie.packs) ? movie.packs.slice() : [],
      poster: movie.poster || movie.posterUrl || null,
      still: movie.still || movie.backdrop || movie.backdropUrl || null,
      tmdbId: movie.tmdbId || movie.id || null,
      year: movie.year || extractYear(movie.releaseDate || movie.release_date),
      artMode: movie.artMode || 'generated',
      popularity: Number(movie.popularity) || 0,
      voteAverage: Number(movie.voteAverage != null ? movie.voteAverage : movie.vote_average) || 0,
      voteCount: Number(movie.voteCount != null ? movie.voteCount : movie.vote_count) || 0,
      originalLanguage: movie.originalLanguage || movie.original_language || null,
      directorName: movie.directorName || null,
      directorGender: movie.directorGender != null ? Number(movie.directorGender) : null,
      personId: movie.personId || movie.tmdbPersonId || null,
      personType: movie.personType || null,
      roleKey: movie.roleKey || null,
      roleLabel: movie.roleLabel || null,
      profile: movie.profile || movie.profileUrl || null,
      biography: movie.biography || '',
      sourceMovieIds: Array.isArray(movie.sourceMovieIds) ? movie.sourceMovieIds.filter(Boolean) : [],
      knownForTitles: Array.isArray(movie.knownForTitles) ? movie.knownForTitles.filter(Boolean).slice(0, 3) : [],
      knownForPeakRank: Number(movie.knownForPeakRank) || 0,
      knownForDepth: Number(movie.knownForDepth) || 0,
      sourceTitle: movie.sourceTitle || null,
      sourceYear: movie.sourceYear || null,
      character: movie.character || '',
      linkUrl: movie.linkUrl || null
    };

    if (!normalized.packs.length && normalized.cardType === 'film') normalized.packs = derivePacks(normalized);
    if (!normalized.packs.length && normalized.cardType === 'person') normalized.packs = ['all'];
    if (normalized.cardType === 'person') {
      const explicitPersonFloor = PERSON_RARITY_FLOORS[personKey(normalized.title)];
      if (explicitPersonFloor && rarityRank(explicitPersonFloor) > rarityRank(normalized.rarity)) {
        normalized.rarity = explicitPersonFloor;
      }
      normalized.character = '';
    }
    normalized.artMode = normalized.cardType === 'person' ? 'profile' : chooseArtMode(normalized);
    return normalized;
  }

  function replaceMoviePool(nextMovies, sourceLabel) {
    const normalized = Array.isArray(nextMovies) ? nextMovies.map(normalizeMovieRecord).filter(function (movie) { return movie.title; }) : [];
    if (!normalized.length) return false;
    movies = normalized;
    dataSourceLabel = sourceLabel || 'Live Movie Pool';
    return true;
  }

  function rarityColor(rarity) {
    return RARITY_COLORS[normalizeRarityLabel(rarity)] || RARITY_COLORS.Base;
  }

  function hexToRgba(hex, alpha) {
    const normalized = String(hex || '').replace('#', '');
    if (normalized.length !== 6) return 'rgba(255,255,255,' + String(alpha) + ')';
    const value = parseInt(normalized, 16);
    const r = (value >> 16) & 255;
    const g = (value >> 8) & 255;
    const b = value & 255;
    return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
  }

  function collectionShellStyle(card) {
    const accent = rarityColor(card && card.rarity);
    return '--shell-border:' + accent
      + ';--shell-border-strong:' + hexToRgba(accent, 0.78)
      + ';--shell-border-soft:' + hexToRgba(accent, 0.2)
      + ';--shell-bg-top:' + hexToRgba(accent, 0.14)
      + ';--shell-bg-bottom:' + hexToRgba(accent, 0.05);
  }

  function chooseArtMode(movie) {
    if (movie.still && rarityRank(movie.rarity) >= 3) {
      return Math.random() < 0.35 ? 'still' : 'poster';
    }
    if (movie.poster) return 'poster';
    if (movie.still) return 'still';
    return 'generated';
  }

  function makePosterDataUri(movie) {
    const bgA = rarityColor(movie.rarity);
    const bgB = movie.rarity === 'Legendary' ? '#92400e' : movie.rarity === 'Epic' ? '#6b21a8' : movie.rarity === 'Select' ? '#1d4ed8' : '#475569';
    const safeTitle = escapeHtml(movie.title).slice(0, 24);
    const safeGenre = escapeHtml(movie.genre);
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="450" viewBox="0 0 300 450">'
      + '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">'
      + '<stop offset="0%" stop-color="' + bgA + '"/>'
      + '<stop offset="100%" stop-color="' + bgB + '"/>'
      + '</linearGradient></defs>'
      + '<rect width="300" height="450" rx="24" fill="url(#g)"/>'
      + '<rect x="18" y="18" width="264" height="414" rx="18" fill="rgba(0,0,0,0.18)" stroke="rgba(255,255,255,0.22)"/>'
      + '<circle cx="230" cy="96" r="84" fill="rgba(255,255,255,0.08)"/>'
      + '<rect x="36" y="40" width="228" height="250" rx="14" fill="rgba(0,0,0,0.22)"/>'
      + '<text x="150" y="145" text-anchor="middle" fill="rgba(255,255,255,0.14)" font-size="84">🎬</text>'
      + '<text x="150" y="325" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="700">' + safeTitle + '</text>'
      + '<text x="150" y="355" text-anchor="middle" fill="rgba(255,255,255,0.82)" font-family="Arial, sans-serif" font-size="15" letter-spacing="2">' + safeGenre.toUpperCase() + '</text>'
      + '<text x="150" y="393" text-anchor="middle" fill="rgba(255,255,255,0.72)" font-family="Arial, sans-serif" font-size="12">filmTCG</text>'
      + '</svg>';
    return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg);
  }

  function makePersonDataUri(card) {
    const roleLabel = escapeHtml(card.roleLabel || 'Film Figure');
    const safeName = escapeHtml(card.title || card.name || 'Unknown').slice(0, 28);
    const accent = card.personType === 'actor'
      ? '#f97316'
      : (card.personType === 'director' ? '#38bdf8' : '#94a3b8');
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="450" viewBox="0 0 300 450">'
      + '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">'
      + '<stop offset="0%" stop-color="#111827"/>'
      + '<stop offset="100%" stop-color="' + accent + '"/>'
      + '</linearGradient></defs>'
      + '<rect width="300" height="450" rx="24" fill="url(#g)"/>'
      + '<rect x="16" y="16" width="268" height="418" rx="18" fill="rgba(0,0,0,0.24)" stroke="rgba(255,255,255,0.18)"/>'
      + '<circle cx="150" cy="164" r="78" fill="rgba(255,255,255,0.08)"/>'
      + '<text x="150" y="185" text-anchor="middle" fill="rgba(255,255,255,0.2)" font-size="84">★</text>'
      + '<text x="150" y="328" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="700">' + safeName + '</text>'
      + '<text x="150" y="360" text-anchor="middle" fill="rgba(255,255,255,0.82)" font-family="Arial, sans-serif" font-size="15" letter-spacing="1.5">' + roleLabel.toUpperCase() + '</text>'
      + '</svg>';
    return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg);
  }

  function proxied(url) {
    if (!url) return null;
    if (url.indexOf('data:image') === 0) return url;
    if (window.location.protocol !== 'file:') return url;
    if (url.indexOf(TMDB_BACKEND_BASE + '/api/image-proxy') === 0) return url;
    return TMDB_BACKEND_BASE + '/api/image-proxy?url=' + encodeURIComponent(url);
  }

  function cardImageAttrs(priority) {
    const isPriority = priority === 'high';
    return ' loading="' + (isPriority ? 'eager' : 'lazy') + '" decoding="async" fetchpriority="' + (isPriority ? 'high' : 'low') + '"';
  }

  function backendFetchOptions() {
    const headers = { Accept: 'application/json' };
    if (TMDB_BACKEND_BASE.indexOf('.ngrok-') !== -1 || TMDB_BACKEND_BASE.indexOf('.ngrok.') !== -1) {
      headers['ngrok-skip-browser-warning'] = '1';
    }
    return { headers: headers };
  }

  async function fetchBackendJson(path, options) {
    const config = options || {};
    const timeoutMs = Math.max(800, Number(config.timeoutMs) || BACKEND_FETCH_TIMEOUT_MS);
    const requestOptions = backendFetchOptions();
    const controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
    let timeoutId = null;
    if (controller) {
      requestOptions.signal = controller.signal;
      timeoutId = setTimeout(function () {
        controller.abort();
      }, timeoutMs);
    }

    let response;
    try {
      response = await fetch(TMDB_BACKEND_BASE + path, requestOptions);
    } catch (error) {
      if (error && error.name === 'AbortError') {
        throw new Error('Request timeout after ' + timeoutMs + 'ms for ' + path);
      }
      throw error;
    } finally {
      if (timeoutId != null) clearTimeout(timeoutId);
    }
    const contentType = response.headers.get('content-type') || '';
    const bodyText = await response.text();

    if (!response.ok) {
      throw new Error('HTTP ' + response.status + ' for ' + path + ': ' + bodyText.slice(0, 160));
    }

    if (contentType.indexOf('application/json') === -1) {
      throw new Error('Non-JSON response for ' + path + ': ' + bodyText.slice(0, 160));
    }

    return JSON.parse(bodyText);
  }

  async function fetchDynamicCardPool(forceRefresh, options) {
    const config = options || {};
    const params = '/api/card-pool?limit=' + CARD_POOL_LIMIT + (forceRefresh ? '&refresh=1' : '');
    const data = await fetchBackendJson(params, { timeoutMs: config.timeoutMs });
    if (!data || !Array.isArray(data.movies) || data.movies.length < 50) return false;
    replaceMoviePool(data.movies, data.sourceLabel || 'TMDB');
    activeReelThemeKey = 'all-packs';
    artworkStatus = 'Loaded ' + data.movies.length + ' live films from ' + dataSourceLabel + '.';
    return true;
  }

  function backendThemeParam(themeKey) {
    return themeKey && themeKey !== 'all' && themeKey !== 'gold' ? '&theme=' + encodeURIComponent(themeKey) : '';
  }

  async function fetchThemedDynamicCardPool(themeKey, forceRefresh) {
    const params = '/api/card-pool?limit=' + THEME_POOL_LIMIT + backendThemeParam(themeKey) + (forceRefresh ? '&refresh=1' : '');
    const data = await fetchBackendJson(params);
    if (!data || !Array.isArray(data.movies) || data.movies.length < 50) return false;
    replaceMoviePool(data.movies, data.sourceLabel || 'TMDB');
    activeReelThemeKey = String(themeKey || 'theme');
    artworkStatus = 'Loaded ' + data.movies.length + ' live films from ' + dataSourceLabel + '.';
    return true;
  }

  async function refreshPoolForPackOpen(forceRefresh, themeKey) {
    const poolLimit = IS_MOBILE_RUNTIME ? MOBILE_POOL_LIMIT : CARD_POOL_LIMIT;
    const sampleSize = IS_MOBILE_RUNTIME ? MOBILE_PACK_REFRESH_SAMPLE : PACK_REFRESH_SAMPLE;
    const params = '/api/card-pool?limit=' + poolLimit + '&sample=' + sampleSize + '&shuffle=1' + backendThemeParam(themeKey) + (forceRefresh ? '&refresh=1' : '');
    const data = await fetchBackendJson(params, { timeoutMs: PACK_OPEN_REFRESH_TIMEOUT_MS });
    if (!data || !Array.isArray(data.movies) || data.movies.length < 50) return false;
    replaceMoviePool(data.movies, (data.sourceLabel || 'TMDB') + ' Fresh Draw');
    activeReelCycleKey = currentLiveDrawCycleKey();
    activeReelThemeKey = String(themeKey || 'all-packs');
    activeReelSeenTitles = new Set();
    artworkStatus = 'Fresh deck built from ' + data.movies.length + ' live films.';
    return true;
  }

  async function fetchMovieArt(title) {
    if (artCache.has(title)) return artCache.get(title);
    const data = await fetchBackendJson('/api/movie-art?title=' + encodeURIComponent(title));
    artCache.set(title, data);
    return data;
  }

  async function fetchMoviePeople(movieIds, timeoutMs) {
    const ids = (Array.isArray(movieIds) ? movieIds : []).map(function (id) {
      return Number(id) || 0;
    }).filter(Boolean);
    if (!ids.length) return [];
    const resolvedTimeout = Math.max(1200, Number(timeoutMs) || PERSON_INSERT_FETCH_TIMEOUT_MS);
    const data = await fetchBackendJson('/api/movie-people?movieIds=' + ids.join(','), { timeoutMs: resolvedTimeout });
    return data && Array.isArray(data.people) ? data.people : [];
  }

  async function fetchPersonKnownFor(personId, roleKey, personName, forceRefresh) {
    const normalizedPersonId = Number(personId) || 0;
    if (!normalizedPersonId) {
      return {
        knownForTitles: [],
        knownForPeakRank: 0,
        knownForDepth: 0
      };
    }

    const cacheKey = String(normalizedPersonId) + ':' + (roleKey === 'director' ? 'director' : 'actor');
    if (!forceRefresh && personKnownForCache.has(cacheKey)) {
      return personKnownForCache.get(cacheKey);
    }

    const data = await fetchBackendJson('/api/person-known-for?personId=' + encodeURIComponent(String(normalizedPersonId)) + '&role=' + encodeURIComponent(roleKey === 'director' ? 'director' : 'actor') + '&name=' + encodeURIComponent(String(personName || '')) + (forceRefresh ? '&refresh=1' : ''), { timeoutMs: PERSON_INSERT_FETCH_TIMEOUT_MS });
    const normalized = {
      knownForTitles: Array.isArray(data && data.knownForTitles) ? data.knownForTitles.filter(Boolean).slice(0, 3) : [],
      knownForPeakRank: Number(data && data.knownForPeakRank) || 0,
      knownForDepth: Number(data && data.knownForDepth) || 0
    };
    if (normalized.knownForTitles.length || normalized.knownForPeakRank || normalized.knownForDepth) {
      personKnownForCache.set(cacheKey, normalized);
    } else {
      personKnownForCache.delete(cacheKey);
    }
    return normalized;
  }

  async function fetchPersonBio(personId, forceRefresh) {
    const normalizedPersonId = Number(personId) || 0;
    if (!normalizedPersonId) return '';
    const cacheKey = String(normalizedPersonId);
    if (!forceRefresh && personBioCache.has(cacheKey)) {
      return personBioCache.get(cacheKey);
    }
    const data = await fetchBackendJson('/api/person-profile?personId=' + encodeURIComponent(String(normalizedPersonId)), { timeoutMs: PERSON_BIO_FETCH_TIMEOUT_MS });
    const biography = String(data && data.biography || '').trim();
    if (biography) {
      personBioCache.set(cacheKey, biography);
    } else {
      personBioCache.delete(cacheKey);
    }
    return biography;
  }

  async function hydratePersonCardKnownFor(card) {
    if (!card || card.cardType !== 'person' || !card.personId) return card;
    const biography = await fetchPersonBio(card.personId, false).catch(function () { return ''; });
    if (biography && biography.length >= 48) {
      card.biography = biography;
      card.desc = biography;
      return card;
    }
    const currentDesc = String(card.desc || '').trim();
    if (!currentDesc || /^Known for:/i.test(currentDesc)) {
      const role = roleLabelForDisplay(card);
      const sourceLabel = card.sourceTitle
        ? (' Pulled from ' + String(card.sourceTitle) + (card.sourceYear ? (' (' + String(card.sourceYear) + ')') : '') + '.')
        : '';
      card.desc = role + ' card.' + sourceLabel;
    }
    return card;
  }

  function hydratePackPeopleInBackground(cards) {
    const peopleCards = (Array.isArray(cards) ? cards : []).filter(function (card) {
      return card && card.cardType === 'person' && card.personId;
    });
    if (!peopleCards.length) return;

    Promise.all(peopleCards.map(function (card) {
      return hydratePersonCardKnownFor(card).catch(function () { return card; });
    })).then(function () {
      saveCollection();
      if (collectionPage.classList.contains('active')) renderCollection();
    }).catch(function () {
    });
  }

  async function rehydrateCollectionPeopleKnownFor() {
    const peopleIndexes = [];
    collection.forEach(function (card, index) {
      const biography = String(card && card.biography || '').trim();
      if (card && card.cardType === 'person' && card.personId && biography.length < 48) {
        peopleIndexes.push(index);
      }
    });
    if (!peopleIndexes.length) return false;

    let changed = false;
    for (let i = 0; i < peopleIndexes.length; i += 1) {
      const index = peopleIndexes[i];
      const before = collection[index];
      const beforeDesc = String(before && before.desc || '');
      const beforeBio = String(before && before.biography || '');
      const hydrated = await hydratePersonCardKnownFor(before);
      const afterDesc = String(hydrated && hydrated.desc || '');
      const afterBio = String(hydrated && hydrated.biography || '');
      if (afterDesc !== beforeDesc || afterBio !== beforeBio) {
        collection[index] = hydrated;
        changed = true;
      }
    }

    if (changed) {
      saveCollection();
      if (collectionPage.classList.contains('active')) renderCollection();
    }
    return changed;
  }

  async function hydrateMoviesFromBackend() {
    let successCount = 0;
    for (let i = 0; i < movies.length; i += 1) {
      const movie = movies[i];
      try {
        const art = await fetchMovieArt(movie.title);
        movie.poster = art.poster || null;
        movie.still = art.backdrop || null;
        movie.tmdbId = art.tmdbId || null;
        movie.year = art.year || null;
        movie.genreNames = Array.isArray(art.genreNames) ? art.genreNames.slice() : movie.genreNames;
        movie.packs = Array.isArray(art.packs) && art.packs.length ? art.packs.slice() : movie.packs;
        movie.desc = art.desc || movie.desc;
        movie.originalLanguage = art.originalLanguage || movie.originalLanguage;
        movie.directorName = art.directorName || movie.directorName;
        movie.directorGender = art.directorGender != null ? Number(art.directorGender) : movie.directorGender;
        movie.genre = inferPrimaryGenre(movie);
        movie.artMode = chooseArtMode(movie);
        if (movie.poster || movie.still) successCount += 1;
      } catch (error) {
        movie.artMode = 'generated';
      }
    }

    artworkStatus = successCount > 0
      ? 'Live art resolved for ' + successCount + ' films from ' + dataSourceLabel + '.'
      : 'Backend unavailable. Falling back to generated card art.';
  }

  function resolveArt(movie) {
    if (movie.cardType === 'person') {
      if (movie.profile) return proxied(movie.profile);
      return makePersonDataUri(movie);
    }
    if (movie.artMode === 'still' && movie.still) return proxied(movie.still);
    if (movie.poster) return proxied(movie.poster);
    if (movie.still) return proxied(movie.still);
    return makePosterDataUri(movie);
  }

  function preloadArtUrl(url) {
    try {
      const normalizedUrl = String(url || '').trim();
      if (!normalizedUrl) return;
      if (normalizedUrl.indexOf('data:image/svg+xml') === 0) return;
      if (preloadedCardArtUrls.has(normalizedUrl)) return;
      if (preloadedCardArtUrls.size > 1500) preloadedCardArtUrls.clear();
      preloadedCardArtUrls.add(normalizedUrl);
      if (typeof Image !== 'function') return;
      const image = new Image();
      image.decoding = 'async';
      image.src = normalizedUrl;
    } catch (error) {
      console.warn('[filmTCG] preloadArtUrl skipped', error);
    }
  }

  function preloadCardArt(card) {
    if (!card) return;
    preloadArtUrl(resolveArt(card));
  }

  function preloadPackCards(cards, activeIndex) {
    try {
      const source = Array.isArray(cards) ? cards : [];
      if (!source.length) return;
      const current = Math.max(0, Math.min(source.length - 1, Number(activeIndex) || 0));
      preloadCardArt(source[current]);
      const order = [];
      for (let offset = 1; offset < source.length; offset += 1) {
        order.push((current + offset) % source.length);
        order.push((current - offset + source.length) % source.length);
      }
      const seen = new Set();
      order.forEach(function (cardIndex) {
        if (seen.has(cardIndex)) return;
        seen.add(cardIndex);
        preloadCardArt(source[cardIndex]);
      });
    } catch (error) {
      console.warn('[filmTCG] preloadPackCards skipped', error);
    }
  }

  function resolveCardLink(card) {
    if (card && card.cardType === 'person') {
      return personLetterboxdUrl(card);
    }
    const tmdbId = Number(card && card.tmdbId) || 0;
    if (tmdbId > 0) {
      return 'https://letterboxd.com/tmdb/' + String(tmdbId);
    }
    return card.linkUrl || letterboxdUrl(card);
  }

  function computeStats(movie) {
    const baseByRarity = { Base: 58, Select: 72, Epic: 84, Legendary: 94 };
    const atkByGenre = { Horror: 10, Thriller: 8, Crime: 6, Action: 9, Drama: 1, 'Sci-Fi': 4, Comedy: 2, Film: 3 };
    const defByGenre = { Drama: 10, 'Sci-Fi': 7, Crime: 5, Thriller: 4, Horror: 2, Action: 3, Comedy: 4, Film: 3 };
    const base = baseByRarity[movie.rarity] || 60;
    return {
      atk: Math.min(99, base + (atkByGenre[movie.genre] || 2)),
      def: Math.min(99, base + (defByGenre[movie.genre] || 3))
    };
  }

  function getPackPool(themeKey) {
    const selectedTheme = themeKey || currentPackTheme;
    if (selectedTheme === 'gold') return movies.slice();
    if (selectedTheme === 'actors') {
      return movies.filter(function (movie) {
        return movie && movie.cardType !== 'person';
      });
    }
    return movies.filter(function (movie) {
      return selectedTheme === 'all' ? true : (movie.packs || ['all']).indexOf(selectedTheme) !== -1;
    });
  }

  function getAvailableFeaturedRewardThemes() {
    if (dataSourceLabel.indexOf('TMDB') !== -1) {
      return FEATURED_REWARD_THEMES.slice();
    }
    const strongMatches = FEATURED_REWARD_THEMES.filter(function (themeKey) {
      return getPackPool(themeKey).length >= PACK_SIZE;
    });
    if (strongMatches.length) return strongMatches;
    return FEATURED_REWARD_THEMES.filter(function (themeKey) {
      return getPackPool(themeKey).length > 0;
    });
  }

  function chooseFeaturedRewardTheme(previousTheme) {
    const availableThemes = getAvailableFeaturedRewardThemes();
    if (!availableThemes.length) return null;
    const filtered = availableThemes.filter(function (themeKey) { return themeKey !== previousTheme; });
    const source = filtered.length ? filtered : availableThemes;
    return weightedChoice(source.map(function (themeKey) {
      return {
        key: themeKey,
        weight: Number(FEATURED_REWARD_THEME_WEIGHTS[themeKey]) || 1
      };
    })).key;
  }

  function chooseFeaturedRewardThemes(previousThemes) {
    const availableThemes = getAvailableFeaturedRewardThemes();
    if (!availableThemes.length) return [];

    const prior = Array.isArray(previousThemes) ? previousThemes.filter(Boolean) : [];
    const first = chooseFeaturedRewardTheme(prior[0]) || availableThemes[0];
    const remaining = availableThemes.filter(function (themeKey) { return themeKey !== first; });
    if (!remaining.length) return [first];

    const preferredRemaining = remaining.filter(function (themeKey) {
      return prior.indexOf(themeKey) === -1;
    });
    const secondSource = preferredRemaining.length ? preferredRemaining : remaining;
    const second = secondSource[Math.floor(Math.random() * secondSource.length)];
    return [first, second];
  }

  function ensureFeaturedRewardThemes(forceNew) {
    const currentThemes = Array.isArray(progress.featuredRewardThemes) ? progress.featuredRewardThemes.filter(Boolean).slice(0, 2) : [];
    const needsNew = forceNew
      || currentThemes.length < 2
      || currentThemes.some(function (themeKey) { return getPackPool(themeKey).length < PACK_SIZE; });
    if (needsNew) {
      progress.featuredRewardThemes = chooseFeaturedRewardThemes(currentThemes);
      progress.featuredRewardTheme = progress.featuredRewardThemes[0] || null;
    }
    return progress.featuredRewardThemes;
  }

  function resolvePackTheme(forceDifferent) {
    void forceDifferent;
    if (selectedPackMode !== 'all-packs') {
      currentPackTheme = selectedPackMode;
      return currentPackTheme;
    }
    currentPackTheme = 'all';
    return currentPackTheme;
  }

  function updatePackMeta() {
    const rewardThemeKeys = progress.rewardChoicesAvailable > 0 ? ensureFeaturedRewardThemes(false) : [];
    const isRewardContext = Boolean(activeRewardSelection) && progress.rewardChoicesAvailable > 0;
    const displayThemeKey = isRewardContext
      ? (progress.featuredRewardTheme || rewardThemeKeys[0] || currentPackTheme)
      : currentPackTheme;
    const pool = isRewardContext
      ? movies
      : getPackPool(displayThemeKey === 'gold' ? 'all' : displayThemeKey);
    const theme = PACK_THEMES[displayThemeKey] || PACK_THEMES.all;
    document.getElementById('packThemeLabel').textContent = isRewardContext ? 'Reward Choice' : theme.label;
    document.getElementById('poolSizeValue').textContent = String(pool.length);
    document.getElementById('packSeriesValue').textContent = isRewardContext
      ? 'Choose 1'
      : theme.tier;
    const ticketText = String(Math.max(0, Number(progress.tickets) || 0));
    const ticketValue = document.getElementById('ticketBalanceValue');
    if (ticketValue) ticketValue.textContent = ticketText;
    const ticketBadgeValue = document.getElementById('ticketBadgeValue');
    if (ticketBadgeValue) ticketBadgeValue.textContent = ticketText;
  }

  function formatTickets(value) {
    return String(Math.max(0, Number(value) || 0));
  }

  function getOwnedPacks() {
    return [];
  }

  function ownedPackLabel(item) {
    const themeKey = normalizeOwnedPackTheme(item && item.theme);
    const theme = PACK_THEMES[themeKey] || PACK_THEMES.all;
    return theme.label + ' Pack';
  }

  function selectedOwnedPack() {
    const owned = getOwnedPacks();
    if (!owned.length) return null;
    if (selectedOwnedPackId) {
      const exact = owned.find(function (item) { return item && item.id === selectedOwnedPackId; });
      if (exact) return exact;
    }
    return owned[0];
  }

  function removeOwnedPackById(packId) {
    const owned = getOwnedPacks();
    const index = owned.findIndex(function (item) {
      return item && item.id === packId;
    });
    if (index === -1) return null;
    const removed = owned.splice(index, 1)[0];
    progress.sealedPacks = owned;
    if (selectedOwnedPackId === packId) {
      selectedOwnedPackId = owned.length ? String(owned[0].id || '') : '';
    }
    return removed;
  }

  function openShopPackOverlay(themeKey, label) {
    if (!shopOpenOverlay || !shopOpenPackWrap || !shopOpenStatus) return null;
    const resolvedTheme = normalizeOwnedPackTheme(themeKey || 'all');
    if (shopOpenShell) shopOpenShell.classList.remove('is-revealed');
    if (shopOpenReveal) shopOpenReveal.innerHTML = '';
    shopOverlayPack = [];
    shopOverlayIndex = 0;
    shopOpenPackWrap.style.display = '';
    shopOpenStatus.style.display = '';
    shopOpenStatus.classList.remove('is-loading');
    shopOpenStatus.classList.remove('is-fading');
    shopOpenPackWrap.innerHTML = buildPackFaceMarkup(resolvedTheme, {
      id: 'shopOverlayPackFace'
    });
    shopOpenStatus.textContent = label
      ? ('Opening ' + label + '...')
      : 'Opening pack...';
    shopOpenStatus.classList.add('is-live');
    shopOpenOverlay.classList.add('open');
    shopOpenOverlay.setAttribute('aria-hidden', 'false');
    document.body.classList.add('overlay-open');
    return {
      packElement: document.getElementById('shopOverlayPackFace'),
      statusElement: shopOpenStatus
    };
  }

  function closeShopPackOverlay() {
    if (!shopOpenOverlay) return;
    shopOpenOverlay.classList.remove('open');
    shopOpenOverlay.setAttribute('aria-hidden', 'true');
    if (shopOpenShell) shopOpenShell.classList.remove('is-revealed');
    if (shopOpenPackWrap) shopOpenPackWrap.innerHTML = '';
    if (shopOpenReveal) shopOpenReveal.innerHTML = '';
    shopOverlayPack = [];
    shopOverlayIndex = 0;
    document.body.classList.remove('overlay-open');
  }

  function renderShopOverlayCards() {
    if (!shopOpenReveal) return;
    if (!Array.isArray(shopOverlayPack) || !shopOverlayPack.length) {
      closeShopPackOverlay();
      return;
    }
    const current = shopOverlayPack[shopOverlayIndex];
    try {
      preloadPackCards(shopOverlayPack, shopOverlayIndex);
    } catch (error) {
      console.warn('[filmTCG] shop preload skipped', error);
    }
    shopOpenReveal.innerHTML = '<div class="shop-open-progress">Card '
      + String(shopOverlayIndex + 1)
      + ' of '
      + String(shopOverlayPack.length)
      + '</div>'
      + '<div class="shop-open-card-wrap">'
      + '<button id="shopOverlayPrev" type="button" class="arrow stack-arrow is-left" aria-label="Previous card">&#8592;</button>'
      + '<div class="peel-card-wrap rarity-' + escapeHtml(String((current.rarity || 'Base')).toLowerCase()) + '">' + buildCardMarkup(current) + '</div>'
      + '<button id="shopOverlayNext" type="button" class="arrow stack-arrow is-right" aria-label="Next card">&#8594;</button>'
      + '</div>'
      + '<button id="shopOverlayClose" type="button" class="back-btn shop-open-close-btn">Close</button>';
    addImageFallbacks(shopOpenReveal);
    attachBookmarkButtons(shopOpenReveal, function () { return current; });
    const peelWrap = shopOpenReveal.querySelector('.peel-card-wrap');
    attachPackCardInteractions(peelWrap, current);
    const prevButton = document.getElementById('shopOverlayPrev');
    const nextButton = document.getElementById('shopOverlayNext');
    const closeButton = document.getElementById('shopOverlayClose');
    if (prevButton) {
      prevButton.addEventListener('click', function () {
        if (!shopOverlayPack.length) return;
        shopOverlayIndex = (shopOverlayIndex - 1 + shopOverlayPack.length) % shopOverlayPack.length;
        renderShopOverlayCards();
      });
    }
    if (nextButton) {
      nextButton.addEventListener('click', function () {
        if (!shopOverlayPack.length) return;
        shopOverlayIndex = (shopOverlayIndex + 1) % shopOverlayPack.length;
        renderShopOverlayCards();
      });
    }
    if (closeButton) {
      closeButton.addEventListener('click', closeShopPackOverlay);
    }
  }

  function revealShopOverlayCards(cards) {
    if (!shopOpenOverlay || !shopOpenPackWrap || !shopOpenStatus || !shopOpenReveal) return;
    const sourceCards = Array.isArray(cards) ? cards.slice() : [];
    if (!sourceCards.length) {
      closeShopPackOverlay();
      return;
    }
    if (shopOpenShell) shopOpenShell.classList.add('is-revealed');
    shopOpenPackWrap.style.display = 'none';
    shopOpenStatus.style.display = 'none';
    shopOverlayPack = sortPackForReveal(sourceCards);
    shopOverlayIndex = 0;
    renderShopOverlayCards();
  }

  function duplicateTradeSummary() {
    const grouped = aggregateCollectionEntries(collection);
    const byRarity = { Base: 0, Select: 0, Epic: 0, Legendary: 0 };
    let duplicateCards = 0;
    let ticketValue = 0;

    grouped.forEach(function (entry) {
      const extraCount = Math.max(0, Number(entry && entry.count) - 1);
      if (!extraCount) return;
      const rarity = normalizeRarityLabel(entry && entry.card && entry.card.rarity);
      const valuePer = Number(DUPLICATE_TRADE_VALUES[rarity]) || 0;
      duplicateCards += extraCount;
      byRarity[rarity] = (byRarity[rarity] || 0) + extraCount;
      ticketValue += extraCount * valuePer;
    });

    return {
      duplicateCards: duplicateCards,
      ticketValue: ticketValue,
      byRarity: byRarity
    };
  }

  function tradeInDuplicates() {
    const summary = duplicateTradeSummary();
    if (!summary.duplicateCards || !summary.ticketValue) {
      showToast('No duplicates ready to trade.');
      return;
    }

    const seen = new Set();
    const kept = [];
    const traded = [];

    (Array.isArray(collection) ? collection : []).forEach(function (card) {
      const key = cardKey(card);
      if (!key) return;
      if (!seen.has(key)) {
        seen.add(key);
        kept.push(card);
      } else {
        traded.push(card);
      }
    });

    const gained = traded.reduce(function (sum, card) {
      return sum + (Number(DUPLICATE_TRADE_VALUES[normalizeRarityLabel(card && card.rarity)]) || 0);
    }, 0);

    collection = kept;
    progress.tickets = Math.max(0, Number(progress.tickets) || 0) + gained;
    saveCollection();
    saveProgress();
    updatePackMeta();
    if (collectionPage && collectionPage.classList.contains('active')) {
      renderCollection();
    }
    if (pullPage && pullPage.classList.contains('active')) {
      backToPacks();
    }
    renderShop();
    showToast('Traded ' + String(traded.length) + ' dupes for ' + String(gained) + ' Tickets.');
  }

  async function openThemedPackInShop(themeKey, label, openOptions) {
    const config = openOptions || {};
    const overlayUi = openShopPackOverlay(themeKey, label);
    try {
      const openedPack = await openPack({
        themeKey: normalizeOwnedPackTheme(themeKey || 'all'),
        forceRewardOpen: Boolean(config.forceRewardOpen),
        ignoreRewardChoiceGate: true,
        revealCarousel: false,
        openingElement: overlayUi && overlayUi.packElement ? overlayUi.packElement : null,
        statusElement: overlayUi && overlayUi.statusElement ? overlayUi.statusElement : null
      });
      if (Array.isArray(openedPack) && openedPack.length) {
        revealShopOverlayCards(openedPack);
        return true;
      }
      closeShopPackOverlay();
      return false;
    } catch (error) {
      closeShopPackOverlay();
      return false;
    }
  }

  async function buyShopPack(packId) {
    const packDef = SHOP_PACKS.find(function (item) {
      return item && item.id === packId;
    });
    if (!packDef) return;
    const price = Math.max(0, Number(packDef.price) || 0);
    const balance = Math.max(0, Number(progress.tickets) || 0);
    if (balance < price) {
      showToast('Not enough Tickets for that pack yet.');
      return;
    }

    progress.tickets = balance - price;
    saveProgress();
    updatePackMeta();
    renderShop();
    showToast('Bought ' + packDef.label + '. Opening now...');
    const opened = await openThemedPackInShop(packDef.theme, packDef.label, {
      forceRewardOpen: false
    });
    if (!opened) {
      progress.tickets = balance;
      saveProgress();
      updatePackMeta();
      renderShop();
      showToast('Open failed. Tickets refunded.');
    }
  }

  function slugifyLetterboxd(title) {
    return String(title || '')
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toLowerCase()
      .replace(/&/g, 'and')
      .replace(/[^a-z0-9\s-]/g, '')
      .trim()
      .replace(/\s+/g, '-')
      .replace(/-+/g, '-');
  }

  function hasDuplicateFilmTitleInPool(title) {
    const normalizedTitle = normalizeFilmIdentityText(title);
    if (!normalizedTitle) return false;
    let count = 0;
    for (let i = 0; i < movies.length; i += 1) {
      const movie = movies[i];
      if (!movie || movie.cardType === 'person') continue;
      if (normalizeFilmIdentityText(movie.title) !== normalizedTitle) continue;
      count += 1;
      if (count > 1) return true;
    }
    return false;
  }

  function letterboxdTheHoleVariantSlug(movie, normalizedTitle, year) {
    if (normalizedTitle !== 'the hole') return '';
    const directorKey = normalizeFilmIdentityText(movie && movie.directorName ? movie.directorName : '');
    const languageKey = String(movie && movie.originalLanguage || '').toLowerCase();

    if (year === 1998) {
      if (directorKey.indexOf('brian challis') !== -1) return 'the-hole-1998';
      if (
        directorKey.indexOf('tsai ming liang') !== -1
        || languageKey === 'zh'
        || languageKey === 'cn'
      ) {
        return 'the-hole';
      }
      return 'the-hole';
    }

    if (year === 2001) {
      if (directorKey.indexOf('koto nagata') !== -1 || languageKey === 'ja') {
        return 'the-hole-2001-1';
      }
      return 'the-hole-2001';
    }

    return '';
  }

  function letterboxdFilmSlug(movie) {
    const title = movie && movie.title ? movie.title : '';
    const baseSlug = slugifyLetterboxd(title);
    if (!baseSlug) return '';
    const year = movieYearNumber(movie);
    const normalizedTitle = normalizeFilmIdentityText(title);
    const holeVariantSlug = letterboxdTheHoleVariantSlug(movie, normalizedTitle, year);
    if (holeVariantSlug) return holeVariantSlug;
    const yearKey = normalizedTitle + '::' + String(year || '');
    if (LETTERBOXD_FILM_SLUG_OVERRIDES[yearKey]) {
      return LETTERBOXD_FILM_SLUG_OVERRIDES[yearKey];
    }
    const shouldUseYearSuffix = Boolean(year) && (
      LETTERBOXD_AMBIGUOUS_TITLE_KEYS.has(normalizedTitle)
      || hasDuplicateFilmTitleInPool(title)
    );
    return shouldUseYearSuffix ? (baseSlug + '-' + String(year)) : baseSlug;
  }

  function letterboxdUrl(movie) {
    const slug = letterboxdFilmSlug(movie);
    if (!slug) return 'https://letterboxd.com/';
    return 'https://letterboxd.com/film/' + slug + '/';
  }

  function slugifyLetterboxdPerson(name) {
    return String(name || '')
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')

      .replace(/[^a-z0-9\s-]/g, '')

  function personLetterboxdUrl(card) {

      actor: 'actor',

      Legendary: 'linear-gradient(180deg, #3b2913 0%, #19140d 100%), linear-gradient(180deg, #fcd34d 0%, #d97706 100%)'

  function movieHasTag(movie, tag) {

    return { Base: 1, Select: 2, Epic: 3, Legendary: 4 }[normalizeRarityLabel(rarity)] || 1;

  function rarityByRank(rank) {
    return { 1: 'Base', 2: 'Select', 3: 'Epic', 4: 'Legendary' }[Math.max(1, Math.min(4, rank))] || 'Base';

  function roleLabelForDisplay(card) {

  function personKey(value) {
    return String(value || '')
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .trim()
      .toLowerCase();
  }

  function personIdentityKey(cardOrCandidate) {
    if (!cardOrCandidate) return '';
    const rawName = cardOrCandidate.title || cardOrCandidate.name || '';
    const normalizedName = personKey(rawName);
    if (!normalizedName) return '';
    const role = String(cardOrCandidate.roleKey || cardOrCandidate.personType || 'person').toLowerCase();
    return 'person:' + normalizedName + ':' + role;
