<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>filmTCG</title>
<style>
:root {
  --bg: #0b0c10;
  --panel: #12141b;
  --panel-2: #181b24;
  --text: #f5f5f5;
  --muted: #a1a1aa;
  --border: rgba(255,255,255,0.12);
  --shadow: 0 20px 40px rgba(0,0,0,0.4);
  --card-shell: #0f1218;
  --card-base: #171b24;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background:
    radial-gradient(circle at top, rgba(124,58,237,.12), transparent 28%),
    radial-gradient(circle at 80% 10%, rgba(245,158,11,.08), transparent 24%),
    var(--bg);
  color: var(--text);
  overflow-x: hidden;
}

button, a, select { font: inherit; }

.header {
  padding: 18px 20px;
  border-bottom: 1px solid var(--border);
  background: rgba(0,0,0,0.18);
  backdrop-filter: blur(10px);
}

.title {
  font-size: 1.7rem;
  font-weight: 900;
  letter-spacing: -0.04em;
}

.sub {
  color: var(--muted);
  font-size: 0.92rem;
  margin-top: 4px;
}

.nav {
  display: flex;
  gap: 10px;
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: rgba(11,12,16,0.84);
  backdrop-filter: blur(10px);
  z-index: 10;
}

.nav button,
.back-btn,
.arrow,
.filter-select,
.modal-close,
.collection-controls button {
  padding: 10px 14px;
  border: none;
  border-radius: 10px;
  background: #1f2937;
  color: white;
  cursor: pointer;
}

.nav button.active {
  background: linear-gradient(135deg, #4f46e5, #9333ea);
}

.filter-select {
  appearance: none;
  border: 1px solid var(--border);
  background: var(--panel-2);
}

.arrow {
  width: 48px;
  height: 48px;
  padding: 0;
  border-radius: 999px;
  display: grid;
  place-items: center;
  font-size: 1.35rem;
  box-shadow: 0 8px 20px rgba(0,0,0,.25);
}

.page {
  display: none;
  padding: 20px;
  max-width: 1180px;
  margin: 0 auto;
}

.page.active { display: block; }

.collection-topbar {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 12px;
  align-items: center;
  background: rgba(255,255,255,.04);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 14px;
}

.collection-stats {
  display: flex;
  gap: 18px;
  flex-wrap: wrap;
}

.collection-stat { min-width: 90px; }

.collection-stat-label {
  color: var(--muted);
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.collection-stat-value {
  font-size: 1.2rem;
  font-weight: 800;
  margin-top: 2px;
}

.collection-controls {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.view-toggle {
  display: inline-flex;
  padding: 4px;
  gap: 4px;
  border-radius: 12px;
  background: rgba(255,255,255,.04);
  border: 1px solid var(--border);
}

.view-toggle button {
  border: none;
  border-radius: 9px;
  padding: 8px 12px;
  background: transparent;
  color: rgba(255,255,255,.76);
  cursor: pointer;
}

.view-toggle button.is-active {
  background: rgba(255,255,255,.1);
  color: #fff;
}

.pack-area {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  min-height: 520px;
  justify-content: center;
}

.pack, .card {
  width: 300px;
  height: 430px;
  border-radius: 20px;
  flex: 0 0 auto;
}

.pack {
  background:
    radial-gradient(circle at 25% 20%, rgba(255,255,255,0.22), transparent 22%),
    linear-gradient(135deg, var(--pack-a, #4338ca) 0%, var(--pack-b, #6d28d9) 48%, var(--pack-c, #9333ea) 100%);
  border: 2px solid rgba(255,255,255,0.18);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
  text-align: center;
  padding: 20px;
  isolation: isolate;
  transform-style: preserve-3d;
  animation: packPulse 2.1s ease-in-out infinite;
  color: var(--pack-ink, #f8fafc);
}

.pack.opening { animation: packBeat .22s ease-in-out 2; }
.pack.is-shuffling {
  animation: packShuffle 900ms cubic-bezier(.2,.85,.2,1) forwards;
}

.pack.is-loading {
  cursor: wait;
  animation: packHover 1.45s ease-in-out infinite;
  opacity: 0.96;
  filter: saturate(1.08);
}

.pack::after {
  content: "CLICK TO OPEN";
  position: absolute;
  bottom: 14px;
  font-size: 0.8rem;
  letter-spacing: 0.12em;
  color: var(--pack-cta-ink, rgba(255,255,255,.86));
  opacity: 0.8;
}

.pack.is-loading::after {
  content: "LOADING REEL";
}

.pack.is-loading .pack-glint {
  animation: packLoadingSweep 1.8s linear infinite;
  opacity: 0.42;
}

.pack.is-loading .pack-glow {
  animation: packGlowPulse 1.5s ease-in-out infinite;
}

.pack-foil,
.pack-top-seal,
.pack-spine,
.pack-glint {
  position: absolute;
  pointer-events: none;
}

.pack-foil {
  inset: 0;
  background:
    linear-gradient(115deg, transparent 0%, transparent 28%, rgba(255,255,255,.18) 39%, rgba(255,255,255,.04) 48%, transparent 58%),
    linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.03) 28%, rgba(0,0,0,.16) 100%);
  z-index: 0;
}

.pack-glow {
  position: absolute;
  inset: auto auto -80px -70px;
  width: 220px;
  height: 220px;
  border-radius: 999px;
  background: var(--pack-glow, rgba(255,255,255,0.16));
  filter: blur(10px);
  opacity: 0.95;
  pointer-events: none;
  z-index: 0;
}

.pack-glint {
  top: 24px;
  right: 28px;
  width: 84px;
  height: 220px;
  background: linear-gradient(180deg, rgba(255,255,255,.42), rgba(255,255,255,0));
  opacity: 0.25;
  transform: rotate(20deg);
  filter: blur(2px);
  z-index: 1;
}

.pack-top-seal {
  left: 0;
  width: 100%;
  height: 26px;
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.22) 0 8px, rgba(255,255,255,.08) 8px 16px),
    linear-gradient(180deg, rgba(0,0,0,.18), rgba(255,255,255,.06));
  z-index: 2;
}

.pack-top-seal {
  top: 0;
  box-shadow: inset 0 -2px 0 rgba(0,0,0,.18);
}

.pack-spine {
  top: 24px;
  bottom: 24px;
  left: 14px;
  width: 18px;
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,.05));
  opacity: 0.55;
  z-index: 1;
}

.pack-title {
  font-size: 2rem;
  letter-spacing: -0.04em;
  position: relative;
  z-index: 1;
}

.pack-sub {
  font-size: 0.82rem;
  opacity: 1;
  color: var(--pack-sub-ink, rgba(248,250,252,.84));
  position: relative;
  z-index: 1;
  max-width: 180px;
}

.pack-tier {
  position: relative;
  z-index: 1;
  margin-top: 14px;
  padding: 7px 11px;
  border-radius: 999px;
  font-size: 0.76rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--pack-tier-ink, rgba(255,255,255,.82));
  border: 1px solid var(--pack-tier-border, rgba(255,255,255,.16));
  background: var(--pack-tier-bg, rgba(8,10,15,.32));
}

.status-line {
  color: var(--muted);
  font-size: 0.85rem;
  text-align: center;
  max-width: 760px;
  min-height: 1.35em;
  transition: opacity 180ms ease, transform 220ms ease;
}

.status-line.is-live {
  color: #dbeafe;
}

.status-line.is-loading {
  color: #e5e7eb;
}

.status-line.is-loading::after {
  content: " ...";
  display: inline-block;
  width: 2.2em;
  overflow: hidden;
  vertical-align: bottom;
  animation: loadingDots 1.1s steps(4, end) infinite;
}

.status-line.is-fading {
  opacity: 0;
  transform: translateY(-8px);
}

.pack-hook {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 34px;
  padding: 7px 14px;
  border-radius: 999px;
  font-size: 0.76rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: rgba(255,255,255,.78);
  background: rgba(255,255,255,.05);
  border: 1px solid rgba(255,255,255,.1);
}

.pack-hook strong {
  color: #fbbf24;
}

.reward-choice-wrap {
  display: grid;
  gap: 14px;
  justify-items: center;
  width: 100%;
}

.reward-choice-copy {
  text-align: center;
  color: var(--muted);
  font-size: 0.88rem;
  max-width: 34ch;
  transition: opacity 180ms ease, transform 220ms ease;
}

.reward-choice-copy.is-fading {
  opacity: 0;
  transform: translateY(-8px);
}

.reward-choice-grid {
  display: flex;
  gap: 18px;
  flex-wrap: wrap;
  justify-content: center;
  width: 100%;
  position: relative;
}

.reward-pack-option {
  position: relative;
  border: none;
  background: transparent;
  padding: 0;
  cursor: pointer;
  transition: transform 340ms cubic-bezier(.2,.85,.2,1), opacity 260ms ease, filter 260ms ease;
}

.reward-pack-option .pack {
  width: 238px;
  height: 342px;
  animation: none;
}

.reward-pack-option .pack.is-loading {
  animation: packHover 1.45s ease-in-out infinite;
}

.reward-pack-option .pack::after {
  content: "TAP TO CHOOSE";
}

.reward-pack-option:hover {
  transform: translateY(-6px);
}

.reward-pack-option.is-selected {
  transform: translateY(-8px) scale(1.06);
  z-index: 3;
}

.reward-pack-option.is-dismissed {
  opacity: 0;
  transform: translateX(var(--reward-dismiss-x, 0)) translateY(12px) scale(0.92) rotate(var(--reward-dismiss-rot, 0deg));
  pointer-events: none;
  filter: blur(1px);
}

.reward-pack-option.is-left {
  --reward-dismiss-x: -72px;
  --reward-dismiss-rot: -8deg;
  --reward-commit-x: 28px;
  --reward-commit-y: -6px;
}

.reward-pack-option.is-right {
  --reward-dismiss-x: 72px;
  --reward-dismiss-rot: 8deg;
  --reward-commit-x: -28px;
  --reward-commit-y: -6px;
}

.reward-choice-grid.is-committing .reward-pack-option {
  pointer-events: none;
}

.reward-pack-option.is-selected.is-committing {
  transform: translateX(var(--reward-commit-x, 0)) translateY(var(--reward-commit-y, -6px)) scale(1.26) rotate(0deg);
  z-index: 5;
}

.reward-pack-option.is-selected.is-committing .pack {
  animation: packHover 0.95s ease-in-out infinite;
}

.reward-pack-caption {
  margin-top: 10px;
  text-align: center;
  color: rgba(255,255,255,.86);
  font-size: 0.76rem;
  line-height: 1.35;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.carousel-wrap {
  display: grid;
  grid-template-rows: 24px 468px 52px;
  justify-items: center;
  align-items: center;
  gap: 18px;
  width: 100%;
}

.carousel {
  position: relative;
  width: 100%;
  height: 100%;
}

.overlap-stack {
  position: relative;
  width: 100%;
  min-height: 468px;
  display: flex;
  align-items: center;
  justify-content: center;
  --stack-arrow-offset: clamp(10px, calc(50% - 182px), 136px);
}

.overlap-ghost {
  position: absolute;
  width: 300px;
  height: 430px;
  border-radius: 20px;
  pointer-events: none;
  overflow: hidden;
  background: linear-gradient(160deg, #1a1f2b 0%, #10141c 100%);
  border: 3px solid rgba(255,255,255,.16);
  box-shadow: 0 18px 30px rgba(0,0,0,.24);
  opacity: 1;
  z-index: 1;
}

.overlap-ghost-core {
  position: absolute;
  inset: 14px;
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,.14);
  background:
    radial-gradient(circle at top, rgba(255,255,255,.1), transparent 32%),
    linear-gradient(180deg, #232939 0%, #121722 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

.overlap-ghost-rarity {
  position: absolute;
  top: 12px;
  width: 34px;
  height: 34px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 1rem;
  font-weight: 900;
  letter-spacing: 0.02em;
  color: #f8fafc;
  border: 1px solid rgba(255,255,255,.16);
  box-shadow: 0 8px 22px rgba(0,0,0,.28);
  z-index: 2;
}

.overlap-ghost.is-left-1 .overlap-ghost-rarity,
.overlap-ghost.is-left-2 .overlap-ghost-rarity {
  left: 12px;
}

.overlap-ghost.is-right-1 .overlap-ghost-rarity,
.overlap-ghost.is-right-2 .overlap-ghost-rarity {
  right: 12px;
}

.overlap-ghost-title {
  max-width: 68%;
  font-size: 0.9rem;
  font-weight: 900;
  line-height: 1.05;
  letter-spacing: -0.03em;
  text-align: center;
  text-wrap: balance;
}

.overlap-ghost-meta {
  max-width: 72%;
  font-size: 0.68rem;
  line-height: 1.2;
  letter-spacing: 0.08em;
  opacity: 0.75;
  text-transform: uppercase;
  text-align: center;
}

.overlap-ghost::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background:
    linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,0)),
    repeating-linear-gradient(135deg, rgba(255,255,255,.03) 0 10px, rgba(255,255,255,0) 10px 20px);
}

.overlap-ghost.is-left-1 { transform: translateX(-34px) translateY(6px) rotate(-2deg); }
.overlap-ghost.is-left-2 { transform: translateX(-58px) translateY(12px) rotate(-4deg); }
.overlap-ghost.is-right-1 { transform: translateX(34px) translateY(6px) rotate(2deg); }
.overlap-ghost.is-right-2 { transform: translateX(58px) translateY(12px) rotate(4deg); }

.overlap-count {
  position: absolute;
  right: 12px;
  top: 12px;
  min-width: 32px;
  height: 32px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0 10px;
  background: rgba(12,13,18,.88);
  border: 1px solid rgba(255,255,255,.14);
  color: white;
  font-size: 0.78rem;
  font-weight: 800;
  z-index: 4;
}

.peel-card-wrap {
  position: relative;
  width: 300px;
  height: 430px;
  z-index: 3;
}

.peel-card-wrap.is-interactive {
  cursor: pointer;
  touch-action: pan-y;
}

.peel-card-wrap::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 20px;
  background:
    radial-gradient(circle at top, rgba(255,255,255,.08), transparent 30%),
    linear-gradient(180deg, #1c2230, #0f1218);
  box-shadow: var(--shadow);
  z-index: 0;
}

.peel-card-wrap.is-peeling-out { animation: peelOut 280ms ease forwards; }
.peel-card-wrap.is-peeling-in { animation: peelIn 320ms ease forwards; }

.stack-arrow {
  position: absolute;
  top: 50%;
  z-index: 6;
  border: 1px solid rgba(255,255,255,.16);
  background: rgba(12,16,24,.52);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 12px 26px rgba(0,0,0,.28);
}

.stack-arrow.is-left {
  left: var(--stack-arrow-offset);
  transform: translateY(-50%);
}

.stack-arrow.is-right {
  right: var(--stack-arrow-offset);
  transform: translateY(-50%);
}

.card {
  padding: 10px;
  background:
    linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.015)),
    linear-gradient(180deg, var(--card-base), var(--card-shell));
  border: 3px solid #6b7280;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
  display: grid;
  grid-template-rows: auto 232px 1fr;
  transition: transform 260ms ease, box-shadow 260ms ease;
  isolation: isolate;
  color: #fff;
}

.card::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(circle at top left, rgba(255,255,255,.14), transparent 34%),
    linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
  z-index: 0;
}

.card > * { position: relative; z-index: 1; }
.card:hover { transform: translateY(-6px) rotate(0.6deg); }

.card.epic { animation: epicGlow 2.4s ease-in-out infinite; }
.card.legendary { animation: legendaryGlow 2.4s ease-in-out infinite; }

.card.epic::after,
.card.legendary::after {
  content: "";
  position: absolute;
  inset: -20%;
  background: linear-gradient(100deg, transparent 25%, rgba(255,255,255,.08) 45%, rgba(255,255,255,.35) 50%, rgba(255,255,255,.08) 55%, transparent 75%);
  pointer-events: none;
  animation: shimmer 2.8s linear infinite;
  z-index: 3;
}

.card-frame {
  position: absolute;
  inset: 8px;
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,.12);
  pointer-events: none;
  z-index: 2;
}

.card-header {
  display: flex;
  justify-content: space-between;
  align-items: stretch;
  gap: 10px;
  margin-bottom: 8px;
  padding: 10px 10px 6px;
  font-weight: 800;
  min-height: 58px;
}

.card-title {
  line-height: 1.16;
  font-size: 1.02rem;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  text-overflow: ellipsis;
  max-height: 2.32em;
  width: 100%;
}

.card-title-meta {
  display: flex;
  align-items: center;
  min-width: 0;
  flex: 1 1 auto;
  min-height: 2.32em;
  overflow: hidden;
}

.card-side-meta {
  display: grid;
  align-content: center;
  justify-items: end;
  gap: 3px;
  flex: 0 0 68px;
  width: 68px;
  text-align: right;
}

.card-year {
  font-size: 0.72rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: rgba(255,255,255,.66);
}

.card-rarity {
  font-size: 0.82rem;
  opacity: 0.9;
  white-space: nowrap;
  padding-top: 2px;
}

.card-img-wrap {
  position: relative;
  border-radius: 12px;
  overflow: hidden;
  background: #000;
  border: 1px solid rgba(255,255,255,.1);
  height: 232px;
}

.bookmark-btn {
  position: absolute;
  top: 10px;
  right: 10px;
  z-index: 7;
  width: 34px;
  height: 34px;
  border: 1px solid rgba(255,255,255,.18);
  border-radius: 999px;
  background: rgba(9,12,18,.56);
  color: rgba(255,255,255,.72);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 1rem;
  cursor: pointer;
  transition: transform 160ms ease, background 160ms ease, color 160ms ease, border-color 160ms ease;
}

.bookmark-btn:hover {
  transform: scale(1.04);
  color: #fff;
}

.bookmark-btn.is-bookmarked {
  background: rgba(251,191,36,.2);
  border-color: rgba(251,191,36,.42);
  color: #fbbf24;
}

.card-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.person-card {
  grid-template-rows: auto 1fr auto;
  padding: 10px;
}

.person-card.person-actor {
  background:
    linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.015)),
    linear-gradient(180deg, #2e1d17 0%, #170f0d 100%);
}

.person-card.person-director {
  background:
    linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.015)),
    linear-gradient(180deg, #172733 0%, #0d151b 100%);
}

.person-card.person-crew {
  background:
    linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.015)),
    linear-gradient(180deg, #20262f 0%, #12171e 100%);
}

.person-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 4px 4px 10px;
}

.person-role-badge {
  display: inline-flex;
  align-items: center;
  padding: 6px 10px;
  border-radius: 999px;
  font-size: 0.7rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: rgba(255,255,255,.88);
  background: rgba(8,10,16,.42);
  border: 1px solid rgba(255,255,255,.14);
}

.person-portrait-wrap {
  height: 252px;
}

.person-actor .person-portrait-wrap::after,
.person-director .person-portrait-wrap::after,

    let storedValue = '';

    const resolved = queryValue || configValue || (isHostedPage ? '' : storedValue) || DEFAULT_BACKEND_BASE;

      } catch (error) {

    return resolved;

    const key = cardKey(card);

    if (existingIndex !== -1) {
      showcase.splice(existingIndex, 1);

      return { active: false, changed: true, removed: true };

    if (showcase.length >= 4) {

    }

    showcase = [key].concat(showcase.filter(function (item) { return item !== key; })).slice(0, 4);
    saveShowcase();
    return { active: true, changed: true, added: true };

  function derivePacks(movie) {
    const tags = new Set(['all']);
    const names = Array.isArray(movie.genreNames) ? movie.genreNames : [];
    const lookup = {};
    const year = Number(movie.year) || 0;

    names.forEach(function (name) {
      lookup[String(name).toLowerCase()] = true;
    });

    if (lookup.horror || lookup.thriller) tags.add('horror');
    if (lookup.crime || lookup.noir || lookup.thriller || lookup.mystery) tags.add('noir');
    if (lookup.animation || lookup.family) tags.add('animation');
    if (year >= 1980 && year <= 1989) tags.add('eighties');
    if (movie.originalLanguage && String(movie.originalLanguage).toLowerCase() !== 'en') tags.add('international');
    if (isFemaleDirected(movie)) tags.add('female');

    return Array.from(tags);

    const r = (value >> 16) & 255;

    const b = value & 255;
    return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';

  async function fetchBackendJson(path) {
    const response = await fetch(TMDB_BACKEND_BASE + path, backendFetchOptions());
    const contentType = response.headers.get('content-type') || '';
    const bodyText = await response.text();

    if (!response.ok) {
      throw new Error('HTTP ' + response.status + ' for ' + path + ': ' + bodyText.slice(0, 160));
    }

    if (contentType.indexOf('application/json') === -1) {
      throw new Error('Non-JSON response for ' + path + ': ' + bodyText.slice(0, 160));
    }

    return JSON.parse(bodyText);
  }

    artworkStatus = 'Loaded ' + data.movies.length + ' live films from ' + dataSourceLabel + '.';

    replaceMoviePool(data.movies, (data.sourceLabel || 'TMDB') + ' Fresh Draw');
    activeReelCycleKey = currentReelCycleKey();
    activeReelSeenTitles = new Set();
    artworkStatus = 'Fresh deck built from ' + data.movies.length + ' live films.';
    return true;
  }

  async function fetchMovieArt(title) {
    if (artCache.has(title)) return artCache.get(title);
    const data = await fetchBackendJson('/api/movie-art?title=' + encodeURIComponent(title));
    artCache.set(title, data);
    return data;
  }

  async function fetchMoviePeople(movieIds) {
    const ids = (Array.isArray(movieIds) ? movieIds : []).map(function (id) {
      return Number(id) || 0;
    }).filter(Boolean);
    if (!ids.length) return [];
    const data = await fetchBackendJson('/api/movie-people?movieIds=' + ids.join(','));
    return data && Array.isArray(data.people) ? data.people : [];
  }

  async function hydrateMoviesFromBackend() {
    let successCount = 0;
    for (let i = 0; i < movies.length; i += 1) {
      const movie = movies[i];
      try {
        const art = await fetchMovieArt(movie.title);
        movie.poster = art.poster || null;
        movie.still = art.backdrop || null;
        movie.tmdbId = art.tmdbId || null;
        movie.year = art.year || null;
        movie.genreNames = Array.isArray(art.genreNames) ? art.genreNames.slice() : movie.genreNames;
        movie.packs = Array.isArray(art.packs) && art.packs.length ? art.packs.slice() : movie.packs;
        movie.desc = art.desc || movie.desc;
        movie.originalLanguage = art.originalLanguage || movie.originalLanguage;
        movie.directorName = art.directorName || movie.directorName;
        movie.directorGender = art.directorGender != null ? Number(art.directorGender) : movie.directorGender;
        movie.genre = inferPrimaryGenre(movie);
        movie.artMode = chooseArtMode(movie);
        if (movie.poster || movie.still) successCount += 1;
      } catch (error) {
        movie.artMode = 'generated';
      }
    }

    artworkStatus = successCount > 0
      ? 'Live art resolved for ' + successCount + ' films from ' + dataSourceLabel + '.'
      : 'Backend unavailable. Falling back to generated card art.';
  }

  function resolveArt(movie) {
    if (movie.cardType === 'person') {
      if (movie.profile) return proxied(movie.profile);
      return makePersonDataUri(movie);
    }
    if (movie.artMode === 'still' && movie.still) return proxied(movie.still);
    if (movie.poster) return proxied(movie.poster);
    if (movie.still) return proxied(movie.still);
    return makePosterDataUri(movie);
  }

  function resolveCardLink(card) {
    if (card && card.cardType === 'person') {
      return personLetterboxdUrl(card);
    }
    return card.linkUrl || letterboxdUrl(card);
  }

  function computeStats(movie) {
    const baseByRarity = { Common: 58, Uncommon: 66, Rare: 74, Epic: 84, Legendary: 94 };
    const atkByGenre = { Horror: 10, Thriller: 8, Crime: 6, Action: 9, Drama: 1, 'Sci-Fi': 4, Comedy: 2, Film: 3 };
    const defByGenre = { Drama: 10, 'Sci-Fi': 7, Crime: 5, Thriller: 4, Horror: 2, Action: 3, Comedy: 4, Film: 3 };
    const base = baseByRarity[movie.rarity] || 60;
    return {
      atk: Math.min(99, base + (atkByGenre[movie.genre] || 2)),
      def: Math.min(99, base + (defByGenre[movie.genre] || 3))
    };
  }

  function getPackPool(themeKey) {
    const selectedTheme = themeKey || currentPackTheme;
    if (selectedTheme === 'gold') return movies.slice();
    return movies.filter(function (movie) {
      return selectedTheme === 'all' ? true : (movie.packs || ['all']).indexOf(selectedTheme) !== -1;
    });
  }

  function getAvailableFeaturedRewardThemes() {
    if (dataSourceLabel.indexOf('TMDB') !== -1) {
      return FEATURED_REWARD_THEMES.slice();
    }
    const strongMatches = FEATURED_REWARD_THEMES.filter(function (themeKey) {
      return getPackPool(themeKey).length >= PACK_SIZE;
    });
    if (strongMatches.length) return strongMatches;
    return FEATURED_REWARD_THEMES.filter(function (themeKey) {
      return getPackPool(themeKey).length > 0;
    });
  }

  function chooseFeaturedRewardTheme(previousTheme) {
    const availableThemes = getAvailableFeaturedRewardThemes();
    if (!availableThemes.length) return null;
    const filtered = availableThemes.filter(function (themeKey) { return themeKey !== previousTheme; });
    const source = filtered.length ? filtered : availableThemes;
    return source[Math.floor(Math.random() * source.length)];
  }

  function ensureFeaturedRewardTheme(forceNew) {
    const needsNew = forceNew || !progress.featuredRewardTheme || getPackPool(progress.featuredRewardTheme).length < PACK_SIZE;
    if (needsNew) {
      progress.featuredRewardTheme = chooseFeaturedRewardTheme(progress.featuredRewardTheme);
    }
    return progress.featuredRewardTheme;
  }

  function resolvePackTheme(forceDifferent) {
    if (selectedPackMode !== 'all-packs') {
      currentPackTheme = selectedPackMode;
      return currentPackTheme;
    }

    const availableThemes = Object.keys(ALL_PACKS_ROLL).filter(function (themeKey) {
      return getPackPool(themeKey).length >= PACK_SIZE;
    }).map(function (themeKey) {
      return {
        key: themeKey,
        weight: ALL_PACKS_ROLL[themeKey]
      };
    });

    if (!availableThemes.length) {
      currentPackTheme = 'all';
      return currentPackTheme;
    }

    let candidates = availableThemes;
    if (progress.allPacksCinemaStreak >= 2) {
      candidates = availableThemes.filter(function (entry) { return entry.key !== 'all'; });
      if (!candidates.length) candidates = availableThemes;
    }
    if (forceDifferent && candidates.length > 1) {
      candidates = candidates.filter(function (entry) { return entry.key !== currentPackTheme; });
      if (!candidates.length) candidates = availableThemes;
    }

    currentPackTheme = weightedChoice(candidates).key;
    return currentPackTheme;
  }

  function updatePackMeta() {
    const rewardThemeKey = progress.rewardChoicesAvailable > 0 ? ensureFeaturedRewardTheme(false) : null;
    const displayThemeKey = rewardThemeKey || currentPackTheme;
    const pool = progress.rewardChoicesAvailable > 0
      ? movies
      : getPackPool(displayThemeKey === 'gold' ? 'all' : displayThemeKey);
    const theme = PACK_THEMES[displayThemeKey] || PACK_THEMES.all;
    document.getElementById('packThemeLabel').textContent = progress.rewardChoicesAvailable > 0 ? 'Reward Choice' : theme.label;
    document.getElementById('poolSizeValue').textContent = String(pool.length);
    document.getElementById('packSeriesValue').textContent = progress.rewardChoicesAvailable > 0
      ? 'Choose 1'
      : theme.tier;
  }

  function slugifyLetterboxd(title) {
    return title.toLowerCase().replace(/&/g, 'and').replace(/[^a-z0-9\s-]/g, '').trim().replace(/\s+/g, '-').replace(/-+/g, '-');
  }

  function letterboxdUrl(movie) {
    return 'https://letterboxd.com/film/' + slugifyLetterboxd(movie.title) + '/';
  }

  function slugifyLetterboxdPerson(name) {
    return String(name || '')
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toLowerCase()
      .replace(/&/g, 'and')
      .replace(/[^a-z0-9\s-]/g, '')
      .trim()
      .replace(/\s+/g, '-')
      .replace(/-+/g, '-');
  }

  function personLetterboxdUrl(card) {
    const rolePath = {
      actor: 'actor',
      director: 'director',
      writer: 'writer',
      producer: 'producer',
      editor: 'editor',
      cinematographer: 'cinematographer',
      composer: 'composer'
    }[card && card.roleKey] || 'actor';
    return 'https://letterboxd.com/' + rolePath + '/' + slugifyLetterboxdPerson(card && card.title) + '/';
  }

  function buildCardBackground(rarity) {
    const backgrounds = {
      Common: 'linear-gradient(180deg, #232a36 0%, #151a22 100%), linear-gradient(180deg, #8f9bab 0%, #6b7787 100%)',
      Uncommon: 'linear-gradient(180deg, #1b332d 0%, #111a1a 100%), linear-gradient(180deg, #22c55e 0%, #0f766e 100%)',
      Rare: 'linear-gradient(180deg, #1a2a42 0%, #111827 100%), linear-gradient(180deg, #60a5fa 0%, #4338ca 100%)',
      Epic: 'linear-gradient(180deg, #2b1f3b 0%, #161320 100%), linear-gradient(180deg, #d8b4fe 0%, #7e22ce 100%)',
      Legendary: 'linear-gradient(180deg, #3b2913 0%, #19140d 100%), linear-gradient(180deg, #fcd34d 0%, #d97706 100%)'
    };
    return backgrounds[rarity] || backgrounds.Common;
  }

  function artLabel(movie) {
    if (movie.artMode === 'still') return 'Backdrop';
    return '';
  }

  function movieYearNumber(movie) {
    return Number(movie.year) || 0;
  }

  function movieHasTag(movie, tag) {
    return Array.isArray(movie.packs) && movie.packs.indexOf(tag) !== -1;
  }

  function rarityRank(rarity) {
    return { Common: 1, Uncommon: 2, Rare: 3, Epic: 4, Legendary: 5 }[rarity] || 1;
  }

  function rarityByRank(rank) {
    return { 1: 'Common', 2: 'Uncommon', 3: 'Rare', 4: 'Epic', 5: 'Legendary' }[Math.max(1, Math.min(5, rank))] || 'Common';
  }

  function roleLabelForDisplay(card) {
    return card.roleLabel || card.genre || 'Film Figure';
  }

  function personKey(value) {
    return String(value || '')
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .trim()
      .toLowerCase();
  }

  function collectionMetaLabel(card) {
    if (card.cardType === 'person') {
      return card.rarity + ' · ' + roleLabelForDisplay(card);
    }
    return card.rarity + ' · ' + card.genre + (card.year ? ' · ' + card.year : '');
  }

  function collectionSecondaryLabel(card) {
    if (card.cardType === 'person') {
      if (card.roleKey === 'director') return 'Dir.';
      if (card.roleKey === 'actor') return 'Actor';
      return '';
    }
    return card.directorName ? ('Dir. ' + card.directorName) : 'Dir. Unknown';
  }

  function buildCollectionKindMarkup(card) {
    const iconClass = card.cardType === 'person' ? 'is-person' : 'is-film';
    const inlineMeta = card.cardType === 'film'
      ? (card.year ? '<span class="collection-list-year">' + escapeHtml(card.year) + '</span>' : '')
      : (card.roleKey !== 'actor' && card.roleKey !== 'director'
        ? '<span class="collection-list-year">' + escapeHtml(roleLabelForDisplay(card)) + '</span>'
        : '');
    return '<div class="collection-kind"><span class="collection-kind-icon ' + iconClass + '" aria-hidden="true"></span><span class="collection-titleline"><span class="collection-list-title">' + escapeHtml(card.title) + '</span>' + inlineMeta + '</span></div>';
  }

  function matchesCollectionSearch(card) {
    const query = String(collectionSearch || '').trim().toLowerCase();
    if (!query) return true;
    const haystack = [
      card.title,
      collectionSecondaryLabel(card),
      card.year,
      card.rarity,
      card.genre,
      roleLabelForDisplay(card)
    ].filter(Boolean).join(' ').toLowerCase();
    return haystack.indexOf(query) !== -1;
  }

  function buildPersonRoleWeights(themeKey) {
    const weights = Object.assign({}, PERSON_ROLE_WEIGHTS);
    const bonus = PERSON_ROLE_THEME_BONUS[themeKey] || {};
    Object.keys(bonus).forEach(function (key) {
      weights[key] = (weights[key] || 0) + bonus[key];
    });
    return weights;
  }

  function derivePersonRarity(candidate, sourceMovie) {
    const sourceRank = rarityRank(sourceMovie && sourceMovie.rarity);
    const popularity = Number(candidate && candidate.popularity) || 0;
    const explicitFloor = PERSON_RARITY_FLOORS[personKey(candidate && candidate.name)];
    let rank = Math.max(2, sourceRank - 1);

    if (candidate.personType === 'director') rank = Math.max(rank, sourceRank);
    if (candidate.personType === 'actor') rank = Math.max(rank, sourceRank - 1);
    if (candidate.personType === 'crew') rank = Math.max(2, sourceRank - 2);

    if (candidate.roleKey === 'director') rank = Math.max(rank, 3);
    if (candidate.roleKey === 'director' && popularity >= 10) rank = Math.max(rank, 4);
    if (candidate.roleKey === 'actor' && popularity >= 22) rank = Math.max(rank, 3);
    if ((candidate.roleKey === 'composer' || candidate.roleKey === 'cinematographer' || candidate.roleKey === 'writer') && popularity >= 9) rank = Math.max(rank, 3);
    if (popularity >= 25) rank += 1;
    if (popularity >= 45 && candidate.personType !== 'crew') rank += 1;
    if (candidate.roleKey === 'director' && sourceRank >= 4) rank = Math.max(rank, 4);
    if (candidate.roleKey === 'actor' && sourceRank >= 5 && popularity >= 20) rank = Math.max(rank, 4);
    if (candidate.roleKey === 'composer' || candidate.roleKey === 'cinematographer') rank = Math.min(rank, 4);
    if (candidate.roleKey === 'producer' || candidate.roleKey === 'editor' || candidate.roleKey === 'writer') rank = Math.min(rank, 4);
    if (explicitFloor) rank = Math.max(rank, rarityRank(explicitFloor));

    return rarityByRank(rank);
  }

  function buildPersonDescription(candidate, sourceMovie) {
    const sourceTitle = sourceMovie && sourceMovie.title ? sourceMovie.title : 'this pull';
    const role = candidate.roleLabel || 'Film Figure';
    if (candidate.roleKey === 'actor' && candidate.character) {
      return candidate.character + ' in ' + sourceTitle + '.';
    }
    return role + ' on ' + sourceTitle + '.';
  }

  function buildPersonCard(candidate, sourceMovie) {
    return normalizeMovieRecord({
      cardType: 'person',
      title: candidate.name,
      rarity: derivePersonRarity(candidate, sourceMovie),
      genre: candidate.roleLabel,
      desc: buildPersonDescription(candidate, sourceMovie),
      packs: sourceMovie && Array.isArray(sourceMovie.packs) ? sourceMovie.packs.slice() : ['all'],
      profile: candidate.profile,
      roleKey: candidate.roleKey,
      roleLabel: candidate.roleLabel,
      personType: candidate.personType,
      personId: candidate.personId,
      sourceTitle: sourceMovie ? sourceMovie.title : null,
      sourceYear: sourceMovie ? sourceMovie.year : null,
      character: candidate.character || '',
      linkUrl: candidate.linkUrl || null,
      popularity: candidate.popularity || 0
    });
  }

  function choosePersonCandidate(candidates, themeKey) {
    const weights = buildPersonRoleWeights(themeKey);
    const recentPulls = buildRecentPullSet();
    const filtered = (Array.isArray(candidates) ? candidates : []).filter(function (candidate) {
      return candidate && candidate.name && !recentPulls.has(candidate.name);
    });
    const source = filtered.length ? filtered : (Array.isArray(candidates) ? candidates : []);
    if (!source.length) return null;
    return weightedChoice(source.map(function (candidate) {
      return {
        weight: weights[candidate.roleKey] || 1,
        candidate: candidate
      };
    })).candidate;
  }

  function shuffledCopy(items) {
    const copy = Array.isArray(items) ? items.slice() : [];
    for (let i = copy.length - 1; i > 0; i -= 1) {
      const swapIndex = Math.floor(Math.random() * (i + 1));
      const temp = copy[i];
      copy[i] = copy[swapIndex];
      copy[swapIndex] = temp;
    }
    return copy;
  }

  function buildPersonSourceMovies(themeKey, currentPackMovies) {
    const packTitles = new Set((Array.isArray(currentPackMovies) ? currentPackMovies : []).map(function (movie) {
      return movie && movie.title;
    }).filter(Boolean));
    const recentTitles = buildRecentPullSet();
    const themedPool = getPackPool(themeKey).filter(function (movie) {
      return movie && movie.cardType !== 'person' && movie.tmdbId && !packTitles.has(movie.title) && !recentTitles.has(movie.title) && !activeReelSeenTitles.has(movie.title);
    });

    let sourcePool = themedPool;
    if (sourcePool.length < 8) {
      sourcePool = sourcePool.concat(movies.filter(function (movie) {
        return movie && movie.cardType !== 'person' && movie.tmdbId && !packTitles.has(movie.title) && !recentTitles.has(movie.title) && !activeReelSeenTitles.has(movie.title);
      }));
    }

    const deduped = [];
    const seenIds = new Set();
    sourcePool.forEach(function (movie) {
      const key = String(movie.tmdbId || movie.title || '');
      if (!key || seenIds.has(key)) return;
      seenIds.add(key);
      deduped.push(movie);
    });

    return shuffledCopy(deduped).slice(0, 12);
  }

  async function maybeBuildPersonInsert(sourceMovies, themeKey, isGoldRewardPack) {
    const insertChance = isGoldRewardPack ? PERSON_INSERT_CHANCE_GOLD : PERSON_INSERT_CHANCE;
    if (Math.random() > insertChance) return null;

    const validMovies = buildPersonSourceMovies(themeKey, sourceMovies);
    if (!validMovies.length) return null;

    const sourceById = {};
    validMovies.forEach(function (movie) {
      sourceById[String(movie.tmdbId)] = movie;
    });

    const candidates = await fetchMoviePeople(validMovies.map(function (movie) { return movie.tmdbId; }));
    const picked = choosePersonCandidate(candidates, themeKey);
    if (!picked) return null;

    return buildPersonCard(picked, sourceById[String(picked.sourceMovieId)] || validMovies[0]);
  }

  function buildFlavorTags(movie) {
    const tags = [];
    const year = movieYearNumber(movie);

    if (movie.voteAverage >= 8.0 && movie.voteCount >= 1200) tags.push('Awards Favorite');
    if (movieHasTag(movie, 'international') && movie.voteAverage >= 7.5) tags.push('Festival Favorite');
    if (movieHasTag(movie, 'horror') && year && year <= 2005) tags.push('Cult Classic');
    if (movieHasTag(movie, 'horror') && movie.rarity !== 'Common') tags.push('Midnight Movie');
    if (movieHasTag(movie, 'noir') && year && year <= 1975) tags.push('Noir Staple');
    if (movieHasTag(movie, 'female')) tags.push('Auteur Vision');
    if (movie.voteCount >= 2500) tags.push('Crowd Favorite');
    if (year && year <= 1980) tags.push('Canon Pick');
    if (movie.originalLanguage && String(movie.originalLanguage).toLowerCase() !== 'en') tags.push('World Cinema');

    return tags;
  }

  function buildCardChips(movie) {
    if (movie.cardType === 'person') {
      return ['<div class="chip">' + escapeHtml(roleLabelForDisplay(movie)) + '</div>'];
    }

    const chips = [];
    const artChip = artLabel(movie);
    const flavorTags = buildFlavorTags(movie);

    if (flavorTags.length) {
      chips.push('<div class="chip">' + escapeHtml(flavorTags[0]) + '</div>');
    } else {
      chips.push('<div class="chip">' + escapeHtml(movie.genre) + '</div>');
    }
    if (flavorTags.length > 1) {
      chips.push('<div class="chip">' + escapeHtml(flavorTags[1]) + '</div>');
    }
    if (!flavorTags.length && artChip) {
      chips.push('<div class="chip">' + escapeHtml(artChip) + '</div>');
    }

    return chips;
  }

  function buildGhostMarkup(positionClass, movie) {
    const rarity = movie ? movie.rarity : 'Common';
    const meta = movie
      ? (movie.cardType === 'person'
        ? roleLabelForDisplay(movie)
        : (movie.year || 'Film'))
      : 'filmTCG';
    const title = movie ? movie.title : 'filmTCG';
    return '<div class="overlap-ghost ' + positionClass + '" style="border-color:' + escapeHtml(rarityColor(movie ? movie.rarity : 'Common')) + ';">'
      + '<div class="overlap-ghost-core">'
      + '<span class="overlap-ghost-rarity" style="background:' + escapeHtml(rarityColor(rarity)) + ';">' + escapeHtml(rarityShortLabel(rarity)) + '</span>'
      + '<div class="overlap-ghost-title">' + escapeHtml(title) + '</div><div class="overlap-ghost-meta">' + escapeHtml(meta) + '</div></div>'
      + '</div>';
  }

  function buildBookmarkButtonMarkup(card) {
    return '<button class="bookmark-btn' + (isBookmarked(card) ? ' is-bookmarked' : '') + '" type="button" aria-label="Bookmark" data-bookmark-key="' + escapeHtml(cardKey(card)) + '">&#9733;</button>';
  }

  function rarityShortLabel(rarity) {
    return ({ Common: 'C', Uncommon: 'U', Rare: 'R', Epic: 'E', Legendary: 'L' })[rarity] || 'C';
  }

  function buildShowcaseButtonMarkup(card) {
    return '<button class="showcase-btn' + (isInShowcase(card) ? ' is-active' : '') + '" type="button" aria-label="Toggle Top 4 showcase" data-showcase-key="' + escapeHtml(cardKey(card)) + '">&#127942;</button>';
  }

  function buildShelfCardMarkup(card) {
    return buildCardMarkup(card, { includeBookmark: false });
  }

  function buildPackFaceMarkup(themeKey, options) {
    const theme = PACK_THEMES[themeKey] || PACK_THEMES.all;
    const style = '--pack-a:' + theme.colors[0]
      + '; --pack-b:' + theme.colors[1]
      + '; --pack-c:' + theme.colors[2]
      + '; --pack-ribbon-bg:rgba(255,255,255,.16)'
      + '; --pack-glow:radial-gradient(circle, rgba(255,255,255,.22) 0%, rgba(255,255,255,0) 68%)'
      + '; --pack-ink:' + (theme.ink || '#f8fafc')
      + '; --pack-sub-ink:' + (theme.subInk || 'rgba(248,250,252,.84)')
      + '; --pack-tier-ink:' + (theme.tierInk || 'rgba(255,255,255,.84)')
      + '; --pack-tier-bg:' + (theme.tierBg || 'rgba(8,10,15,.32)')
      + '; --pack-tier-border:' + (theme.tierBorder || 'rgba(255,255,255,.16)')
      + '; --pack-cta-ink:' + (theme.ctaInk || 'rgba(255,255,255,.84)');
    const config = options || {};
    const classes = 'pack' + (config.extraClasses ? ' ' + config.extraClasses : '');
    let attrs = ' class="' + escapeHtml(classes) + '"';
    if (config.id) attrs += ' id="' + escapeHtml(config.id) + '"';
    if (config.disabled) attrs += ' aria-disabled="true"';
    if (config.buttonLike) attrs += ' role="button" tabindex="0"';
    attrs += ' aria-label="' + escapeHtml(theme.label) + '"';
    attrs += ' style="' + escapeHtml(style) + '"';
    return '<div' + attrs + '>'
      + '<div class="pack-foil"></div>'
      + '<div class="pack-top-seal"></div>'
      + '<div class="pack-spine"></div>'
      + '<div class="pack-glow"></div>'
      + '<div class="pack-glint"></div>'
      + '<div class="pack-title">' + escapeHtml(theme.title) + '</div>'
      + '<div class="pack-sub">' + escapeHtml(theme.blurb) + '</div>'
      + '<div class="pack-tier">' + escapeHtml(theme.tier) + '<span class="pack-tier-count">' + PACK_SIZE + ' cards</span></div>'
      + '</div>';
  }

  function openExternalLink(card) {
    const href = resolveCardLink(card);
    if (!href) return;
    const link = document.createElement('a');
    link.href = href;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    link.click();
  }

  function attachPackCardInteractions(peelWrap, movie) {
    if (!peelWrap || !movie) return;

    let touchStartX = 0;
    let touchStartY = 0;
    let suppressTapUntil = 0;

    peelWrap.classList.add('is-interactive');

    peelWrap.addEventListener('click', function () {
      if (Date.now() < suppressTapUntil) return;
      openExternalLink(movie);
    });

    peelWrap.addEventListener('touchstart', function (event) {
      const touch = event.changedTouches && event.changedTouches[0];
      if (!touch) return;
      touchStartX = touch.clientX;
      touchStartY = touch.clientY;
    }, { passive: true });

    peelWrap.addEventListener('touchend', function (event) {
      const touch = event.changedTouches && event.changedTouches[0];
      if (!touch) return;

      const deltaX = touch.clientX - touchStartX;
      const deltaY = touch.clientY - touchStartY;

      if (Math.abs(deltaX) >= 44 && Math.abs(deltaY) <= 36) {
        suppressTapUntil = Date.now() + 450;
        if (deltaX < 0) {
          nextCard();
        } else {
          prevCard();
        }
      }
    }, { passive: true });
  }

  function buildCardMarkup(movie, options) {
    const config = options || {};
    const includeBookmark = config.includeBookmark !== false;
    const bookmarkMarkup = includeBookmark ? buildBookmarkButtonMarkup(movie) : '';

    if (movie.cardType === 'person') {
      const personClass = movie.personType === 'actor' ? 'person-actor' : (movie.personType === 'director' ? 'person-director' : 'person-crew');
      const bottomLine = roleLabelForDisplay(movie);
      return '<div class="card person-card ' + personClass + ' ' + movie.rarity.toLowerCase() + '" style="border-color:' + rarityColor(movie.rarity) + '; background:' + buildCardBackground(movie.rarity) + '">'
        + '<div class="card-frame"></div>'
        + '<div class="person-header"><div class="person-role-badge">' + escapeHtml(roleLabelForDisplay(movie)) + '</div><div class="card-rarity">' + escapeHtml(movie.rarity) + '</div></div>'
        + '<div class="card-img-wrap person-portrait-wrap">' + bookmarkMarkup + '<img class="card-img" src="' + escapeHtml(resolveArt(movie)) + '" alt="' + escapeHtml(movie.title) + ' portrait" data-title="' + escapeHtml(movie.title) + '" data-rarity="' + escapeHtml(movie.rarity) + '" data-genre="' + escapeHtml(movie.genre || roleLabelForDisplay(movie)) + '"></div>'
        + '<div class="person-bottom"><div class="person-name">' + escapeHtml(movie.title) + '</div><div class="person-role-line">' + escapeHtml(bottomLine) + '</div>' + (movie.character ? '<div class="person-source-line">' + escapeHtml(movie.character) + '</div>' : '') + '</div>'
        + '</div>';
    }

    const quote = QUOTES[movie.title] || '';
    const chips = buildCardChips(movie);
    const quoteMarkup = quote ? '<div class="quote">“' + escapeHtml(quote) + '”</div>' : '';
    return '<div class="card ' + movie.rarity.toLowerCase() + '" style="border-color:' + rarityColor(movie.rarity) + '; background:' + buildCardBackground(movie.rarity) + '">'
      + '<div class="card-frame"></div>'
      + '<div class="card-header"><div class="card-title-meta"><div class="card-title">' + escapeHtml(movie.title) + '</div></div><div class="card-side-meta"><div class="card-rarity">' + escapeHtml(movie.rarity) + '</div>' + (movie.year ? '<div class="card-year">' + escapeHtml(movie.year) + '</div>' : '') + '</div></div>'
      + '<div class="card-img-wrap">' + bookmarkMarkup + '<img class="card-img" src="' + escapeHtml(resolveArt(movie)) + '" alt="' + escapeHtml(movie.title) + ' artwork" data-poster="' + escapeHtml(movie.poster || '') + '" data-still="' + escapeHtml(movie.still || '') + '" data-title="' + escapeHtml(movie.title) + '" data-rarity="' + escapeHtml(movie.rarity) + '" data-genre="' + escapeHtml(movie.genre) + '">' + (movie.directorName ? '<div class="card-director-overlay">Dir. ' + escapeHtml(movie.directorName) + '</div>' : '') + '</div>'
      + '<div class="card-body"><div class="chips">' + chips.join('') + '</div><div class="desc">' + escapeHtml(movie.desc) + '</div>' + quoteMarkup + '</div>'
      + '</div>';
  }

  function addImageFallbacks(root) {
    root.querySelectorAll('img').forEach(function (img) {
      if (img.dataset.bound === 'true') return;
      img.dataset.bound = 'true';
      img.addEventListener('error', function () {
        if (img.dataset.triedPoster !== 'true' && img.dataset.poster) {
          img.dataset.triedPoster = 'true';
          img.src = proxied(img.dataset.poster) || img.dataset.poster;
          return;
        }
        if (img.dataset.triedStill !== 'true' && img.dataset.still) {
          img.dataset.triedStill = 'true';
          img.src = proxied(img.dataset.still) || img.dataset.still;
          return;
        }
        img.src = makePosterDataUri({
          title: img.dataset.title || 'Unknown',
          rarity: img.dataset.rarity || 'Common',
          genre: img.dataset.genre || 'Film'
        });
      });
    });
  }

  function attachBookmarkButtons(root, resolveCard) {
    root.querySelectorAll('.bookmark-btn').forEach(function (button) {
      if (button.dataset.bound === 'true') return;
      button.dataset.bound = 'true';
      button.addEventListener('click', function (event) {
        event.preventDefault();
        event.stopPropagation();
        const card = resolveCard(button);
        if (!card) return;
        const bookmarked = toggleBookmark(card);
        button.classList.toggle('is-bookmarked', bookmarked);

        }
      });

  function attachShowcaseButtons(root, resolveCard) {
    root.querySelectorAll('.showcase-btn').forEach(function (button) {
      if (button.dataset.bound === 'true') return;
      button.dataset.bound = 'true';
      button.addEventListener('click', function (event) {
        event.preventDefault();
        event.stopPropagation();
        const card = resolveCard(button);
        if (!card) return;
        const result = toggleShowcase(card);
        if (result.blocked === 'full') {

          return;
        }
        button.classList.toggle('is-active', result.active);
        renderShowcase();

  function matchesCollectionFilter(card) {
    if (collectionFilter === 'all') return true;
    if (collectionFilter === 'bookmarked') return isBookmarked(card);
    if (collectionFilter === 'films') return (card.cardType || 'film') === 'film';
    if (collectionFilter === 'people') return (card.cardType || 'film') === 'person';
    if (collectionFilter === 'actors') return card.cardType === 'person' && card.roleKey === 'actor';
    if (collectionFilter === 'directors') return card.cardType === 'person' && card.roleKey === 'director';
    if (collectionFilter === 'crew') return card.cardType === 'person' && card.roleKey !== 'actor' && card.roleKey !== 'director';
    return card.rarity === collectionFilter;
  }

  function getShowcaseCards() {
    return showcase.map(function (key) {
      return collection.find(function (card) { return cardKey(card) === key; }) || null;
    }).filter(Boolean).slice(0, 4);
  }

  function renderShowcase() {
    const cards = getShowcaseCards();
    const slots = [];

    for (let i = 0; i < 4; i += 1) {
      const card = cards[i];
      if (!card) {
        slots.push('<div class="showcase-slot"><div class="showcase-slot-label">Top ' + String(i + 1) + '</div></div>');
      } else {
        slots.push('<div class="showcase-card" role="button" tabindex="0" draggable="' + (showcaseEditMode ? 'true' : 'false') + '" data-showcase-index="' + String(i) + '" style="' + escapeHtml(collectionShellStyle(card)) + '">'
          + '<button class="showcase-remove-btn" type="button" aria-label="Remove from showcase" data-showcase-remove="' + String(i) + '">&#10005;</button>'
          + '<div class="showcase-card-preview">' + buildShelfCardMarkup(card) + '</div>'
          + '</div>');
      }
    }

    showcasePanel.classList.toggle('is-editing', showcaseEditMode);
    showcasePanel.innerHTML = '<div class="showcase-head"><div><div class="showcase-title"><span class="showcase-title-icon" aria-hidden="true">&#127942;</span>Top 4 Showcase</div><div class="showcase-sub">Pin favorite pulls and flex the weird stuff.</div></div><div class="showcase-head-actions"><button id="showcaseEditButton" class="showcase-edit-btn' + (showcaseEditMode ? ' is-active' : '') + '" type="button">' + (showcaseEditMode ? 'Done' : 'Edit Showcase') + '</button><div class="pack-hook">Pinned ' + String(cards.length) + ' / 4</div></div></div>'
      + '<div class="showcase-grid">' + slots.join('') + '</div>';

    addImageFallbacks(showcasePanel);
    const showcaseEditButton = document.getElementById('showcaseEditButton');
    if (showcaseEditButton) {
      showcaseEditButton.addEventListener('click', function () {
        showcaseEditMode = !showcaseEditMode;
        renderShowcase();
      });
    }
    showcasePanel.querySelectorAll('.showcase-card').forEach(function (button) {
      button.addEventListener('click', function () {
        if (showcaseEditMode) return;
        const card = cards[Number(button.dataset.showcaseIndex)];
        if (card) openCollectionModal(card);
      });
      button.addEventListener('keydown', function (event) {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          if (showcaseEditMode) return;
          const card = cards[Number(button.dataset.showcaseIndex)];
          if (card) openCollectionModal(card);
        }
      });
      button.addEventListener('dragstart', function (event) {
        if (!showcaseEditMode) {
          event.preventDefault();
          return;
        }
        draggedShowcaseIndex = Number(button.dataset.showcaseIndex);
        button.classList.add('is-dragging');
        if (event.dataTransfer) {
          event.dataTransfer.effectAllowed = 'move';
          event.dataTransfer.setData('text/plain', String(draggedShowcaseIndex));
        }
      });
      button.addEventListener('dragover', function (event) {
        if (!showcaseEditMode) return;
        event.preventDefault();
        if (draggedShowcaseIndex == null) return;
        button.classList.add('is-drop-target');
      });
      button.addEventListener('dragleave', function () {
        button.classList.remove('is-drop-target');
      });
      button.addEventListener('drop', function (event) {
        if (!showcaseEditMode) return;
        event.preventDefault();
        const targetIndex = Number(button.dataset.showcaseIndex);
        button.classList.remove('is-drop-target');
        if (draggedShowcaseIndex == null) return;
        moveShowcaseItem(draggedShowcaseIndex, targetIndex);
        draggedShowcaseIndex = null;
        renderShowcase();
      });
      button.addEventListener('dragend', function () {
        draggedShowcaseIndex = null;
        showcasePanel.querySelectorAll('.showcase-card').forEach(function (cardButton) {
          cardButton.classList.remove('is-dragging');
          cardButton.classList.remove('is-drop-target');
        });
      });
    });
    showcasePanel.querySelectorAll('.showcase-remove-btn').forEach(function (button) {
      button.addEventListener('click', function (event) {
        event.preventDefault();
        event.stopPropagation();
        const index = Number(button.dataset.showcaseRemove);
        const card = cards[index];
        if (!card) return;
        toggleShowcase(card);
        renderShowcase();
        if (collectionPage.classList.contains('active')) {
          renderCollection();
        }
      });
    });
  }

        + '<button class="reward-pack-option is-right" type="button" data-reward-choice="featured" data-reward-theme="' + escapeHtml(featuredThemeKey) + '">' + buildPackFaceMarkup(featuredThemeKey) + '<div class="reward-pack-caption">Featured: ' + escapeHtml(featuredTheme.label) + '</div></button>'

      pullArea.querySelectorAll('.reward-pack-option').forEach(function (button) {
