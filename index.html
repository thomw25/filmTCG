  async function restorePoolAfterReward() {
    if (!needsPoolRestoreAfterReward || dataSourceLabel.indexOf('TMDB') === -1) {
      needsPoolRestoreAfterReward = false;
      resolvePackTheme(true);
      updatePackMeta();
      backToPacks();
      return;
    }

    isPoolLoading = true;
    artworkStatus = 'Restoring the pack shelf...';
    resolvePackTheme(true);
    updatePackMeta();
    backToPacks();

    try {
      if (selectedPackMode !== 'all-packs') {
        await fetchThemedDynamicCardPool(selectedPackMode, false);
      } else {
        await fetchDynamicCardPool(false);
      }
    } catch (error) {
    }

    isPoolLoading = false;
    needsPoolRestoreAfterReward = false;
    resolvePackTheme(true);
    updatePackMeta();
    backToPacks();
  }

  async function chooseRewardPack(choiceKey, themeKey, selectedButton) {
    if (isOpeningPack || isPoolLoading) return;
    isOpeningPack = true;

    const rewardChoice = choiceKey === 'featured' ? 'featured' : 'gold';
    const resolvedFeaturedTheme = rewardChoice === 'featured'
      ? (themeKey || ensureFeaturedRewardTheme(false) || 'horror')
      : null;

    activeRewardSelection = rewardChoice;
    if (resolvedFeaturedTheme) {
      progress.featuredRewardTheme = resolvedFeaturedTheme;
    }

    const optionButtons = Array.from(pullArea.querySelectorAll('.reward-pack-option'));
    const rewardGrid = pullArea.querySelector('.reward-choice-grid');
    const rewardCopy = pullArea.querySelector('.reward-choice-copy');
    optionButtons.forEach(function (button) {
      button.disabled = true;
      if (button === selectedButton) {
        button.classList.add('is-selected');
      } else {
        button.classList.add('is-dismissed');
      }
    });
    if (rewardGrid) {
      rewardGrid.classList.add('is-committing');
    }
    if (rewardCopy) {
      rewardCopy.classList.add('is-fading');
    }
    if (selectedButton) {
      selectedButton.classList.add('is-committing');
    }

    const statusLine = pullArea.querySelector('.status-line');
    if (statusLine) {
      statusLine.classList.add('is-fading');
    }

    await new Promise(function (resolve) { setTimeout(resolve, 160); });

    if (statusLine) {
      statusLine.classList.remove('is-fading');
      statusLine.textContent = 'Locking in your pick...';
      statusLine.classList.add('is-loading');
    }

    const selectedPackFace = selectedButton && selectedButton.querySelector('.pack');
    await new Promise(function (resolve) { setTimeout(resolve, 420); });
    if (selectedPackFace) {
      selectedPackFace.classList.add('is-loading');
    }
    if (statusLine) {
      statusLine.textContent = rewardChoice === 'gold'
        ? 'Loading your reward pack...'
        : 'Loading your featured reward pack...';
    }
    await new Promise(function (resolve) { setTimeout(resolve, 180); });

    try {
      if (dataSourceLabel.indexOf('TMDB') !== -1) {
        if (rewardChoice === 'gold') {
          currentPackTheme = 'gold';
          await fetchDynamicCardPool(false).catch(function () { return false; });
          needsPoolRestoreAfterReward = selectedPackMode !== 'all-packs';
        } else {
          currentPackTheme = resolvedFeaturedTheme || 'horror';
          await fetchThemedDynamicCardPool(currentPackTheme, false).catch(function () { return false; });
          needsPoolRestoreAfterReward = selectedPackMode === 'all-packs' || selectedPackMode !== currentPackTheme;
        }
      } else {
        currentPackTheme = rewardChoice === 'gold' ? 'gold' : (resolvedFeaturedTheme || 'horror');
        needsPoolRestoreAfterReward = false;
      }

      updatePackMeta();
      await finalizePackOpen();
    } finally {
      isOpeningPack = false;
    }
  }

  function weightedChoice(entries) {
    const total = entries.reduce(function (sum, entry) { return sum + entry.weight; }, 0);
    let roll = Math.random() * total;
    for (let i = 0; i < entries.length; i += 1) {
      roll -= entries[i].weight;
      if (roll <= 0) return entries[i];
    }
    return entries[entries.length - 1];
  }

  function cloneMovie(movie) {
    return normalizeMovieRecord(movie);
  }

  function chooseCandidateWithAvoidance(candidates, excludedTitles, avoidedTitles) {
    const excluded = excludedTitles || new Set();
    const avoided = avoidedTitles || new Set();
    let filtered = (candidates || []).filter(function (movie) {
      return !excluded.has(movie.title) && !avoided.has(movie.title);
    });

    if (!filtered.length) {
      filtered = (candidates || []).filter(function (movie) {
        return !excluded.has(movie.title);
      });
    }

    if (!filtered.length) filtered = (candidates || []).slice();
    return filtered.length ? filtered[Math.floor(Math.random() * filtered.length)] : null;
  }

  function buildAvoidedTitleSet() {
    const avoided = buildRecentPullSet();
    activeReelSeenTitles.forEach(function (title) {
      avoided.add(title);
    });
    return avoided;
  }

  function chooseMovieForPack(pool, excludedTitles, guaranteedHighRarity) {
    const buckets = {};
    const avoidedTitles = buildAvoidedTitleSet();
    pool.forEach(function (movie) {
      if (!buckets[movie.rarity]) buckets[movie.rarity] = [];
      buckets[movie.rarity].push(movie);
    });

    if (guaranteedHighRarity) {
      let premiumCandidates = []
        .concat(buckets.Legendary || [])
        .concat(buckets.Epic || []);

      const premiumPick = chooseCandidateWithAvoidance(premiumCandidates, excludedTitles, avoidedTitles);
      if (premiumPick) {
        return cloneMovie(premiumPick);
      }
    }

    const availableOdds = PULL_ODDS.filter(function (entry) { return buckets[entry.rarity] && buckets[entry.rarity].length; });
    const pickedRarity = availableOdds.length ? weightedChoice(availableOdds).rarity : 'Common';
    let pickedMovie = chooseCandidateWithAvoidance(buckets[pickedRarity] || [], excludedTitles, avoidedTitles);

    if (!pickedMovie) {
      pickedMovie = chooseCandidateWithAvoidance(pool, excludedTitles, avoidedTitles);
    }

    return cloneMovie(pickedMovie || pool[Math.floor(Math.random() * pool.length)]);
  }

  function sortPackForReveal(cards) {
    const weights = { Common: 1, Uncommon: 2, Rare: 3, Epic: 4, Legendary: 5 };
    const sorted = cards.slice().sort(function (a, b) { return weights[a.rarity] - weights[b.rarity]; });
    const highIndex = sorted.findIndex(function (card) { return card.rarity === 'Epic' || card.rarity === 'Legendary'; });
    if (highIndex !== -1) {
      const target = sorted.length >= 4 ? sorted.length - 2 : sorted.length - 1;
      const picked = sorted.splice(highIndex, 1)[0];
      sorted.splice(target, 0, picked);
    }
    return sorted;
  }

  async function openPack() {
    if (isOpeningPack || isPoolLoading) return;
    isOpeningPack = true;
    const currentPack = document.getElementById('openPackButton');
    if (currentPack) {
      currentPack.classList.add('opening');
      currentPack.classList.add('is-shuffling');
      const statusLine = pullArea.querySelector('.status-line');
      if (statusLine) {
        statusLine.textContent = 'Cracking a fresh pack...';
        statusLine.classList.add('is-live');
      }
    }

    const requestedTheme = selectedPackMode !== 'all-packs' ? currentPackTheme : '';
    const shouldRefreshReel = dataSourceLabel.indexOf('TMDB') !== -1;

    if (currentPack) {
      const statusLine = pullArea.querySelector('.status-line');
      if (statusLine && shouldRefreshReel) {
        statusLine.textContent = requestedTheme
          ? 'Pulling a fresh themed pack...'
          : 'Shuffling a fresh draw...';
      }
    }

    const waitForAnimation = new Promise(function (resolve) {
      setTimeout(resolve, 900);
    });
    const refreshPromise = shouldRefreshReel
      ? refreshPoolForPackOpen(false, requestedTheme).catch(function () { return false; })
      : Promise.resolve(false);

    await Promise.all([waitForAnimation, refreshPromise]);
    if (getPackPool().length < PACK_SIZE) resolvePackTheme(false);
    updatePackMeta();

    try {
      await finalizePackOpen();
    } finally {
      isOpeningPack = false;
    }
  }

  async function finalizePackOpen() {
    const pool = getPackPool();
    if (!pool.length) {
      artworkStatus = 'No cards available for that pack theme yet.';
      resolvePackTheme(true);
      updatePackMeta();
      backToPacks();
      return;
    }

    pack = [];
    const seenTitles = new Set();
    const isRewardPack = Boolean(activeRewardSelection) && progress.rewardChoicesAvailable > 0;
    const isGoldRewardPack = isRewardPack && activeRewardSelection === 'gold';
    const shouldTryPersonInsert = dataSourceLabel.indexOf('TMDB') !== -1;
    const filmSlots = shouldTryPersonInsert ? (PACK_SIZE - 1) : PACK_SIZE;

    for (let i = 0; i < filmSlots; i += 1) {
      const movie = chooseMovieForPack(pool, seenTitles, isGoldRewardPack && i === 0);
      pack.push(movie);
      collection.unshift(movie);
      if (pool.length > PACK_SIZE) seenTitles.add(movie.title);
      activeReelSeenTitles.add(movie.title);
    }

    if (shouldTryPersonInsert) {
      const personInsert = await maybeBuildPersonInsert(pack, currentPackTheme, isGoldRewardPack).catch(function () { return null; });
      if (personInsert) {
        pack.push(personInsert);
        collection.unshift(personInsert);
        activeReelSeenTitles.add(personInsert.title);
      } else {
        while (pack.length < PACK_SIZE) {
          const fallbackMovie = chooseMovieForPack(pool, seenTitles, false);
          pack.push(fallbackMovie);
          collection.unshift(fallbackMovie);
          if (pool.length > PACK_SIZE) seenTitles.add(fallbackMovie.title);
          activeReelSeenTitles.add(fallbackMovie.title);
        }
      }
    }

    while (pack.length < PACK_SIZE) {
      const movie = chooseMovieForPack(pool, seenTitles, false);
      pack.push(movie);
      collection.unshift(movie);
      if (pool.length > PACK_SIZE) seenTitles.add(movie.title);
      activeReelSeenTitles.add(movie.title);
    }

    if (isRewardPack) {
      progress.rewardChoicesAvailable = Math.max(0, progress.rewardChoicesAvailable - 1);
      progress.featuredRewardTheme = null;
      progress.allPacksCinemaStreak = 0;
      artworkStatus = isGoldRewardPack
        ? (pack.some(function (card) { return card.cardType === 'person'; })
          ? 'Gold pack cracked. Premium film plus a people insert delivered.'
          : 'Gold pack cracked. Guaranteed purple or gold delivered.')
        : (pack.some(function (card) { return card.cardType === 'person'; })
          ? 'Featured pack cracked. Focused pull plus a people insert delivered.'
          : 'Featured pack cracked. Focused pull delivered.');
      activeRewardSelection = null;
    } else {
      progress.standardPacksOpened += 1;
      if (selectedPackMode === 'all-packs') {
        progress.allPacksCinemaStreak = currentPackTheme === 'all'
          ? (progress.allPacksCinemaStreak + 1)
          : 0;
      } else {
        progress.allPacksCinemaStreak = 0;
      }
      if (progress.standardPacksOpened % REEL_REFRESH_INTERVAL === 0) {
        progress.rewardChoicesAvailable += 1;
        ensureFeaturedRewardTheme(true);
        artworkStatus = 'Reward choice unlocked. Pick gold or featured.';
      } else if (pack.some(function (card) { return card.cardType === 'person'; })) {
        artworkStatus = 'People insert found in the sixth slot.';
      }
    }

    rememberPulledTitles(pack);
    saveCollection();
    saveProgress();
    pack = sortPackForReveal(pack);
    index = 0;
    renderCarousel();
  }

  function renderCarousel() {
    if (!pack.length) {
      backToPacks();
      return;
    }

    const current = pack[index];
    const prevOne = index > 0 ? pack[index - 1] : null;
    const prevTwo = index > 1 ? pack[index - 2] : null;
    const nextOne = index < pack.length - 1 ? pack[index + 1] : null;
    const nextTwo = index < pack.length - 2 ? pack[index + 2] : null;
    const remainingAfter = Math.max(0, pack.length - index - 1);
    const seenBefore = Math.max(0, index);
    let ghostMarkup = '';

    if (seenBefore > 1 && prevTwo) ghostMarkup += buildGhostMarkup('is-left-2', prevTwo);
    if (seenBefore > 0 && prevOne) ghostMarkup += buildGhostMarkup('is-left-1', prevOne);
    if (remainingAfter > 1 && nextTwo) ghostMarkup += buildGhostMarkup('is-right-2', nextTwo);
    if (remainingAfter > 0 && nextOne) ghostMarkup += buildGhostMarkup('is-right-1', nextOne);

    pullArea.innerHTML = '<div class="carousel-wrap">'
      + '<div class="progress">Card ' + (index + 1) + ' of ' + pack.length + ' · ' + escapeHtml(dataSourceLabel) + '</div>'
      + '<div class="carousel">'
      + '<div class="overlap-stack">'
      + ghostMarkup
      + '<button id="prevArrow" type="button" class="arrow stack-arrow is-left" aria-label="Previous card">&#8592;</button>'
      + '<div class="overlap-count">' + String(remainingAfter) + '</div><div class="peel-card-wrap">' + buildCardMarkup(current) + '</div>'
      + '<button id="nextArrow" type="button" class="arrow stack-arrow is-right" aria-label="Next card">&#8594;</button>'
      + '</div>'
      + '</div>'
      + '<button id="backToPacksButton" type="button" class="back-btn">Open More Packs</button>'
      + '</div>';

    document.getElementById('prevArrow').addEventListener('click', prevCard);
    document.getElementById('nextArrow').addEventListener('click', nextCard);
    document.getElementById('backToPacksButton').addEventListener('click', function () {
      restorePoolAfterReward();
    });
    addImageFallbacks(pullArea);
    attachBookmarkButtons(pullArea, function () { return current; });

    const peelWrap = pullArea.querySelector('.peel-card-wrap');
    attachPackCardInteractions(peelWrap, current);
    peelWrap.classList.add('is-peeling-in');
    setTimeout(function () { peelWrap.classList.remove('is-peeling-in'); }, 320);
  }

  function animateToCard(direction) {
    if (!pack.length || isAnimatingPeel) return;
    isAnimatingPeel = true;
    const wrap = pullArea.querySelector('.peel-card-wrap');
    if (wrap) {
      wrap.classList.remove('is-peeling-in');
      wrap.classList.add('is-peeling-out');
    }
    setTimeout(function () {
      index = direction === 'next'
        ? (index + 1) % pack.length
        : (index - 1 + pack.length) % pack.length;
      renderCarousel();
      setTimeout(function () { isAnimatingPeel = false; }, 340);
    }, 220);
  }

  function nextCard() { animateToCard('next'); }
  function prevCard() { animateToCard('prev'); }

  function openCollectionModal(movie) {
    if (movie.cardType === 'person') {
      modalBody.innerHTML = '<div class="modal-grid">'
        + '<div><img class="modal-poster" src="' + escapeHtml(resolveArt(movie)) + '" alt="' + escapeHtml(movie.title) + ' portrait" data-title="' + escapeHtml(movie.title) + '" data-rarity="' + escapeHtml(movie.rarity) + '" data-genre="' + escapeHtml(movie.genre || roleLabelForDisplay(movie)) + '"></div>'
        + '<div class="modal-meta"><div class="modal-title">' + escapeHtml(movie.title) + '</div>'
      + '<div class="chips"><div class="chip">' + escapeHtml(movie.rarity) + '</div><div class="chip">' + escapeHtml(roleLabelForDisplay(movie)) + '</div></div>'
      + '<div class="modal-sub">' + escapeHtml(movie.desc) + '</div>'
      + '<div class="modal-actions"><button class="modal-button" type="button" id="modalShowcaseButton">' + (isInShowcase(movie) ? 'Remove From Top 4' : 'Add To Top 4') + '</button><a class="modal-button" href="' + escapeHtml(resolveCardLink(movie)) + '" target="_blank" rel="noopener noreferrer">Open on Letterboxd</a></div></div></div>';
      addImageFallbacks(modalBody);
      bindModalShowcaseButton(movie);
      cardModal.classList.add('open');
      cardModal.setAttribute('aria-hidden', 'false');
      return;
    }

    const quote = QUOTES[movie.title] || '';
    modalBody.innerHTML = '<div class="modal-grid">'
      + '<div><img class="modal-poster" src="' + escapeHtml(resolveArt(movie)) + '" alt="' + escapeHtml(movie.title) + ' artwork" data-poster="' + escapeHtml(movie.poster || '') + '" data-still="' + escapeHtml(movie.still || '') + '" data-title="' + escapeHtml(movie.title) + '" data-rarity="' + escapeHtml(movie.rarity) + '" data-genre="' + escapeHtml(movie.genre) + '"></div>'
      + '<div class="modal-meta"><div class="modal-title">' + escapeHtml(movie.title) + '</div>'
      + '<div class="chips"><div class="chip">' + escapeHtml(movie.rarity) + '</div><div class="chip">' + escapeHtml(movie.genre) + '</div>' + (movie.year ? '<div class="chip">' + escapeHtml(movie.year) + '</div>' : '') + (movie.directorName ? '<div class="chip is-director">Dir. ' + escapeHtml(movie.directorName) + '</div>' : '') + '</div>'
      + '<div class="modal-sub">' + escapeHtml(movie.desc) + '</div>'
      + (quote ? '<div class="quote">“' + escapeHtml(quote) + '”</div>' : '')
      + '<div class="modal-actions"><button class="modal-button" type="button" id="modalShowcaseButton">' + (isInShowcase(movie) ? 'Remove From Top 4' : 'Add To Top 4') + '</button><a class="modal-button" href="' + escapeHtml(letterboxdUrl(movie)) + '" target="_blank" rel="noopener noreferrer">Open on Letterboxd</a></div></div></div>';
    addImageFallbacks(modalBody);
    bindModalShowcaseButton(movie);
    cardModal.classList.add('open');
    cardModal.setAttribute('aria-hidden', 'false');
  }

  function bindModalShowcaseButton(movie) {
    const button = document.getElementById('modalShowcaseButton');
    if (!button) return;
    button.addEventListener('click', function () {
      const result = toggleShowcase(movie);
      if (result.blocked === 'full') {
        showToast('Showcase is full. Make a lil room on your shelf!');
        return;
      }
      button.textContent = result.active ? 'Remove From Top 4' : 'Add To Top 4';
      renderShowcase();
      if (collectionPage.classList.contains('active')) {
        renderCollection();
      }
    });
  }

  function closeCollectionModal() {
    cardModal.classList.remove('open');
    cardModal.setAttribute('aria-hidden', 'true');
  }

  function renderCollection() {
    const rarityOrder = { Legendary: 5, Epic: 4, Rare: 3, Uncommon: 2, Common: 1 };
    const filtered = collection.filter(function (card) {
      return matchesCollectionFilter(card) && matchesCollectionSearch(card);
    }).slice();

    filtered.sort(function (a, b) {
      if (collectionSort === 'title') return a.title.localeCompare(b.title);
      if (collectionSort === 'rarity') return (rarityOrder[b.rarity] || 0) - (rarityOrder[a.rarity] || 0) || a.title.localeCompare(b.title);
      return 0;
    });

    document.getElementById('collectionCount').textContent = String(collection.length);
    document.getElementById('uniqueCount').textContent = String(new Set(collection.map(function (movie) {
      return (movie.cardType || 'film') + ':' + movie.title;
    })).size);
    document.getElementById('legendaryCount').textContent = String(collection.filter(function (movie) {
      return movie.rarity === 'Legendary' || movie.rarity === 'Epic';
    }).length);
    renderCollectionViewToggle();

    if (!filtered.length) {
      collectionGrid.innerHTML = '<div class="empty-state">No matching cards yet. Open a pack or change your filter.</div>';
      renderShowcase();
      return;
    }

    if (collectionView === 'list') {
      collectionGrid.classList.remove('collection-grid');
      collectionGrid.classList.add('collection-list');
      collectionGrid.innerHTML = filtered.map(function (movie, filteredIndex) {
        if (movie.cardType === 'person') {
          return '<div class="collection-list-item is-person" role="button" tabindex="0" data-index="' + filteredIndex + '" style="' + escapeHtml(collectionShellStyle(movie)) + '">'
            + buildCollectionKindMarkup(movie)
            + '<div class="collection-list-role">' + escapeHtml(roleLabelForDisplay(movie)) + '</div>'
            + '<span class="lb-badge is-rarity" style="background:' + escapeHtml(rarityColor(movie.rarity)) + '; border-color:' + escapeHtml(rarityColor(movie.rarity)) + ';">' + escapeHtml(rarityShortLabel(movie.rarity)) + '</span>'
            + buildBookmarkButtonMarkup(movie)
            + buildShowcaseButtonMarkup(movie)
            + '</div>';
        }

        return '<div class="collection-list-item is-film" role="button" tabindex="0" data-index="' + filteredIndex + '" style="' + escapeHtml(collectionShellStyle(movie)) + '">'
          + buildCollectionKindMarkup(movie)
          + '<div class="collection-list-secondary">' + escapeHtml(collectionSecondaryLabel(movie)) + '</div>'
          + '<span class="lb-badge is-rarity" style="background:' + escapeHtml(rarityColor(movie.rarity)) + '; border-color:' + escapeHtml(rarityColor(movie.rarity)) + ';">' + escapeHtml(rarityShortLabel(movie.rarity)) + '</span>'
          + buildBookmarkButtonMarkup(movie)
          + buildShowcaseButtonMarkup(movie)
          + '</div>';
      }).join('');
    } else {
      collectionGrid.classList.add('collection-grid');
      collectionGrid.classList.remove('collection-list');
      collectionGrid.innerHTML = filtered.map(function (movie, filteredIndex) {
        return '<div class="collection-card" role="button" tabindex="0" data-index="' + filteredIndex + '" style="' + escapeHtml(collectionShellStyle(movie)) + '">'
          + '<div class="collection-card-preview">' + buildShelfCardMarkup(movie) + '</div>'
          + '<div class="collection-card-actions"><span class="lb-badge is-rarity" style="background:' + escapeHtml(rarityColor(movie.rarity)) + '; border-color:' + escapeHtml(rarityColor(movie.rarity)) + ';">' + escapeHtml(rarityShortLabel(movie.rarity)) + '</span><span class="collection-card-actions-right">' + buildShowcaseButtonMarkup(movie) + buildBookmarkButtonMarkup(movie) + '</span></div>'
          + '</div>';
      }).join('');
    }

    addImageFallbacks(collectionGrid);
    renderShowcase();
    attachBookmarkButtons(collectionGrid, function (button) {
      const target = button.closest('[data-index]');
      return filtered[Number(target && target.dataset.index)];
    });
    attachShowcaseButtons(collectionGrid, function (button) {
      const target = button.closest('[data-index]');
      return filtered[Number(target && target.dataset.index)];
    });
    collectionGrid.querySelectorAll('.collection-card, .collection-list-item').forEach(function (button) {
      button.addEventListener('click', function () {
        const item = filtered[Number(button.dataset.index)];
        if (item) openCollectionModal(item);
      });
      button.addEventListener('keydown', function (event) {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          const item = filtered[Number(button.dataset.index)];
          if (item) openCollectionModal(item);
        }
      });
    });
  }

  function showPage(id) {
    pullPage.classList.toggle('active', id === 'pull');
    collectionPage.classList.toggle('active', id === 'collection');
    pullTab.classList.toggle('active', id === 'pull');
    collectionTab.classList.toggle('active', id === 'collection');
    if (id === 'collection') renderCollection();
  }

  async function init() {
    resolvePackTheme(false);
    artworkStatus = 'Loading live film pool...';
    updatePackMeta();
    backToPacks();

    try {
      const loadedLivePool = await fetchDynamicCardPool(false);
      if (!loadedLivePool) {
        await hydrateMoviesFromBackend();
      }
    } catch (error) {
      artworkStatus = 'Backend unavailable. Falling back to generated card art.';
      try {
        await hydrateMoviesFromBackend();
      } catch (innerError) {
      }
    }

    if (!movies.length || getPackPool(selectedPackMode === 'all-packs' ? 'all' : selectedPackMode).length < 1) {
      replaceMoviePool(SAMPLE_MOVIES, 'Sample Set');
      artworkStatus = 'Live pool was unusable. Falling back to the sample set.';
    }

    isPoolLoading = false;
    resolvePackTheme(false);
    updatePackMeta();
    backToPacks();

    const packThemeEl = document.getElementById('packTheme');
    const sortEl = document.getElementById('collectionSort');
    const filterEl = document.getElementById('collectionFilter');
    const collectionViewListEl = document.getElementById('collectionViewList');
    const collectionViewGridEl = document.getElementById('collectionViewGrid');

    modalClose.addEventListener('click', closeCollectionModal);
    cardModal.addEventListener('click', function (event) {
      if (event.target === cardModal) closeCollectionModal();
    });
    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape') closeCollectionModal();
    });

    packThemeEl.value = selectedPackMode;
    packThemeEl.addEventListener('change', async function (event) {
      selectedPackMode = event.target.value;
      resolvePackTheme(true);
      isPoolLoading = true;
      artworkStatus = selectedPackMode === 'all-packs'
        ? 'Loading a fresh mixed reel...'
        : 'Loading ' + (PACK_THEMES[selectedPackMode] ? PACK_THEMES[selectedPackMode].label : 'that pack') + '...';
      updatePackMeta();
      backToPacks();
      if (dataSourceLabel.indexOf('TMDB') !== -1 && selectedPackMode !== 'all-packs') {
        await fetchThemedDynamicCardPool(selectedPackMode, false).catch(function () { return false; });
      } else if (dataSourceLabel.indexOf('TMDB') !== -1) {
        await fetchDynamicCardPool(false).catch(function () { return false; });
      }
      needsPoolRestoreAfterReward = false;
      isPoolLoading = false;
      updatePackMeta();
      backToPacks();
    });

    sortEl.value = collectionSort;
    sortEl.addEventListener('change', function (event) {
      collectionSort = event.target.value;
      renderCollection();
    });

    filterEl.value = collectionFilter;
    filterEl.addEventListener('change', function (event) {
      collectionFilter = event.target.value;
      renderCollection();
    });

    collectionSearchEl.addEventListener('input', function (event) {
      collectionSearch = event.target.value || '';
      renderCollection();
    });

    renderCollectionViewToggle();
    collectionViewListEl.addEventListener('click', function () {
      collectionView = 'list';
      saveCollectionView();
      renderCollection();
    });
    collectionViewGridEl.addEventListener('click', function () {
      collectionView = 'grid';
      saveCollectionView();
      renderCollection();
    });

    pullTab.addEventListener('click', function () { showPage('pull'); });
    collectionTab.addEventListener('click', function () { showPage('collection'); });
  }

  init();
})();
</script>
</body>
</html>
