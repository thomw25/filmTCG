  function collectionMetaLabel(card) {
    if (card.cardType === 'person') {

    return card.rarity + ' · ' + card.genre + (card.year ? ' · ' + card.year : '');

  function collectionSecondaryLabel(card) {
    if (card.cardType === 'person') {
      if (card.roleKey === 'director') return 'Dir.';
      if (card.roleKey === 'actor') return 'Actor';

    return card.directorName ? ('Dir. ' + card.directorName) : 'Dir. Unknown';

  function buildCollectionKindMarkup(card, duplicateCount) {
    const iconClass = card.cardType === 'person' ? 'is-person' : 'is-film';

  function matchesCollectionSearch(card) {
    const query = String(collectionSearch || '').trim().toLowerCase();
    if (!query) return true;
    const haystack = [
      card.title,
      collectionSecondaryLabel(card),
      card.year,
      card.rarity,
      card.genre,
      roleLabelForDisplay(card)
    ].filter(Boolean).join(' ').toLowerCase();
    return haystack.indexOf(query) !== -1;
  }

  function buildPersonRoleWeights(themeKey) {
    const weights = Object.assign({}, PERSON_ROLE_WEIGHTS);
    const bonus = PERSON_ROLE_THEME_BONUS[themeKey] || {};
    Object.keys(bonus).forEach(function (key) {
      weights[key] = (weights[key] || 0) + bonus[key];
    });
    return weights;
  }

  function computePersonSignals(candidate, sourceMovie, explicitFloor) {
    const sourceRank = rarityRank(sourceMovie && sourceMovie.rarity);
    const knownForPeakRank = Number(candidate && candidate.knownForPeakRank) || 0;
    const knownForDepth = Number(candidate && candidate.knownForDepth) || 0;
    const referenceRank = Math.max(sourceRank, knownForPeakRank);
    const popularity = Number(candidate && candidate.popularity) || 0;
    const isDirector = candidate && candidate.roleKey === 'director';
    const isActor = !isDirector;

    let recognition = 0;
    if (popularity >= 8) recognition += 1;
    if (popularity >= 18) recognition += 1;
    if (popularity >= 30) recognition += 1;
    if (popularity >= 48) recognition += 1;
    if (popularity >= 70) recognition += 1;
    if (knownForPeakRank >= 3) recognition += 1;
    if (knownForDepth >= 3) recognition += 1;
    if (isDirector && knownForDepth >= 3) recognition += 1;
    if (isActor && knownForDepth >= 5) recognition += 1;
    if (isActor && popularity >= 14 && knownForDepth >= 2) recognition += 1;
    if (isActor && knownForPeakRank >= 2 && knownForDepth >= 4) recognition += 1;
    if (isActor && knownForPeakRank >= 2 && popularity >= 18) recognition += 1;

    let respect = 0;
    if (referenceRank >= 2) respect += 1;
    if (referenceRank >= 3) respect += 1;
    if (knownForDepth >= 2) respect += 1;
    if (knownForPeakRank >= 3 && knownForDepth >= 3) respect += 1;
    if (isDirector && referenceRank >= 3) respect += 1;
    if (isDirector && popularity >= 10) respect += 1;
    if (isDirector && knownForPeakRank >= 3 && knownForDepth >= 3) respect += 1;
    if (isDirector && knownForPeakRank >= 4 && knownForDepth >= 3) respect += 1;
    if (isActor && referenceRank >= 3 && popularity >= 12) respect += 1;
    if (isActor && knownForPeakRank >= 3 && knownForDepth >= 3) respect += 1;
    if (isActor && knownForPeakRank >= 3 && knownForDepth >= 2) respect += 1;
    if (isActor && knownForPeakRank >= 2 && knownForDepth >= 4) respect += 1;
    if (isActor && knownForPeakRank >= 2 && popularity >= 22) respect += 1;
    if (isActor && popularity >= 26) respect += 1;
    if (isActor && popularity >= 42) respect += 1;

    let cult = 0;
    if (popularity >= 8 && popularity <= 30 && referenceRank >= 2) cult += 1;
    if (referenceRank >= 3 && popularity <= 32) cult += 1;
    if (isDirector && knownForPeakRank >= 3 && knownForDepth >= 2 && popularity <= 30) cult += 1;
    if (isActor && knownForPeakRank >= 3 && knownForDepth >= 3 && popularity <= 24) cult += 1;

    const floorRank = explicitFloor ? rarityRank(explicitFloor) : 0;
    const canon = floorRank >= 4 ? 1 : 0;
    const auteurDirectorProxy = Boolean(isDirector && (
      (knownForPeakRank >= 3 && knownForDepth >= 2)
      || (knownForPeakRank >= 2 && knownForDepth >= 4)
      || (knownForPeakRank >= 4 && knownForDepth >= 1)
    ));
    const directorPantheonProxy = Boolean(isDirector && (
      (knownForPeakRank >= 4 && knownForDepth >= 3)
      || (knownForPeakRank >= 4 && knownForDepth >= 2)
      || (knownForPeakRank >= 3 && knownForDepth >= 5)
    ));
    const modernAuteurMajorProxy = Boolean(isDirector && (
      (knownForPeakRank >= 3 && knownForDepth >= 2 && popularity >= 10)
      || (knownForPeakRank >= 4 && knownForDepth >= 1 && popularity >= 10)
    ));
    const modernAuteurPantheonProxy = Boolean(isDirector && (
      (knownForPeakRank >= 4 && knownForDepth >= 3)
      || (knownForPeakRank >= 4 && knownForDepth >= 2 && popularity >= 14)
      || (knownForPeakRank >= 3 && knownForDepth >= 4 && popularity >= 16)
      || (knownForPeakRank >= 3 && knownForDepth >= 3 && popularity >= 24)
    ));
    const iconicStudioDirectorProxy = Boolean(isDirector && (
      (knownForPeakRank >= 3 && knownForDepth >= 2 && popularity >= 7)
      || (knownForPeakRank >= 3 && knownForDepth >= 1 && popularity >= 12)
      || (knownForPeakRank >= 2 && knownForDepth >= 3 && popularity >= 8)
    ));
    const iconicStarProxy = Boolean(isActor && (
      (knownForPeakRank >= 3 && popularity >= 18)
      || (knownForPeakRank >= 3 && knownForDepth >= 3 && popularity >= 14)
      || (knownForPeakRank >= 2 && popularity >= 42)
    ));
    const majorActorProxy = Boolean(isActor && (
      (knownForPeakRank >= 3 && knownForDepth >= 3)
      || (knownForPeakRank >= 3 && popularity >= 24)
    ));
    const actorPantheonProxy = Boolean(isActor && (
      (knownForPeakRank >= 4 && knownForDepth >= 3)
      || (knownForPeakRank >= 3 && knownForDepth >= 5 && popularity >= 24)
      || (knownForPeakRank >= 3 && popularity >= 46)
    ));
    const characterActorProxy = Boolean(isActor && (
      (knownForPeakRank >= 3 && knownForDepth >= 4 && popularity >= 4)
      || (knownForPeakRank >= 2 && knownForDepth >= 5 && popularity >= 4)
    ));
    const actorRecognitionProxy = Boolean(isActor && (
      (popularity >= 14 && knownForDepth >= 2)
      || (popularity >= 10 && knownForPeakRank >= 3)
      || (knownForPeakRank >= 2 && knownForDepth >= 4)
    ));
    const actorPrestigeProxy = Boolean(isActor && (
      (knownForPeakRank >= 3 && knownForDepth >= 2 && popularity >= 8)
      || (knownForPeakRank >= 2 && knownForDepth >= 5)
    ));

    return {
      recognition: recognition,
      respect: respect,
      cult: cult,
      canon: canon,
      auteurDirectorProxy: auteurDirectorProxy,
      directorPantheonProxy: directorPantheonProxy,
      modernAuteurMajorProxy: modernAuteurMajorProxy,
      modernAuteurPantheonProxy: modernAuteurPantheonProxy,
      iconicStudioDirectorProxy: iconicStudioDirectorProxy,
      iconicStarProxy: iconicStarProxy,
      majorActorProxy: majorActorProxy,
      actorPantheonProxy: actorPantheonProxy,
      characterActorProxy: characterActorProxy,
      actorRecognitionProxy: actorRecognitionProxy,
      actorPrestigeProxy: actorPrestigeProxy,
      sourceRank: sourceRank,
      knownForPeakRank: knownForPeakRank,
      knownForDepth: knownForDepth,
      referenceRank: referenceRank,
      popularity: popularity,
      floorRank: floorRank,
      isDirector: isDirector,
      isActor: isActor
    };
  }

  function derivePersonRarity(candidate, sourceMovie) {
    const explicitFloor = PERSON_RARITY_FLOORS[personKey(candidate && candidate.name)];
    const signals = computePersonSignals(candidate, sourceMovie, explicitFloor);
    let rank = 1;

    if (signals.popularity >= 8 || signals.knownForPeakRank >= 2 || signals.knownForDepth >= 1) {
      rank = Math.max(rank, 2);
    }

    if (signals.recognition >= 2 || signals.respect >= 2 || signals.cult >= 2 || signals.referenceRank >= 2) {
      rank = Math.max(rank, 2);
    }

    if (
      signals.respect >= 4
      || (signals.recognition >= 3 && signals.respect >= 2)
      || (signals.isActor
        ? (signals.knownForPeakRank >= 3 && signals.knownForDepth >= 3)
        : (signals.knownForPeakRank >= 3 && signals.knownForDepth >= 2))
      || signals.auteurDirectorProxy
      || signals.modernAuteurMajorProxy
      || signals.iconicStudioDirectorProxy
      || signals.majorActorProxy
      || signals.iconicStarProxy
      || signals.characterActorProxy
      || signals.actorRecognitionProxy
      || signals.actorPrestigeProxy
      || (signals.isActor && signals.knownForPeakRank >= 2 && signals.knownForDepth >= 4)
      || (signals.isActor && signals.knownForPeakRank >= 2 && signals.knownForDepth >= 2 && signals.popularity >= 16)
      || (signals.isActor && signals.referenceRank >= 2 && signals.popularity >= 16)
      || (signals.isActor && signals.knownForDepth >= 3 && signals.popularity >= 12)
      || (signals.isActor && signals.knownForPeakRank >= 2 && signals.popularity >= 22)
      || (signals.isActor && signals.popularity >= 24 && signals.recognition >= 2)
      || (signals.isActor && signals.popularity >= 30)
      || (signals.isActor && signals.popularity >= 40)
      || signals.floorRank >= 3
    ) {
      rank = Math.max(rank, 3);
    }

    if (
      signals.floorRank >= 4
      || signals.canon
      || signals.directorPantheonProxy
      || signals.modernAuteurPantheonProxy
      || signals.actorPantheonProxy
      || (!signals.isDirector && signals.iconicStarProxy && signals.knownForPeakRank >= 3 && signals.knownForDepth >= 3 && signals.popularity >= 34)
      || (signals.isDirector && signals.recognition >= 3 && signals.respect >= 3)
      || (signals.isActor && signals.iconicStarProxy && signals.knownForPeakRank >= 3 && signals.knownForDepth >= 3 && signals.popularity >= 34)
      || (signals.isActor && signals.knownForPeakRank >= 4 && signals.knownForDepth >= 2 && signals.popularity >= 20)
      || (signals.isActor && signals.knownForPeakRank >= 3 && signals.knownForDepth >= 4 && signals.popularity >= 24)
      || (signals.isActor && signals.popularity >= 46 && signals.knownForPeakRank >= 3)
      || (signals.isActor && signals.popularity >= 58 && signals.referenceRank >= 2)
      || (signals.isActor && signals.popularity >= 66 && signals.knownForPeakRank >= 2)
    ) {
      rank = Math.max(rank, 4);
    }

    return rarityByRank(rank);
  }

  function buildPersonDescription(candidate, sourceMovie) {
    const biography = String(candidate && candidate.biography || '').trim();
    if (biography.length >= 48) {
      return biography;
    }
    const role = candidate && candidate.roleLabel ? candidate.roleLabel : 'Film Figure';
    const sourceLabel = sourceMovie && sourceMovie.title
      ? (' Pulled from ' + String(sourceMovie.title) + (sourceMovie.year ? (' (' + String(sourceMovie.year) + ')') : '') + '.')
      : '';
    return role + ' card.' + sourceLabel;
  }

  function getMergedKnownForTitles(candidate) {
    const fromKnownFor = Array.isArray(candidate && candidate.knownForTitles)
      ? candidate.knownForTitles.filter(Boolean)
      : [];
    const fromFallback = Array.isArray(candidate && candidate.fallbackKnownForTitles)
      ? candidate.fallbackKnownForTitles.filter(Boolean)
      : [];
    return fromKnownFor.concat(fromFallback).filter(function (title, index, items) {
      return title && items.indexOf(title) === index;
    }).slice(0, 3);
  }

  function buildPersonCard(candidate, sourceMovie) {
    return normalizeMovieRecord({
      cardType: 'person',
      title: candidate.name,
      rarity: derivePersonRarity(candidate, sourceMovie),
      genre: candidate.roleLabel,
      desc: buildPersonDescription(candidate, sourceMovie),
      packs: sourceMovie && Array.isArray(sourceMovie.packs) ? sourceMovie.packs.slice() : ['all'],
      profile: candidate.profile,
      roleKey: candidate.roleKey,
      roleLabel: candidate.roleLabel,
      personType: candidate.personType,
      personId: candidate.personId,
      biography: candidate.biography || '',
      sourceMovieIds: candidate.sourceMovieIds || [],
      knownForTitles: getMergedKnownForTitles(candidate),
      fallbackKnownForTitles: [],
      knownForPeakRank: candidate.knownForPeakRank || 0,
      knownForDepth: candidate.knownForDepth || 0,
      sourceTitle: sourceMovie ? sourceMovie.title : null,
      sourceYear: sourceMovie ? sourceMovie.year : null,
      character: candidate.character || '',
      castOrder: candidate.castOrder != null ? Number(candidate.castOrder) : null,
      linkUrl: candidate.linkUrl || null,
      popularity: candidate.popularity || 0
    });
  }

  function choosePersonCandidate(candidates, themeKey) {
    const weights = buildPersonRoleWeights(themeKey);
    const recentPulls = buildRecentPersonSet();
    const filtered = (Array.isArray(candidates) ? candidates : []).filter(function (candidate) {
      return candidate && candidate.name && !recentPulls.has(personIdentityKey(candidate));
    });
    const source = filtered.length ? filtered : (Array.isArray(candidates) ? candidates : []);
    if (!source.length) return null;
    return weightedChoice(source.map(function (candidate) {
      let weight = weights[candidate.roleKey] || 1;
      const popularity = Number(candidate && candidate.popularity) || 0;
      const knownForDepth = Number(candidate && candidate.knownForDepth) || 0;
      const castOrder = Number(candidate && candidate.castOrder);
      const sourceMovieYear = Number(candidate && candidate.sourceMovieYear) || 0;

      if (candidate.roleKey === 'actor') {
        if (popularity >= 14) weight *= 0.78;
        if (popularity >= 22) weight *= 0.56;
        if (popularity >= 30) weight *= 0.38;
        if (popularity >= 42) weight *= 0.24;
        if (popularity >= 56) weight *= 0.14;
        if (popularity >= 3 && popularity <= 12) weight *= 1.34;
        if (knownForDepth >= 2 && popularity <= 20) weight *= 1.18;
        if (knownForDepth >= 3 && popularity <= 28) weight *= 1.14;
        if (Number.isFinite(castOrder)) {
          if (castOrder >= 5 && castOrder <= 18) weight *= 1.34;
          else if (castOrder >= 19 && castOrder <= 42) weight *= 1.22;
          else if (castOrder >= 43 && castOrder <= 70) weight *= 1.1;
          else if (castOrder >= 0 && castOrder <= 3) weight *= 0.88;
        }
        if (sourceMovieYear && sourceMovieYear <= 2000) weight *= 1.24;
        else if (sourceMovieYear && sourceMovieYear <= 2010) weight *= 1.1;
      }

      if (themeKey === 'actors' && candidate.roleKey === 'actor') {
        const estimatedRank = rarityRank(derivePersonRarity(candidate, null));
        const actorPackBias = ({
          1: 1.44,
          2: 1.34,
          3: 0.72,
          4: 0.22
        })[estimatedRank] || 1;
        weight *= actorPackBias;
        if (popularity >= 18) weight *= 0.68;
        if (popularity >= 28) weight *= 0.52;
        if (popularity >= 38) weight *= 0.38;
        if (popularity >= 50) weight *= 0.24;
        if (knownForDepth >= 2 && estimatedRank <= 2) weight *= 1.24;
        if (sourceMovieYear && sourceMovieYear <= 2000) weight *= 1.22;
      }
      return {
        weight: weight,
        candidate: candidate
      };
    })).candidate;
  }

  function shuffledCopy(items) {
    const copy = Array.isArray(items) ? items.slice() : [];
    for (let i = copy.length - 1; i > 0; i -= 1) {
      const swapIndex = Math.floor(Math.random() * (i + 1));
      const temp = copy[i];
      copy[i] = copy[swapIndex];
      copy[swapIndex] = temp;
    }
    return copy;
  }

  function buildPersonSourceMovies(themeKey, currentPackMovies) {
    const packMovies = (Array.isArray(currentPackMovies) ? currentPackMovies : []).filter(function (movie) {
      return movie && movie.cardType !== 'person' && movie.tmdbId;
    });
    const packTitles = new Set(packMovies.map(function (movie) {
      return filmIdentityKey(movie);
    }).filter(Boolean));
    const recentTitles = buildRecentPullSet();
    const prioritizedPackMovies = packMovies.filter(function (movie) {
      const key = filmIdentityKey(movie);
      return key && !recentTitles.has(key);
    });
    const themedPool = getPackPool(themeKey).filter(function (movie) {
      const key = filmIdentityKey(movie);
      return movie && movie.cardType !== 'person' && movie.tmdbId && key && !packTitles.has(key) && !recentTitles.has(key) && !activeReelSeenTitles.has(key);
    });

    let sourcePool = prioritizedPackMovies.concat(themedPool);
    if (sourcePool.length < 8) {
      sourcePool = sourcePool.concat(movies.filter(function (movie) {
        const key = filmIdentityKey(movie);
        return movie && movie.cardType !== 'person' && movie.tmdbId && key && !packTitles.has(key) && !recentTitles.has(key) && !activeReelSeenTitles.has(key);
      }));
    }

    const deduped = [];
    const seenIds = new Set();
    sourcePool.forEach(function (movie) {
      const key = String(movie.tmdbId || movie.title || '');
      if (!key || seenIds.has(key)) return;
      seenIds.add(key);
      deduped.push(movie);
    });

    return shuffledCopy(deduped).slice(0, 14);
  }

  async function maybeBuildPersonInsert(sourceMovies, themeKey, isGoldRewardPack, existingPersonKeys, existingPersonCards) {
    const insertChance = themeKey === 'actors'
      ? 1
      : (isGoldRewardPack ? PERSON_INSERT_CHANCE_GOLD : PERSON_INSERT_CHANCE);
    if (Math.random() > insertChance) return null;

    const validMovies = buildPersonSourceMovies(themeKey, sourceMovies);
    if (!validMovies.length) return null;

    const sourceById = {};
    validMovies.forEach(function (movie) {
      sourceById[String(movie.tmdbId)] = movie;
    });

    const sourceMovieIds = validMovies.map(function (movie) { return movie.tmdbId; });
    const primaryTimeout = themeKey === 'actors'
      ? Math.round(PERSON_INSERT_FETCH_TIMEOUT_MS * 1.25)
      : PERSON_INSERT_FETCH_TIMEOUT_MS;
    let candidates = await fetchMoviePeople(sourceMovieIds, primaryTimeout).catch(function () { return []; });
    if (!candidates.length) {
      const retryIds = sourceMovieIds.slice(0, Math.min(6, sourceMovieIds.length));
      const retryTimeout = Math.max(primaryTimeout, IS_MOBILE_RUNTIME ? 5200 : 7600);
      candidates = await fetchMoviePeople(retryIds, retryTimeout).catch(function () { return []; });
    }
    if (!Array.isArray(candidates) || !candidates.length) {
      return null;
    }
    candidates = (Array.isArray(candidates) ? candidates : []).map(function (candidate) {
      const sourceMovie = sourceById[String(candidate && candidate.sourceMovieId)] || null;
      return Object.assign({}, candidate, {
        sourceMovieYear: Number(sourceMovie && sourceMovie.year) || 0,
        sourceMovieRarity: normalizeRarityLabel(sourceMovie && sourceMovie.rarity)
      });
    });
    if (themeKey === 'actors') {
      const actorCandidates = candidates.filter(function (candidate) {
        return candidate && candidate.roleKey === 'actor';
      });
      if (actorCandidates.length) {
        candidates = actorCandidates;
      }
    }
    const existingKeys = existingPersonKeys || new Set();
    const existingCards = Array.isArray(existingPersonCards) ? existingPersonCards : [];
    if (existingKeys.size) {
      const filteredCandidates = candidates.filter(function (candidate) {
        return candidate && !existingKeys.has(personIdentityKey(candidate));
      });
      if (filteredCandidates.length) candidates = filteredCandidates;
    }
    const candidatePool = candidates.slice();
    let bestCandidate = null;
    let bestKnownFor = null;
    let bestScore = -1;
    const maxAttempts = Math.min(themeKey === 'actors' ? 8 : 5, candidatePool.length);

    for (let attempt = 0; attempt < maxAttempts; attempt += 1) {
      const picked = choosePersonCandidate(candidatePool, themeKey);
      if (!picked) break;
      const pickedKey = personIdentityKey(picked);
      const pickedIndex = candidatePool.findIndex(function (candidate) {
        return candidate && personIdentityKey(candidate) === pickedKey;
      });
      if (pickedIndex !== -1) candidatePool.splice(pickedIndex, 1);

      const seededKnownFor = {
        knownForTitles: Array.isArray(picked.knownForTitles) ? picked.knownForTitles.filter(Boolean).slice(0, 3) : [],
        knownForPeakRank: Number(picked.knownForPeakRank) || 0,
        knownForDepth: Number(picked.knownForDepth) || 0
      };
      const knownFor = seededKnownFor;
      const titleCount = Array.isArray(knownFor.knownForTitles) ? knownFor.knownForTitles.length : 0;
      const popularity = Number(picked && picked.popularity) || 0;
      const castOrder = Number(picked && picked.castOrder);
      const sourceMovieYear = Number(picked && picked.sourceMovieYear) || 0;
      const popularityBandBonus = popularity >= 4 && popularity <= 24 ? 18 : 0;
      const mainstreamPenalty = popularity >= 22 ? ((popularity - 22) * 3.2) : 0;
      const characterBonus = Number.isFinite(castOrder)
        ? (castOrder >= 5 && castOrder <= 20 ? 24 : (castOrder >= 21 && castOrder <= 42 ? 12 : 0))
        : 0;
      const vintageBonus = sourceMovieYear
        ? (sourceMovieYear <= 2000 ? 14 : (sourceMovieYear <= 2010 ? 7 : 0))
        : 0;
      let candidateScore = (titleCount * 130)
        + ((Number(knownFor.knownForPeakRank) || 0) * 34)
        + ((Number(knownFor.knownForDepth) || 0) * 22)
        + Math.min(24, popularity)
        + popularityBandBonus
        + characterBonus
        + vintageBonus
        - mainstreamPenalty;
      if (themeKey === 'actors' && picked.roleKey === 'actor') {
        const estimatedRank = rarityRank(derivePersonRarity(Object.assign({}, picked, knownFor), null));
        const existingHighTierCount = existingCards.filter(function (card) {
          return card && card.cardType === 'person' && rarityRank(card.rarity) >= 3;
        }).length;
        if (estimatedRank >= 4) candidateScore *= 0.52;
        else if (estimatedRank >= 3) candidateScore *= 0.82;
        if (existingHighTierCount >= 1 && estimatedRank >= 3) candidateScore *= 0.66;
        if (existingHighTierCount >= 2 && estimatedRank >= 2) candidateScore *= 0.52;
      }

      if (candidateScore > bestScore) {
        bestCandidate = picked;
        bestKnownFor = knownFor;
        bestScore = candidateScore;
      }

      if (titleCount >= 3) {
        bestCandidate = picked;
        bestKnownFor = knownFor;
        break;
      }
    }

    if (!bestCandidate) {
      return null;
    }

    const resolvedKnownFor = {
      knownForTitles: Array.isArray(bestKnownFor && bestKnownFor.knownForTitles) ? bestKnownFor.knownForTitles.slice(0, 3) : [],
      knownForPeakRank: Number(bestKnownFor && bestKnownFor.knownForPeakRank) || 0,
      knownForDepth: Number(bestKnownFor && bestKnownFor.knownForDepth) || 0
    };

    const biography = await fetchPersonBio(bestCandidate.personId, false).catch(function () { return ''; });

    return buildPersonCard(Object.assign({}, bestCandidate, resolvedKnownFor, {
      biography: biography,
      fallbackKnownForTitles: []
    }), sourceById[String(bestCandidate.sourceMovieId)] || validMovies[0]);
  }

  function buildFlavorTags(movie) {
    const tags = [];
    const year = movieYearNumber(movie);

    if (movie.voteAverage >= 8.0 && movie.voteCount >= 1200) tags.push('Awards Favorite');
    if (movieHasTag(movie, 'international') && movie.voteAverage >= 7.5) tags.push('Festival Favorite');
    if (movieHasTag(movie, 'horror') && year && year <= 2005) tags.push('Cult Classic');
    if (movieHasTag(movie, 'horror') && rarityRank(movie.rarity) > 1) tags.push('Midnight Movie');
    if (movieHasTag(movie, 'noir') && year && year <= 1975) tags.push('Noir Staple');
    if (movieHasTag(movie, 'female')) tags.push('Auteur Vision');
    if (movie.voteCount >= 2500) tags.push('Crowd Favorite');
    if (year && year <= 1980) tags.push('Classic Pick');
    if (movie.originalLanguage && String(movie.originalLanguage).toLowerCase() !== 'en') tags.push('World Cinema');

    return tags;
  }

  function buildPersonAwardTag(movie) {
    if (!movie || movie.cardType !== 'person') return '';
    const bio = String(movie.biography || movie.desc || '');
    if (/\b(oscar|academy award)\b[\s\S]{0,40}\b(winner|won)\b/i.test(bio) || /\bwon\b[\s\S]{0,40}\b(oscar|academy award)\b/i.test(bio)) {
      return 'Award Winner';
    }
    if (/\b(oscar|academy award)\b[\s\S]{0,40}\b(nominee|nominated)\b/i.test(bio) || /\bnominated\b[\s\S]{0,40}\b(oscar|academy award)\b/i.test(bio)) {
      return 'Award Nominee';
    }
    const peak = Number(movie.knownForPeakRank) || 0;
    const depth = Number(movie.knownForDepth) || 0;
    const popularity = Number(movie.popularity) || 0;
    if (peak >= 4 && depth >= 3) return 'Award Circuit';
    if (peak >= 4 && depth >= 2 && popularity >= 20) return 'Award Circuit';
    return '';
  }

  function buildCardChips(movie) {

  function openExternalLink(card) {
    const href = resolveCardLink(card);
    if (!href) return;
    const link = document.createElement('a');
    link.href = href;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    link.click();
  }

  function attachPackCardInteractions(peelWrap, movie) {
    if (!peelWrap || !movie) return;

    let touchStartX = 0;
    let touchStartY = 0;
    let suppressTapUntil = 0;

    peelWrap.classList.add('is-interactive');

    peelWrap.addEventListener('click', function () {
      if (Date.now() < suppressTapUntil) return;
      openExternalLink(movie);
    });

    peelWrap.addEventListener('touchstart', function (event) {
      const touch = event.changedTouches && event.changedTouches[0];
      if (!touch) return;
      touchStartX = touch.clientX;
      touchStartY = touch.clientY;
    }, { passive: true });

    peelWrap.addEventListener('touchend', function (event) {
      const touch = event.changedTouches && event.changedTouches[0];
      if (!touch) return;

      const deltaX = touch.clientX - touchStartX;
      const deltaY = touch.clientY - touchStartY;

      if (Math.abs(deltaX) >= 44 && Math.abs(deltaY) <= 36) {
        suppressTapUntil = Date.now() + 450;
        if (deltaX < 0) {
          nextCard();
        } else {
          prevCard();
        }
      }
    }, { passive: true });
  }

      const roleMeta = roleLabelForDisplay(movie) || 'Film Figure';
      const chips = buildCardChips(movie);
      return '<div class="card ' + movie.rarity.toLowerCase() + '" style="border-color:' + rarityColor(movie.rarity) + '; background:' + buildCardBackground(movie.rarity) + '">'
        + '<div class="card-frame"></div>'
        + '<div class="card-header"><div class="card-title-meta"><div class="card-title">' + escapeHtml(movie.title) + '</div></div><div class="card-side-meta"><div class="card-rarity">' + escapeHtml(movie.rarity) + '</div><div class="card-year">' + escapeHtml(roleMeta) + '</div></div></div>'
        + '<div class="card-img-wrap">' + bookmarkMarkup + '<img class="card-img" src="' + escapeHtml(resolveArt(movie)) + '" alt="' + escapeHtml(movie.title) + ' portrait"' + cardImageAttrs('low') + ' data-title="' + escapeHtml(movie.title) + '" data-rarity="' + escapeHtml(movie.rarity) + '" data-genre="' + escapeHtml(roleMeta) + '"></div>'
        + '<div class="card-body">' + (chips.length ? ('<div class="chips">' + chips.join('') + '</div>') : '') + '<div class="desc">' + escapeHtml(movie.desc) + '</div></div>'
        + '</div>';
    }

    const quote = QUOTES[movie.title] || '';
    const chips = buildCardChips(movie);
    const quoteMarkup = quote ? '<div class="quote">“' + escapeHtml(quote) + '”</div>' : '';
    return '<div class="card ' + movie.rarity.toLowerCase() + '" style="border-color:' + rarityColor(movie.rarity) + '; background:' + buildCardBackground(movie.rarity) + '">'
      + '<div class="card-frame"></div>'
      + '<div class="card-header"><div class="card-title-meta"><div class="card-title">' + escapeHtml(movie.title) + '</div></div><div class="card-side-meta"><div class="card-rarity">' + escapeHtml(movie.rarity) + '</div>' + (movie.year ? '<div class="card-year">' + escapeHtml(movie.year) + '</div>' : '') + '</div></div>'
      + '<div class="card-img-wrap">' + bookmarkMarkup + '<img class="card-img" src="' + escapeHtml(resolveArt(movie)) + '" alt="' + escapeHtml(movie.title) + ' artwork"' + cardImageAttrs('low') + ' data-poster="' + escapeHtml(movie.poster || '') + '" data-still="' + escapeHtml(movie.still || '') + '" data-title="' + escapeHtml(movie.title) + '" data-rarity="' + escapeHtml(movie.rarity) + '" data-genre="' + escapeHtml(movie.genre) + '">' + (movie.directorName ? '<div class="card-director-overlay">Dir. ' + escapeHtml(movie.directorName) + '</div>' : '') + '</div>'
      + '<div class="card-body"><div class="chips">' + chips.join('') + '</div><div class="desc">' + escapeHtml(movie.desc) + '</div>' + quoteMarkup + '</div>'
      + '</div>';
  }

  function addImageFallbacks(root) {
    root.querySelectorAll('img').forEach(function (img) {
      if (img.dataset.bound === 'true') return;
      img.dataset.bound = 'true';
      img.addEventListener('error', function () {
        if (img.dataset.triedPoster !== 'true' && img.dataset.poster) {
          img.dataset.triedPoster = 'true';
          img.src = proxied(img.dataset.poster) || img.dataset.poster;
          return;
        }
        if (img.dataset.triedStill !== 'true' && img.dataset.still) {
          img.dataset.triedStill = 'true';
          img.src = proxied(img.dataset.still) || img.dataset.still;
          return;
        }
        img.src = makePosterDataUri({
          title: img.dataset.title || 'Unknown',
          rarity: img.dataset.rarity || 'Base',
          genre: img.dataset.genre || 'Film'
        });
      });
    });
  }

  function attachBookmarkButtons(root, resolveCard) {
    root.querySelectorAll('.bookmark-btn').forEach(function (button) {
      if (button.dataset.bound === 'true') return;
      button.dataset.bound = 'true';
      button.addEventListener('click', function (event) {
        event.preventDefault();
        event.stopPropagation();
        const card = resolveCard(button);
        if (!card) return;
        const bookmarked = toggleBookmark(card);
        button.classList.toggle('is-bookmarked', bookmarked);
        if (collectionPage.classList.contains('active')) {
          renderCollection();
        }
      });
    });
  }

  function attachShowcaseButtons(root, resolveCard) {
    root.querySelectorAll('.showcase-btn').forEach(function (button) {
      if (button.dataset.bound === 'true') return;
      button.dataset.bound = 'true';
      button.addEventListener('click', function (event) {
        event.preventDefault();
        event.stopPropagation();
        const card = resolveCard(button);
        if (!card) return;
        const result = toggleShowcase(card);
        if (result.blocked === 'full') {
          showToast('Showcase is full. Make a lil room on your shelf!');
          return;
        }
        button.classList.toggle('is-active', result.active);
        renderShowcase();
        if (collectionPage.classList.contains('active')) {
          renderCollection();
        }
      });
    });
  }

  function matchesCollectionFilter(card) {
    if (collectionFilter === 'all') return true;
    if (collectionFilter === 'bookmarked') return isBookmarked(card);
    if (collectionFilter === 'films') return (card.cardType || 'film') === 'film';
    if (collectionFilter === 'people') return (card.cardType || 'film') === 'person';
    if (collectionFilter === 'actors') return card.cardType === 'person' && card.roleKey === 'actor';
    if (collectionFilter === 'directors') return card.cardType === 'person' && card.roleKey === 'director';
    if (collectionFilter === 'crew') return card.cardType === 'person' && card.roleKey !== 'actor' && card.roleKey !== 'director';
    return card.rarity === collectionFilter;
  }

  function getShowcaseCards() {
    const changed = normalizeShowcaseState();
    if (changed) {
      try {
        localStorage.setItem('filmtcg.showcase', JSON.stringify(showcase));
      } catch (error) {
      }
    }
    return showcase.map(function (key) {
      return collection.find(function (card) { return cardKey(card) === key; }) || null;
    }).filter(Boolean).slice(0, MAX_SHOWCASE_SIZE);
  }

  function renderShowcase() {
    const cards = getShowcaseCards();
    const slots = [];

    for (let i = 0; i < MAX_SHOWCASE_SIZE; i += 1) {
      const card = cards[i];
      if (!card) {
        slots.push('<div class="showcase-slot"><div class="showcase-slot-label">Top ' + String(i + 1) + '</div></div>');
      } else {
        slots.push('<div class="showcase-card" role="button" tabindex="0" draggable="' + (showcaseEditMode ? 'true' : 'false') + '" data-showcase-index="' + String(i) + '" style="' + escapeHtml(collectionShellStyle(card)) + '">'
          + '<button class="showcase-remove-btn" type="button" aria-label="Remove from showcase" data-showcase-remove="' + String(i) + '">&#10005;</button>'
          + '<div class="showcase-card-preview">' + buildShelfCardMarkup(card) + '</div>'
          + '</div>');
      }
    }

    showcasePanel.classList.toggle('is-editing', showcaseEditMode);
    showcasePanel.innerHTML = '<div class="showcase-head"><div><div class="showcase-title"><span class="showcase-title-icon" aria-hidden="true">&#127942;</span>Top 4 Showcase</div><div class="showcase-sub">Pin favorite pulls and flex the weird stuff.</div></div><div class="showcase-head-actions"><button id="showcaseEditButton" class="showcase-edit-btn' + (showcaseEditMode ? ' is-active' : '') + '" type="button">' + (showcaseEditMode ? 'Done' : 'Edit Showcase') + '</button><div class="pack-hook">Pinned ' + String(cards.length) + ' / ' + String(MAX_SHOWCASE_SIZE) + '</div></div></div>'
      + '<div class="showcase-grid">' + slots.join('') + '</div>';

    addImageFallbacks(showcasePanel);
    const showcaseEditButton = document.getElementById('showcaseEditButton');
    if (showcaseEditButton) {
      showcaseEditButton.addEventListener('click', function () {
        showcaseEditMode = !showcaseEditMode;
        renderShowcase();
      });
    }
    showcasePanel.querySelectorAll('.showcase-card').forEach(function (button) {
      button.addEventListener('click', function () {
        if (showcaseEditMode) return;
        const card = cards[Number(button.dataset.showcaseIndex)];
        if (card) openCollectionModal(card);
      });
      button.addEventListener('keydown', function (event) {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          if (showcaseEditMode) return;
          const card = cards[Number(button.dataset.showcaseIndex)];
          if (card) openCollectionModal(card);
        }
      });
      button.addEventListener('dragstart', function (event) {
        if (!showcaseEditMode) {
          event.preventDefault();
          return;
        }
        draggedShowcaseIndex = Number(button.dataset.showcaseIndex);
        button.classList.add('is-dragging');
        if (event.dataTransfer) {
          event.dataTransfer.effectAllowed = 'move';
          event.dataTransfer.setData('text/plain', String(draggedShowcaseIndex));
        }
      });
      button.addEventListener('dragover', function (event) {
        if (!showcaseEditMode) return;
        event.preventDefault();
        if (draggedShowcaseIndex == null) return;
        button.classList.add('is-drop-target');
      });
      button.addEventListener('dragleave', function () {
        button.classList.remove('is-drop-target');
      });
      button.addEventListener('drop', function (event) {
        if (!showcaseEditMode) return;
        event.preventDefault();
        const targetIndex = Number(button.dataset.showcaseIndex);
        button.classList.remove('is-drop-target');
        if (draggedShowcaseIndex == null) return;
        moveShowcaseItem(draggedShowcaseIndex, targetIndex);
        draggedShowcaseIndex = null;
        renderShowcase();
      });
      button.addEventListener('dragend', function () {
        draggedShowcaseIndex = null;
        showcasePanel.querySelectorAll('.showcase-card').forEach(function (cardButton) {
          cardButton.classList.remove('is-dragging');
          cardButton.classList.remove('is-drop-target');
        });
      });
    });
    showcasePanel.querySelectorAll('.showcase-remove-btn').forEach(function (button) {
      button.addEventListener('click', function (event) {
        event.preventDefault();
        event.stopPropagation();
        const index = Number(button.dataset.showcaseRemove);
        const card = cards[index];
        if (!card) return;
        toggleShowcase(card);
        renderShowcase();
        if (collectionPage.classList.contains('active')) {
          renderCollection();
        }
      });
    });
  }

      + '<div class="reward-pack-caption">' + escapeHtml(leftTheme.label) + '</div>'
      + '</button>'
      + '<button class="reward-pack-option is-right" type="button" data-reward-theme="' + escapeHtml(rightThemeKey) + '">'
      + buildPackFaceMarkup(rightThemeKey)
      + '<div class="reward-pack-caption">' + escapeHtml(rightTheme.label) + '</div>'
      + '</button>'
      + '</div>'
      + '</div>'
      + '<div class="pull-bottom-stage"><div class="pull-bottom-placeholder" aria-hidden="true"></div></div>'
      + '</div>';
  }

  function currentScrollTop() {
    return window.pageYOffset
      || document.documentElement.scrollTop
      || document.body.scrollTop
      || 0;
  }

  function restoreScrollTop(targetTop) {
    if (!Number.isFinite(targetTop)) return;
    window.requestAnimationFrame(function () {
      const doc = document.documentElement;
      const maxScroll = Math.max(0, (doc ? doc.scrollHeight : document.body.scrollHeight) - window.innerHeight);
      const clamped = Math.max(0, Math.min(targetTop, maxScroll));
      window.scrollTo(0, clamped);
    });
  }

  function renderRewardChoicePrompt() {
    pullArea.innerHTML = buildRewardChoiceMarkup();
    pullArea.querySelectorAll('.reward-pack-option').forEach(function (button) {
      button.addEventListener('click', function (event) {
        if (event) event.preventDefault();
        button.blur();
        chooseRewardPack('featured', button.getAttribute('data-reward-theme'), button);
      });
    });
  }

  function renderRewardOpeningShell(themeKey, statusText) {
    const resolvedThemeKey = PACK_THEMES[themeKey] ? themeKey : 'all';
    pullArea.innerHTML = '<div class="pull-open-shell is-stage">'
      + '<div class="pull-top-rail">'
      + buildPackHookMarkup()
      + '<div class="status-line is-loading">' + escapeHtml(statusText || 'Loading your reward pack...') + '</div>'
      + '</div>'
      + '<div class="pull-center-stage">'
      + buildPackFaceMarkup(resolvedThemeKey, {
        id: 'rewardOpenPackFace',
        extraClasses: 'is-loading'
      })
      + '</div>'
      + '<div class="pull-bottom-stage"><div class="pull-bottom-placeholder" aria-hidden="true"></div></div>'
      + '</div>';
    return {
      packElement: document.getElementById('rewardOpenPackFace'),
      statusElement: pullArea.querySelector('.status-line')
    };
  }

  function backToPacks() {
    if (!isPoolLoading && Math.max(0, Number(progress.rewardChoicesAvailable) || 0) > 0 && !activeRewardSelection) {
      renderRewardChoicePrompt();
      return;
    }

    if (!isPoolLoading && selectedPackMode === 'all-packs' && !activeRewardSelection) {
      resolvePackTheme(false);
    }

    pullArea.innerHTML = buildPackMarkup();
    const button = document.getElementById('openPackButton');
    if (isPoolLoading) return;
    button.addEventListener('click', openPack);
    button.addEventListener('keydown', function (event) {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        openPack();
      }
    });
  }

  async function restorePoolAfterReward() {
    const restoredFromSnapshot = restoreRewardPoolSnapshot();
    if (restoredFromSnapshot) {
      needsPoolRestoreAfterReward = false;
      resolvePackTheme(true);
      updatePackMeta();
      backToPacks();
      return;
    }

    if (!needsPoolRestoreAfterReward || dataSourceLabel.indexOf('TMDB') === -1) {
      needsPoolRestoreAfterReward = false;
      resolvePackTheme(true);
      updatePackMeta();
      backToPacks();
      return;
    }

    isPoolLoading = true;
    artworkStatus = 'Restoring the pack shelf...';
    resolvePackTheme(true);
    updatePackMeta();
    backToPacks();

    try {
      if (selectedPackMode !== 'all-packs') {
        await fetchThemedDynamicCardPool(selectedPackMode, false);
      } else {
        await fetchDynamicCardPool(false);
      }
    } catch (error) {
    }

    isPoolLoading = false;
    needsPoolRestoreAfterReward = false;
    resolvePackTheme(true);
    updatePackMeta();
    backToPacks();
  }

  async function chooseRewardPack(choiceKey, themeKey, selectedButton) {
    if (isOpeningPack || isPoolLoading) return;
    isOpeningPack = true;
    const lockedScrollTop = currentScrollTop();
    const keepViewport = function () {
      restoreScrollTop(lockedScrollTop);
    };

    const rewardChoice = 'featured';
    const rewardThemes = ensureFeaturedRewardThemes(false);
    const resolvedFeaturedTheme = themeKey || rewardThemes[0] || 'horror';

    snapshotRewardPoolState();

    activeRewardSelection = rewardChoice;
    progress.featuredRewardTheme = resolvedFeaturedTheme;

    const optionButtons = Array.from(pullArea.querySelectorAll('.reward-pack-option'));
    const rewardGrid = pullArea.querySelector('.reward-choice-grid');
    const rewardCopy = pullArea.querySelector('.reward-choice-copy');
    optionButtons.forEach(function (button) {
      button.disabled = true;
      if (button === selectedButton) {
        button.classList.add('is-selected');
      } else {
        button.classList.add('is-dismissed');
      }
    });
    if (rewardGrid) {
      rewardGrid.classList.add('is-committing');
    }
    if (rewardCopy) {
      rewardCopy.classList.add('is-fading');
    }
    if (selectedButton) {
      selectedButton.classList.add('is-committing');
    }

    const previewStatusLine = pullArea.querySelector('.status-line');
    if (previewStatusLine) {
      previewStatusLine.classList.add('is-fading');
    }
    keepViewport();

    await new Promise(function (resolve) { setTimeout(resolve, 160); });
    keepViewport();

    const openingUi = renderRewardOpeningShell(resolvedFeaturedTheme, 'Loading your reward pack...');
    const statusLine = openingUi.statusElement;
    const selectedPackFace = openingUi.packElement;
    keepViewport();

    await new Promise(function (resolve) { setTimeout(resolve, 220); });
    keepViewport();

    if (statusLine) {
      statusLine.textContent = 'Locking in your pick...';
      statusLine.classList.add('is-loading');
    }
    keepViewport();

    try {
      if (dataSourceLabel.indexOf('TMDB') !== -1) {
        currentPackTheme = resolvedFeaturedTheme || 'horror';
        if (getPackPool(currentPackTheme).length < Math.max(PACK_SIZE * 10, 80)) {
          await fetchThemedDynamicCardPool(currentPackTheme, false).catch(function () { return false; });
        }
        activeReelSeenTitles = new Set();
        needsPoolRestoreAfterReward = selectedPackMode === 'all-packs' || selectedPackMode !== currentPackTheme;
      } else {
        currentPackTheme = resolvedFeaturedTheme || 'horror';
        needsPoolRestoreAfterReward = false;
      }

      updatePackMeta();
      keepViewport();
      if (statusLine) {
        statusLine.textContent = 'Shuffling reward pack...';
      }
      const draftedPack = await buildDraftPack(getPackPool(currentPackTheme), {
        themeKey: currentPackTheme,
        forceRewardBehavior: true
      });
      if (selectedPackFace) {
        selectedPackFace.classList.remove('is-loading');
        applyPackCueToElement(selectedPackFace, draftedPack);
        selectedPackFace.classList.add('opening');
        selectedPackFace.classList.add('is-shuffling');
      }
      await new Promise(function (resolve) { setTimeout(resolve, 860); });
      keepViewport();
      await finalizePackOpen(draftedPack, {
        themeKey: currentPackTheme,
        isRewardPack: true
      });
      keepViewport();
    } catch (error) {
      console.error('[filmTCG] chooseRewardPack failed', error);
      activeRewardSelection = null;
      progress.featuredRewardTheme = null;
      needsPoolRestoreAfterReward = false;
      const restored = restoreRewardPoolSnapshot();
      if (!restored) {
        resolvePackTheme(true);
      }
      artworkStatus = 'Reward pack stalled before opening. Pick again.';
      updatePackMeta();
      backToPacks();
      showToast('Reward pack stalled. Pick again.');
    } finally {
      isOpeningPack = false;
      keepViewport();
    }
  }

  function weightedChoice(entries) {
    const total = entries.reduce(function (sum, entry) { return sum + entry.weight; }, 0);
    let roll = Math.random() * total;
    for (let i = 0; i < entries.length; i += 1) {
      roll -= entries[i].weight;
      if (roll <= 0) return entries[i];
    }
    return entries[entries.length - 1];
  }

  function cloneMovie(movie) {
    return normalizeMovieRecord(movie);
  }

  function snapshotRewardPoolState() {
    rewardPoolSnapshot = {
      movies: Array.isArray(movies) ? movies.map(cloneMovie) : [],
      dataSourceLabel: dataSourceLabel,
      currentPackTheme: currentPackTheme,
      activeReelCycleKey: activeReelCycleKey,
      activeReelThemeKey: activeReelThemeKey,
      activeReelSeenTitles: Array.from(activeReelSeenTitles || [])
    };
  }

  function restoreRewardPoolSnapshot() {
    if (!rewardPoolSnapshot || !Array.isArray(rewardPoolSnapshot.movies) || !rewardPoolSnapshot.movies.length) {
      return false;
    }
    movies = rewardPoolSnapshot.movies.map(cloneMovie);
    dataSourceLabel = rewardPoolSnapshot.dataSourceLabel || dataSourceLabel;
    currentPackTheme = rewardPoolSnapshot.currentPackTheme || currentPackTheme;
    activeReelCycleKey = rewardPoolSnapshot.activeReelCycleKey != null ? rewardPoolSnapshot.activeReelCycleKey : activeReelCycleKey;
    activeReelThemeKey = rewardPoolSnapshot.activeReelThemeKey != null ? rewardPoolSnapshot.activeReelThemeKey : activeReelThemeKey;
    activeReelSeenTitles = new Set(Array.isArray(rewardPoolSnapshot.activeReelSeenTitles) ? rewardPoolSnapshot.activeReelSeenTitles : []);
    rewardPoolSnapshot = null;
    return true;
  }

  function chooseCandidateWithAvoidance(candidates, excludedTitles, avoidedTitles, ownedTitles) {
    const excluded = excludedTitles || new Set();
    const avoided = avoidedTitles || new Set();
    const owned = ownedTitles || new Set();
    let filtered = (candidates || []).filter(function (movie) {
      const key = filmIdentityKey(movie);
      return key && !excluded.has(key) && !avoided.has(key) && !owned.has(key);
    });

    if (!filtered.length) {
      filtered = (candidates || []).filter(function (movie) {
        const key = filmIdentityKey(movie);
        return key && !excluded.has(key) && !avoided.has(key);
      });
    }

    if (!filtered.length) {
      filtered = (candidates || []).filter(function (movie) {
        const key = filmIdentityKey(movie);
        return key && !excluded.has(key) && !owned.has(key);
      });
    }

    if (!filtered.length) {
      filtered = (candidates || []).filter(function (movie) {
        const key = filmIdentityKey(movie);
        return key && !excluded.has(key);
      });
    }

    if (!filtered.length) filtered = (candidates || []).slice();
    return filtered.length ? filtered[Math.floor(Math.random() * filtered.length)] : null;
  }

  function filterMovieCandidatesByMode(candidates, excludedTitles, avoidedTitles, ownedTitles, mode) {
    const excluded = excludedTitles || new Set();
    const avoided = avoidedTitles || new Set();
    const owned = ownedTitles || new Set();
    const source = Array.isArray(candidates) ? candidates : [];
    return source.filter(function (movie) {
      const key = filmIdentityKey(movie);
      if (!key || excluded.has(key)) return false;
      if (mode === 'fresh') return !avoided.has(key) && !owned.has(key);
      if (mode === 'notRecent') return !avoided.has(key);
      if (mode === 'notOwned') return !owned.has(key);
      return true;
    });
  }

  function buildAvoidedTitleSet(poolSize) {
    const recentWindow = recentExclusionWindowForPool(poolSize);
    const avoided = buildRecentPullSet(recentWindow);
    const activeWindow = Math.max(12, Math.min(48, Math.round(recentWindow * 0.75)));
    const activeKeys = Array.from(activeReelSeenTitles || []);
    activeKeys.slice(-activeWindow).forEach(function (key) {
      avoided.add(key);
    });
    return avoided;
  }

  function filterMovieCandidatesByFreshness(candidates, excludedTitles, avoidedTitles, ownedTitles) {
    const excluded = excludedTitles || new Set();
    const avoided = avoidedTitles || new Set();
    const owned = ownedTitles || new Set();
    const source = Array.isArray(candidates) ? candidates : [];
    const fresh = source.filter(function (movie) {
      const key = filmIdentityKey(movie);
      return key && !excluded.has(key) && !avoided.has(key) && !owned.has(key);
    });
    if (fresh.length) return fresh;

    const notRecent = source.filter(function (movie) {
      const key = filmIdentityKey(movie);
      return key && !excluded.has(key) && !avoided.has(key);
    });
    if (notRecent.length) return notRecent;

    const notOwned = source.filter(function (movie) {
      const key = filmIdentityKey(movie);
      return key && !excluded.has(key) && !owned.has(key);
    });
    if (notOwned.length) return notOwned;

    return source.filter(function (movie) {
      const key = filmIdentityKey(movie);
      return key && !excluded.has(key);
    });
  }

  function orderedRarityCandidates(targetRarity, buckets, forceLowOnly, avoidRarity) {
    const baseOrder = ['Base', 'Select', 'Epic', 'Legendary'].filter(function (rarity) {
      return buckets[rarity] && buckets[rarity].length;
    });
    const constrained = forceLowOnly
      ? baseOrder.filter(function (rarity) { return rarityRank(rarity) <= 2; })
      : baseOrder.slice();
    const source = constrained.length ? constrained : baseOrder;
    const targetRank = rarityRank(targetRarity || 'Base');
    const sorted = source.slice().sort(function (a, b) {
      const distance = Math.abs(rarityRank(a) - targetRank) - Math.abs(rarityRank(b) - targetRank);
      if (distance !== 0) return distance;
      return rarityRank(a) - rarityRank(b);
    });
    if (avoidRarity && sorted.length > 1) {
      const withoutAvoid = sorted.filter(function (rarity) { return rarity !== avoidRarity; });
      const avoid = sorted.filter(function (rarity) { return rarity === avoidRarity; });
      return withoutAvoid.concat(avoid);
    }
    return sorted;
  }

  function chooseMovieForPack(pool, excludedTitles, guaranteedHighRarity, ownedTitles, options) {
    const buckets = {};
    const avoidedTitles = buildAvoidedTitleSet(Array.isArray(pool) ? pool.length : 0);
    const preferredOwnedTitles = ownedTitles || buildOwnedFilmTitleSet();
    const config = options || {};
    const draftedCards = Array.isArray(config.draftedCards) ? config.draftedCards : [];
    const isRewardPack = Boolean(config.isRewardPack);
    const remainingSlots = Math.max(0, Number(config.remainingSlots) || 0);
    const totalFilmSlots = Math.max(1, Number(config.totalFilmSlots) || PACK_SIZE);
    const rarityCounts = draftedCards.reduce(function (counts, card) {
      if (!card || card.cardType === 'person') return counts;
      const rarity = normalizeRarityLabel(card.rarity);
      counts[rarity] = (counts[rarity] || 0) + 1;
      return counts;
    }, { Base: 0, Select: 0, Epic: 0, Legendary: 0 });
    const filmCardsDrafted = (rarityCounts.Base || 0) + (rarityCounts.Select || 0) + (rarityCounts.Epic || 0) + (rarityCounts.Legendary || 0);
    const colorCount = (rarityCounts.Select || 0) + (rarityCounts.Epic || 0) + (rarityCounts.Legendary || 0);
    const softBaseTarget = Math.max(1, Math.floor(totalFilmSlots * 0.34));
    const baseDeficit = Math.max(0, softBaseTarget - (rarityCounts.Base || 0));
    const highTierCount = (rarityCounts.Epic || 0) + (rarityCounts.Legendary || 0);
    const lowTierCount = (rarityCounts.Base || 0) + (rarityCounts.Select || 0);
    const nonRewardPack = !isRewardPack;
    const needLowTierBackfill = nonRewardPack
      && remainingSlots > 0
      && (lowTierCount === 0 || (highTierCount >= PACK_HIGH_TIER_CAP && lowTierCount < 2));
    const forceLowOnly = nonRewardPack && (highTierCount >= PACK_HIGH_TIER_CAP || needLowTierBackfill);
    let avoidRarity = null;
    if (nonRewardPack && draftedCards.length >= PACK_MONO_STREAK_LIMIT) {
      const recent = draftedCards.slice(-PACK_MONO_STREAK_LIMIT).filter(function (card) { return card && card.cardType !== 'person'; });
      if (recent.length === PACK_MONO_STREAK_LIMIT) {
        const firstRarity = normalizeRarityLabel(recent[0].rarity);
        const monochrome = recent.every(function (card) {
          return normalizeRarityLabel(card.rarity) === firstRarity;
        });
        if (monochrome && firstRarity !== 'Base') {
          avoidRarity = firstRarity;
        }
      }
    }

    pool.forEach(function (movie) {
      if (!buckets[movie.rarity]) buckets[movie.rarity] = [];
      buckets[movie.rarity].push(movie);
    });

    function chooseAcrossRarities(rarities, mode) {
      const ordered = Array.isArray(rarities) ? rarities.filter(Boolean) : [];
      for (let i = 0; i < ordered.length; i += 1) {
        const rarity = ordered[i];
        const candidates = filterMovieCandidatesByMode(buckets[rarity] || [], excludedTitles, avoidedTitles, preferredOwnedTitles, mode);
        if (candidates.length) {
          return candidates[Math.floor(Math.random() * candidates.length)];
        }
      }
      return null;
    }

    if (guaranteedHighRarity) {
      let premiumCandidates = []
        .concat(buckets.Legendary || [])
        .concat(buckets.Epic || []);
      const premiumModes = ['fresh', 'notRecent', 'notOwned', 'any'];
      for (let modeIndex = 0; modeIndex < premiumModes.length; modeIndex += 1) {
        const premiumCandidatesByMode = filterMovieCandidatesByMode(
          premiumCandidates,
          excludedTitles,
          avoidedTitles,
          preferredOwnedTitles,
          premiumModes[modeIndex]
        );
        if (premiumCandidatesByMode.length) {
          return cloneMovie(premiumCandidatesByMode[Math.floor(Math.random() * premiumCandidatesByMode.length)]);
        }
      }
    }

    const availableOdds = PULL_ODDS.filter(function (entry) {
      if (!buckets[entry.rarity] || !buckets[entry.rarity].length) return false;
      if (forceLowOnly && rarityRank(entry.rarity) > 2) return false;
      return true;
    });
    const adjustedOdds = availableOdds.map(function (entry) {
      let weight = Number(entry.weight) || 0;
      if (nonRewardPack) {
        if (entry.rarity === 'Base') {
          weight *= 1 + (baseDeficit * 0.35) + (Math.max(0, colorCount - 2) * 0.2);
          if (remainingSlots > 0 && remainingSlots <= baseDeficit) {
            weight *= 1.25;
          }
        } else if (entry.rarity === 'Select') {
          if (colorCount >= 3) weight *= 0.86;
          if (colorCount >= 4) weight *= 0.68;
        } else {
          if (colorCount >= 1) weight *= 0.82;
          if (colorCount >= 2) weight *= 0.68;
          if (colorCount >= 3) weight *= 0.45;
          if (filmCardsDrafted >= 3) weight *= 0.88;
        }
      }
      return {
        rarity: entry.rarity,
        weight: Math.max(0.01, weight)
      };
    });
    const diversifiedOdds = (avoidRarity && adjustedOdds.some(function (entry) { return entry.rarity !== avoidRarity; }))
      ? adjustedOdds.filter(function (entry) { return entry.rarity !== avoidRarity; })
      : adjustedOdds;
    const oddsSource = diversifiedOdds.length ? diversifiedOdds : adjustedOdds;
    const pickedRarity = adjustedOdds.length ? weightedChoice(adjustedOdds).rarity : 'Base';
    const targetRarity = oddsSource.length ? weightedChoice(oddsSource).rarity : pickedRarity;
    let pickedMovie = null;
    const selectionModes = ['fresh', 'notRecent', 'notOwned', 'any'];
    const orderedRarities = orderedRarityCandidates(targetRarity, buckets, forceLowOnly, avoidRarity);

    for (let modeIndex = 0; modeIndex < selectionModes.length && !pickedMovie; modeIndex += 1) {
      pickedMovie = chooseAcrossRarities([targetRarity], selectionModes[modeIndex]);
    }

    if (!pickedMovie) {
      const fallbackRarities = orderedRarities.filter(function (rarity) { return rarity !== targetRarity; });
      for (let modeIndex = 0; modeIndex < selectionModes.length && !pickedMovie; modeIndex += 1) {
        pickedMovie = chooseAcrossRarities(fallbackRarities, selectionModes[modeIndex]);
      }
    }

    if (!pickedMovie) {
      pickedMovie = chooseCandidateWithAvoidance(pool, excludedTitles, avoidedTitles, preferredOwnedTitles);
    }

    return cloneMovie(pickedMovie || pool[Math.floor(Math.random() * pool.length)]);
  }

  function highestRarityInCards(cards) {
    const entries = Array.isArray(cards) ? cards : [];
    return entries.reduce(function (highest, card) {
      return rarityRank(card && card.rarity) > rarityRank(highest) ? normalizeRarityLabel(card.rarity) : highest;
    }, 'Base');
  }

  function applyPackCueToElement(element, cards) {
    if (!element) return;
    const highest = highestRarityInCards(cards);
    const palettes = {
      Base: {
        core: 'rgba(255,255,255,.94)',
        strong: 'rgba(255,255,255,.98)',
        soft: 'rgba(255,255,255,.34)',
        glow: 'rgba(255,255,255,.22)'
      },
      Select: {
        core: 'rgba(191,229,255,.98)',
        strong: '#60a5fa',
        soft: 'rgba(147,197,253,.36)',
        glow: 'rgba(96,165,250,.28)'
      },
      Epic: {
        core: 'rgba(235,210,255,.98)',
        strong: '#c084fc',
        soft: 'rgba(216,180,254,.38)',
        glow: 'rgba(192,132,252,.3)'
      },
      Legendary: {
        core: 'rgba(120,73,0,.98)',
        strong: '#92400e',
        soft: 'rgba(146,64,14,.24)',
        glow: 'rgba(180,83,9,.22)'
      }
    };
    const palette = palettes[highest] || palettes.Base;
    element.style.setProperty('--pack-tear-core', palette.core);
    element.style.setProperty('--pack-tear-core-strong', palette.strong);
    element.style.setProperty('--pack-tear-soft', palette.soft);
    element.style.setProperty('--pack-tear-glow', palette.glow);
  }

  function buildDraftPack(pool, options) {
    const config = options || {};
    const packThemeKey = String(config.themeKey || currentPackTheme || 'all').toLowerCase();
    const forceRewardBehavior = Boolean(config.forceRewardBehavior);
    const sourcePool = Array.isArray(pool) ? pool : [];
    if (!sourcePool.length) return Promise.resolve([]);
    const drafted = [];
    const seenTitles = new Set();
    const ownedTitles = buildOwnedFilmTitleSet();
    const isRewardPack = forceRewardBehavior;
    const isBoostedRewardPack = isRewardPack;
    const shouldTryPersonInsert = sourcePool.some(function (movie) {
      return movie && movie.cardType !== 'person' && Number(movie.tmdbId) > 0;
    });
    const actorPackPersonSlots = packThemeKey === 'actors' && shouldTryPersonInsert ? 4 : 0;
    const personSlots = actorPackPersonSlots || (shouldTryPersonInsert ? 1 : 0);
    const filmSlots = Math.max(0, PACK_SIZE - personSlots);

    for (let i = 0; i < filmSlots; i += 1) {
      const movie = chooseMovieForPack(sourcePool, seenTitles, isBoostedRewardPack && i === 0, ownedTitles, {
        draftedCards: drafted,
        isRewardPack: isBoostedRewardPack,
        remainingSlots: filmSlots - i,
        totalFilmSlots: filmSlots
      });
      drafted.push(movie);
      const movieKey = filmIdentityKey(movie);
      if (sourcePool.length > PACK_SIZE && movieKey) seenTitles.add(movieKey);
    }

    const fillFallbacks = function () {
      while (drafted.length < PACK_SIZE) {
        const remainingFilmSlots = Math.max(1, PACK_SIZE - drafted.length);
        const fallbackMovie = chooseMovieForPack(sourcePool, seenTitles, false, ownedTitles, {
          draftedCards: drafted,
          isRewardPack: isBoostedRewardPack,
          remainingSlots: remainingFilmSlots,
          totalFilmSlots: filmSlots
        });
        drafted.push(fallbackMovie);
        const fallbackKey = filmIdentityKey(fallbackMovie);
        if (sourcePool.length > PACK_SIZE && fallbackKey) seenTitles.add(fallbackKey);
      }
      return drafted;
    };

    if (!shouldTryPersonInsert) {
      return Promise.resolve(fillFallbacks());
    }

    const existingPersonKeys = new Set();
    const personInserts = [];
    let chain = Promise.resolve();

    for (let personIndex = 0; personIndex < personSlots; personIndex += 1) {
      chain = chain.then(function () {
        return maybeBuildPersonInsert(drafted, packThemeKey, isBoostedRewardPack, existingPersonKeys, personInserts)
          .catch(function () { return null; })
          .then(function (personInsert) {
            if (personInsert) {
              existingPersonKeys.add(personIdentityKey(personInsert));
              personInserts.push(personInsert);
            }
          });
      });
    }

    return chain
      .then(function () {
        if (packThemeKey === 'actors' && !personInserts.length && shouldTryPersonInsert) {
          return maybeBuildPersonInsert(drafted, packThemeKey, isBoostedRewardPack, existingPersonKeys, personInserts)
            .catch(function () { return null; })
            .then(function (personInsert) {
              if (personInsert) {
                existingPersonKeys.add(personIdentityKey(personInsert));
                personInserts.push(personInsert);
              }
            });
        }
        return null;
      })
      .then(function () {
        personInserts.forEach(function (personInsert) {
          drafted.push(personInsert);
        });
        return fillFallbacks();
      });
  }

  function sortPackForReveal(cards) {
    const ordered = shuffledCopy(Array.isArray(cards) ? cards : []);
    if (!ordered.length) return ordered;

    const highIndexes = [];
    for (let i = 0; i < ordered.length; i += 1) {
      if (ordered[i] && (ordered[i].rarity === 'Epic' || ordered[i].rarity === 'Legendary')) {
        highIndexes.push(i);
      }
    }

    if (highIndexes.length && Math.random() < 0.58) {
      const chosenIndex = highIndexes[Math.floor(Math.random() * highIndexes.length)];
      const picked = ordered.splice(chosenIndex, 1)[0];
      const finalLength = ordered.length + 1;
      const tailSpan = Math.min(3, finalLength);
      const tailStart = Math.max(0, finalLength - tailSpan);
      const target = tailStart + Math.floor(Math.random() * tailSpan);
      ordered.splice(target, 0, picked);
    }

    return ordered;
  }

  async function openOwnedPackFromInventory(options) {
    const config = options || {};
    const revealCarousel = config.revealCarousel !== false;
    if (isOpeningPack || isPoolLoading) return;
    const ownedPack = selectedOwnedPack();
    if (!ownedPack) {
      showToast('No owned packs ready.');
      return;
    }
    if (revealCarousel) {
      showPage('pull');
      updatePackMeta();
      backToPacks();
    }
    return await openPack({
      ownedPack: ownedPack,
      consumeOwnedPack: true,
      revealCarousel: revealCarousel,
      openingElement: config.openingElement || null,
      statusElement: config.statusElement || null
    });
  }

  async function openPack(options) {
    const openOptions = options || {};
    const ownedPack = openOptions.ownedPack || null;
    const hasOwnedPack = Boolean(ownedPack && ownedPack.id);
    const forcedThemeKey = openOptions.themeKey ? normalizeOwnedPackTheme(openOptions.themeKey) : '';
    const forceRewardOpen = Boolean(openOptions.forceRewardOpen);
    const ignoreRewardChoiceGate = Boolean(openOptions.ignoreRewardChoiceGate);
    if (activeRewardSelection && !forceRewardOpen && !hasOwnedPack) {
      activeRewardSelection = null;
    }
    const hasRewardChoiceReady = Math.max(0, Number(progress.rewardChoicesAvailable) || 0) > 0;
    if (!ignoreRewardChoiceGate && !hasOwnedPack && !forceRewardOpen && hasRewardChoiceReady && !activeRewardSelection) {
      renderRewardChoicePrompt();
      return;
    }
    const revealCarousel = openOptions.revealCarousel !== false;
    const packThemeForOpen = forcedThemeKey || (hasOwnedPack
      ? normalizeOwnedPackTheme(ownedPack.theme)
      : currentPackTheme);
    const ownedGoldBoost = hasOwnedPack && packThemeForOpen === 'gold';
    if (isOpeningPack || isPoolLoading) return;
    isOpeningPack = true;
    const currentPack = openOptions.openingElement || document.getElementById('openPackButton');
    const statusLineTarget = openOptions.statusElement || pullArea.querySelector('.status-line');
    if (currentPack) {
      currentPack.classList.add('is-loading');
      if (statusLineTarget) {
        statusLineTarget.textContent = hasOwnedPack
          ? ('Opening owned ' + ownedPackLabel(ownedPack) + '...')
          : 'Cracking a fresh pack...';
        statusLineTarget.classList.add('is-live');
      }
    }

    let openedSuccessfully = false;
    let openedPackCards = null;

    try {
      const requestedTheme = packThemeForOpen === 'all' ? '' : packThemeForOpen;
      const requestedReelThemeKey = hasOwnedPack
        ? ('owned:' + String(packThemeForOpen || 'all'))
        : (forceRewardOpen
          ? ('reward:' + String(packThemeForOpen || 'all'))
          : (selectedPackMode !== 'all-packs'
          ? String(currentPackTheme || selectedPackMode || 'theme')
          : 'all-packs'));
      const isRewardPackOpen = forceRewardOpen;
      const shouldRefreshReel = dataSourceLabel.indexOf('TMDB') !== -1 && (
        isRewardPackOpen ||
        activeReelCycleKey == null ||
        activeReelCycleKey !== currentLiveDrawCycleKey() ||
        activeReelThemeKey !== requestedReelThemeKey
      );

      if (currentPack) {
        if (statusLineTarget && shouldRefreshReel) {
          statusLineTarget.textContent = hasOwnedPack
            ? ('Preparing owned ' + ownedPackLabel(ownedPack) + '...')
            : (requestedTheme
              ? 'Pulling a fresh themed pack...'
              : 'Shuffling a fresh draw...');
        } else if (statusLineTarget) {
          statusLineTarget.textContent = hasOwnedPack
            ? ('Opening owned ' + ownedPackLabel(ownedPack) + '...')
            : 'Cracking a fresh pack...';
        }
      }

      let initialRefreshOk = true;
      if (shouldRefreshReel) {
        initialRefreshOk = await refreshPoolForPackOpen(false, requestedTheme).catch(function () { return false; });
      }

      await new Promise(function (resolve) { setTimeout(resolve, 120); });
      let openPool = getPackPool(packThemeForOpen);
      let forcedRefreshOk = true;
      if (dataSourceLabel.indexOf('TMDB') !== -1) {
        const freshCandidatesAvailable = countFreshFilmCandidates(openPool);
        if (freshCandidatesAvailable < filmSlotsForCurrentTheme(packThemeForOpen)) {
          forcedRefreshOk = await refreshPoolForPackOpen(true, requestedTheme).catch(function () { return false; });
          openPool = getPackPool(packThemeForOpen);
        }
      }
      const staleThemeAfterFailedRefresh = !requestedTheme
        && selectedPackMode === 'all-packs'
        && dataSourceLabel.indexOf('TMDB') !== -1
        && activeReelThemeKey !== requestedReelThemeKey
        && (!initialRefreshOk || !forcedRefreshOk);
      if (staleThemeAfterFailedRefresh) {
        throw new Error('Could not refresh back to the All Cinema deck.');
      }
      if (openPool.length < PACK_SIZE && !hasOwnedPack) resolvePackTheme(false);
      updatePackMeta();
      const draftedPack = await buildDraftPack(getPackPool(packThemeForOpen), {
        themeKey: packThemeForOpen,
        forceRewardBehavior: ownedGoldBoost || forceRewardOpen
      });

      if (hasOwnedPack && openOptions.consumeOwnedPack && Array.isArray(draftedPack) && draftedPack.length) {
        const consumed = removeOwnedPackById(ownedPack.id);
        if (consumed) {
          saveProgress();
          updatePackMeta();
          if (shopPage && shopPage.classList.contains('active')) {
            renderShop();
          }
        }
      }

      if (currentPack) {
        currentPack.classList.remove('is-loading');
        applyPackCueToElement(currentPack, draftedPack);
        currentPack.classList.add('opening');
        currentPack.classList.add('is-shuffling');
      }

      await new Promise(function (resolve) { setTimeout(resolve, 860); });

      openedPackCards = await finalizePackOpen(draftedPack, {
        revealCarousel: revealCarousel,
        themeKey: packThemeForOpen,
        isRewardPack: forceRewardOpen
      });
      openedSuccessfully = true;
    } catch (error) {
      console.error('[filmTCG] openPack failed', error);
      const errorMessage = String(error && error.message || error || '').toLowerCase();
      if (errorMessage.indexOf('all cinema deck') !== -1) {
        artworkStatus = 'Still switching back to the full All Cinema deck. Tap to retry.';
        showToast('Deck is still syncing back to All Cinema. Try again.');
      } else if (isQuotaExceededError(error)) {
        artworkStatus = 'Device storage ran out while saving this pull. Try again.';
        showToast('Storage is full on this device. Trimmed save data and retry.');
      } else if (errorMessage.indexOf('timeout') !== -1 || (error && error.name === 'AbortError')) {
        artworkStatus = 'Connection slowed down during pack open. Tap to retry.';
        showToast('Connection was slow. Tap to open again.');
      } else {
        artworkStatus = 'Pack opening hit a network hiccup. Tap to try again.';
        showToast('Pack opening stalled. Try again.');
      }
      updatePackMeta();
      if (revealCarousel) {
        backToPacks();
      } else if (shopPage && shopPage.classList.contains('active')) {
        renderShop();
      }
    } finally {
      if (!openedSuccessfully && currentPack) {
        currentPack.classList.remove('is-loading');
        currentPack.classList.remove('opening');
        currentPack.classList.remove('is-shuffling');
      }
      isOpeningPack = false;
    }
    return openedSuccessfully ? openedPackCards : null;
  }

  async function finalizePackOpen(draftedPack, options) {
    const finalizeOptions = options || {};
    const revealCarousel = finalizeOptions.revealCarousel !== false;
    const pool = getPackPool();
    if (!pool.length && !(draftedPack && draftedPack.length)) {
      artworkStatus = 'No cards available for that pack theme yet.';
      resolvePackTheme(true);
      updatePackMeta();
      if (revealCarousel) {
        backToPacks();
      }
      return [];
    }

    let resolvedPack = Array.isArray(draftedPack) && draftedPack.length ? draftedPack.slice() : await buildDraftPack(pool);
    const hasPersonCards = resolvedPack.some(function (card) {
      return card && card.cardType === 'person';
    });
    const collectionKeysBefore = new Set(collection.map(cardKey).filter(Boolean));
    applyDailyHuntsFromPack(resolvedPack, collectionKeysBefore, {
      themeKey: finalizeOptions.themeKey || currentPackTheme
    });
    const isRewardPack = Boolean(finalizeOptions.isRewardPack);
    resolvedPack.forEach(function (card) {
      collection.unshift(card);
      const cardKey = filmIdentityKey(card);
      if (cardKey) activeReelSeenTitles.add(cardKey);
    });

    if (isRewardPack) {
      progress.rewardChoicesAvailable = Math.max(0, progress.rewardChoicesAvailable - 1);
      progress.featuredRewardTheme = null;
      progress.featuredRewardThemes = [];
      progress.allPacksCinemaStreak = 0;
      artworkStatus = resolvedPack.some(function (card) { return card.cardType === 'person'; })
        ? 'Reward pack cracked. Premium pull plus a people insert delivered.'
        : 'Reward pack cracked. Premium pull delivered.';
      activeRewardSelection = null;
    } else {
      progress.standardPacksOpened += 1;
      if (selectedPackMode === 'all-packs') {
        progress.allPacksCinemaStreak = currentPackTheme === 'all'
          ? (progress.allPacksCinemaStreak + 1)
          : 0;
      } else {
        progress.allPacksCinemaStreak = 0;
      }
      if (progress.standardPacksOpened % REEL_REFRESH_INTERVAL === 0) {
        progress.rewardChoicesAvailable += 1;
        ensureFeaturedRewardThemes(true);
        artworkStatus = 'Reward choice unlocked. Pick one of two featured packs.';
      } else if (hasPersonCards) {
        artworkStatus = 'People insert found in the sixth slot.';
      }
    }

    rememberPulledTitles(resolvedPack);
    saveCollection();
    saveProgress();
    updatePackMeta();
    if (collectionPage && collectionPage.classList.contains('active')) {
      renderCollection();
    }
    if (shopPage && shopPage.classList.contains('active')) {
      renderShop();
    }
    if (hasPersonCards) {
      hydratePackPeopleInBackground(resolvedPack);
    }
    if (!revealCarousel) return resolvedPack;
    pack = sortPackForReveal(resolvedPack);
    index = 0;
    try {
      renderCarousel();
    } catch (error) {
      console.error('[filmTCG] renderCarousel failed after pack open', error);
      artworkStatus = 'Pack opened, but the viewer glitched. Tap Open More Packs and retry.';
      backToPacks();
    }
    return resolvedPack;
  }

  function renderCarousel() {
    if (!pack.length) {
      backToPacks();
      return;
    }

    const current = pack[index];
    try {
      preloadPackCards(pack, index);
    } catch (error) {
      console.warn('[filmTCG] carousel preload skipped', error);
    }
    const prevOne = index > 0 ? pack[index - 1] : null;
    const prevTwo = index > 1 ? pack[index - 2] : null;
    const nextOne = index < pack.length - 1 ? pack[index + 1] : null;
    const nextTwo = index < pack.length - 2 ? pack[index + 2] : null;
    const remainingAfter = Math.max(0, pack.length - index - 1);
    const seenBefore = Math.max(0, index);
    let ghostMarkup = '';

    if (seenBefore > 1 && prevTwo) ghostMarkup += buildGhostMarkup('is-left-2', prevTwo);
    if (seenBefore > 0 && prevOne) ghostMarkup += buildGhostMarkup('is-left-1', prevOne);
    if (remainingAfter > 1 && nextTwo) ghostMarkup += buildGhostMarkup('is-right-2', nextTwo);
    if (remainingAfter > 0 && nextOne) ghostMarkup += buildGhostMarkup('is-right-1', nextOne);

    pullArea.innerHTML = '<div class="carousel-wrap">'
      + '<div class="carousel-top-rail">'
      + '<div class="progress">Card ' + (index + 1) + ' of ' + pack.length + ' · ' + escapeHtml(dataSourceLabel) + '</div>'
      + buildPackHookMarkup()
      + '</div>'
      + '<div class="carousel">'
      + '<div class="overlap-stack">'
      + ghostMarkup
      + '<button id="prevArrow" type="button" class="arrow stack-arrow is-left" aria-label="Previous card">&#8592;</button>'
      + '<div class="overlap-count">' + String(remainingAfter) + '</div><div class="peel-card-wrap rarity-' + escapeHtml(String((current.rarity || 'Base')).toLowerCase()) + '">' + buildCardMarkup(current) + '</div>'
      + '<button id="nextArrow" type="button" class="arrow stack-arrow is-right" aria-label="Next card">&#8594;</button>'
      + '</div>'
      + '</div>'
      + '<button id="backToPacksButton" type="button" class="back-btn carousel-open-more-btn">Open More Packs</button>'
      + '</div>';

    document.getElementById('prevArrow').addEventListener('click', prevCard);
    document.getElementById('nextArrow').addEventListener('click', nextCard);
    document.getElementById('backToPacksButton').addEventListener('click', function () {
      restorePoolAfterReward();
    });
    addImageFallbacks(pullArea);
    attachBookmarkButtons(pullArea, function () { return current; });

    const peelWrap = pullArea.querySelector('.peel-card-wrap');
    attachPackCardInteractions(peelWrap, current);
    peelWrap.classList.add(lastPeelDirection === 'prev' ? 'is-peeling-in-prev' : 'is-peeling-in-next');
    setTimeout(function () {
      peelWrap.classList.remove('is-peeling-in-next');
      peelWrap.classList.remove('is-peeling-in-prev');
    }, 320);
  }

  function animateToCard(direction) {
    if (!pack.length || isAnimatingPeel) return;
    isAnimatingPeel = true;
    lastPeelDirection = direction === 'prev' ? 'prev' : 'next';
    const wrap = pullArea.querySelector('.peel-card-wrap');
    if (wrap) {
      wrap.classList.remove('is-peeling-in-next');
      wrap.classList.remove('is-peeling-in-prev');
      wrap.classList.add(direction === 'prev' ? 'is-peeling-out-prev' : 'is-peeling-out-next');
    }
    setTimeout(function () {
      index = direction === 'next'
        ? (index + 1) % pack.length
        : (index - 1 + pack.length) % pack.length;
      renderCarousel();
      setTimeout(function () { isAnimatingPeel = false; }, 340);
    }, 220);
  }

  function nextCard() { animateToCard('next'); }
  function prevCard() { animateToCard('prev'); }

  function closeCollectionModal() {
